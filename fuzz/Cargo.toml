# A workspace of its own, on purpose. `libfuzzer-sys` compiles the target with
# `-Z sanitizer=address`, which is nightly-only, and the host workspace pins a stable toolchain in
# `rust-toolchain.toml` with an MSRV job at 1.94. See the `exclude` comment in the root
# `Cargo.toml` and `README.md` here.
[workspace]

[package]
name = "tankovault-fuzz"
version = "0.0.0"
edition = "2024"
authors = ["TankoVault contributors"]
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tankovault-adapters = { path = "../crates/adapters" }
tankovault-fetch = { path = "../crates/fetch" }
# Default features only: the `axum` feature exists for the shared `/v1/solve` router and would
# link a web framework into a classifier fuzz target.
tankovault-solver = { path = "../crates/solver" }
# The `auth_jwt_verify` target.
tankovault-auth = { path = "../crates/auth" }
# The `config_env_load` target.
tankovault-config = { path = "../crates/config" }
tankovault-domain = { path = "../crates/domain" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }

# Versions here are the host workspace's, restated, not inherited: this is a workspace of its
# own (see the comment at the top), so `workspace = true` has nothing to resolve against. They
# must not drift *downwards* from the root `Cargo.toml`: a target that verifies a token with an
# older `jsonwebtoken` than the service does is measuring the wrong parser.
#
# `auth_jwt_verify` reads a token's own header with the same library the verifier uses, so the
# oracle compares what was validated against what the header says, not against a hand-rolled
# base64 decoder. `default-features = false` with `rust_crypto` matches the root manifest; the
# default feature set pulls a second crypto backend.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# `test` adds `figment::Jail`, which `config_env_load` needs to set and restore `TANKOVAULT_*`
# around each iteration. `crates/config` already carries the same feature as a dev-dependency.
figment = { version = "0.10", features = ["toml", "env", "test"] }
# The workspace's secret wrappers reach both `auth_jwt_verify` (the signing key) and
# `config_env_load` (the resolved internal token). Same major as the root manifest.
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

# `-Z sanitizer=address` instruments the crate under test, so the fuzz binary must be built
# with debug assertions on: the overflow checks that turned P-03's `(a - b).abs()` into a
# detectable panic instead of a silent wrap are part of what these targets are looking for.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

# `test`/`doc`/`bench = false`: a `fuzz_target!` binary has no `main` a test harness can call,
# and `cargo test` in here would fail to link.

[[bin]]
name = "adapters_html_parsers"
path = "fuzz_targets/adapters_html_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "adapters_json_body"
path = "fuzz_targets/adapters_json_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "adapters_generic_series_page"
path = "fuzz_targets/adapters_generic_series_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "solver_challenge_detection"
path = "fuzz_targets/solver_challenge_detection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_jwt_verify"
path = "fuzz_targets/auth_jwt_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_env_load"
path = "fuzz_targets/config_env_load.rs"
test = false
doc = false
bench = false
