name: auto-fix

# The one workflow that fixes a pull request mechanically and commits the result: both
# lockfiles, clippy's machine-applicable suggestions, `cargo fmt` and the four generated artefacts,
# built by one job and committed by another in one commit, and `README.md`, rendered from its
# template in a job of its own.
#
# What belongs here is decided by *determinism*, not convenience. Everything below has exactly one
# correct output given the tree, so a bot's answer is byte-identical to a human's and there is
# nothing to review in the diff it produces. Anything where the fix is a choice is deliberately
# absent; see the note on `repo-lint` at the bottom of this file.
#
# ---------------------------------------------------------------------------------------------
# Why one workflow, and why it must stay one
# ---------------------------------------------------------------------------------------------
# GitHub keeps at most *one* pending run per `concurrency.group`: a run arriving at a group that
# already has one running and one pending does not queue behind them, it cancels the pending one.
# Workflows that commit to the same branch must share a group or they race, so splitting these
# fixes across workflows forces a choice between racing pushes and silently dropped runs.
#
# Both halves of that choice break a release. A dropped lockfile sync merges both `Cargo.lock`
# files and `openapi.json` to `main` recording the old version against the new manifest, and
# every `--locked` build fails, release images included. A dropped artefact run leaves
# `test (workspace)` failing with `openapi.json is out of date` on a branch whose author has no
# command to run.
#
# Which run survives is decided by run-creation order: nothing a reader of these files can see,
# and nothing that reports a failure, since a dropped run is `cancelled` exactly like one
# superseded on purpose. One workflow in the group removes the choice instead of tuning it, and
# `repo-lint`'s `concurrency-groups-hold-one-workflow` fails if a second one joins.
#
# The cost is accepted: this job compiles the workspace for `clippy --fix`, so a pull request whose
# only problem is formatting waits for the whole run. A slower fix that always happens beats a
# fast one that a sibling can cancel. The cost stays small only while the `clippy --fix` step's
# flags match the cache the job restores; see that step.
#
# ---------------------------------------------------------------------------------------------
# Why the job that builds never holds the token that writes
# ---------------------------------------------------------------------------------------------
# `fix` runs `cargo update`, `clippy --fix`, `xtask` and `npm ci`: every dependency's build
# script, proc macro and package install hook executes there, and Renovate opens the pull
# requests that bump those dependencies. A job that also minted the App token and wrote it into
# the `origin` URL in `.git/config` would let one compromised crate or npm release read a
# `contents: write` credential off the disk (or out of the runner's memory) and push to any
# branch no ruleset protects, with `harden-runner` only auditing the egress.
#
# The two halves are separate jobs, and the boundary between them is a file, not a token:
#
# - `fix` checks out with the read-only `GITHUB_TOKEN`, persists no credential, runs every build
#   and generator, and uploads the result as a `git diff --binary` patch. The App secrets are
#   never in scope, so there is nothing for a build script to steal.
# - `commit`, in auto-fix-commit.yaml, builds nothing and executes nothing from the tree or the
#   artefact. It re-creates the exact tree `fix` started from, refuses any patch that touches a
#   path outside `FIX_PATHS` or carries anything but regular-file content, applies it, and only then
#   mints the App token, which reaches the GraphQL commit action as an input and is never written
#   to `.git/config`.
#
# `readme` and `readme-commit` are the same split for `README.md`: the render runs
# `readme-stack.sh` from the branch without a credential, and the job that mints the token
# commits a patch that may touch `README.md` and nothing else.
#
# The halves are separate *workflows*, not only separate jobs. A pull_request run executes the
# pull request's own copy of this file, so a job here that held the App key would hand it to anyone
# who can push a branch: edit the job, read the key. auto-fix-commit.yaml is a workflow_run workflow
# and runs the default branch's copy, which no pull request can change. This workflow decides what
# to commit; that one is the only one that writes.
#
# A compromised build can still put content into the patch, inside the paths this workflow
# commits anyway, on this pull request's branch, as a bot commit a reviewer sees. That is the
# residue of a bot that commits generated code at all; it cannot write anywhere else.
#
# ---------------------------------------------------------------------------------------------
# What it fixes, and why a bot may
# ---------------------------------------------------------------------------------------------
# Five things here are generated, committed, and must not be hand-edited: `openapi.json`,
# `crates/api-client/src/lib.rs`, `THIRD-PARTY-NOTICES` (ENGINEERING_GUIDE rule 6),
# `web/frontend/assets/main.css` (Tailwind output, committed so a build without Node works) and
# `docs/contracts/*.json` (the configuration contract each image publishes). Four CI jobs,
# `openapi --check`, `notices drift`, `config contract drift` and `tailwind output is current`,
# fail when they drift, but none fixes anything, so the failure is a red gate waiting on a human
# to run a command whose output is fully determined by the tree.
#
# The contracts have one half this job deliberately does *not* fix: the three-line `LABEL` regions
# in `deploy/docker/Dockerfile`. `just contract-json` writes the documents alone; `just regenerate`
# would also rewrite those regions, and a bot editing a Dockerfile is a change nobody reviewed.
# A mismatch there means the loader's prefix moved, which is a decision, not a formatting slip.
# `xtask config-contract` reports it in the gate, which is the whole fix.
#
# release-please bumps `$.workspace.package.version`, which all three artefacts record, and
# nothing else regenerates them: without this job a release lands on `main` with `openapi.json`
# reporting the previous version.
#
# `README.md` is the fifth, and the reason the `readme` job below is a job, not a step: it is
# rendered from `.github/templates/README.md.hbs` with the payload `readme-variables` reads out of
# `Cargo.toml` and `docs/`, and the facts `.github/scripts/readme-stack.sh` reads out of
# `rust-toolchain.toml` and the compose file, and it needs neither a toolchain nor a cache to do
# it. Its inputs are a different set of paths from everything above (a Postgres bump in the
# compose file changes the README and nothing else here), so putting it in `fix` would spend a
# workspace compile on a two-line diff.
#
# The lockfile sync is load-bearing for the same reason and is **not optional**.
# `release-please-config.json` bumps `$.workspace.package.version`, which every workspace member
# inherits via `version.workspace = true`, changing each member's recorded version in
# `Cargo.lock`, and release-please does not update lockfiles for the `simple` strategy (see the
# reasoning block in `release-please.yaml` for why `simple` and not `rust`). Left alone, the
# release pull request carries a lockfile that disagrees with the manifests and every `--locked`
# build in the repository fails: `xtask ci`, the `msrv` and `supply-chain` jobs, and the
# Dockerfile's `cargo auditable build --release --locked`. The release PR could then never go
# green, which is a deadlock, not a flaky failure.
#
# **Both** lockfiles, because `web/frontend` is a separate workspace that inherits nothing and is
# therefore easy to forget. It depends on `crates/api-client` and `crates/domain` by path, so those
# two carry the bumped version into `web/frontend/Cargo.lock` as surely as into the host one. A
# frontend lockfile left on the old version fails `cargo fetch --locked` and takes
# `lockfile integrity` and `third-party notices` down with it, on `main`, after merge.
#
# The same version bump reaches open pull requests by a second route, which is why this job merges
# the base branch in before it fixes anything. `ci.yml` judges the *merge* of a branch with its
# base, not the branch itself, so a release on `main` stales artefacts inside a branch whose own
# tree is self-consistent: regenerating on the head alone finds nothing to fix, and the pull
# request stays red with `openapi.json is out of date` and no command its author can run. Merging
# first makes the tree this job fixes the tree CI checks.
#
# This does **not** weaken review of API changes. `openapi breaking changes` still compares the
# regenerated document against the base branch, so a change that breaks a client is still a red
# gate; what stops being a red gate is *forgetting to run the generator*.
#
# Step order is load-bearing and is the reverse of the dependency arrows. The lockfiles are synced
# first because `cargo fetch --locked` and every `--locked` build below fail against a lockfile that
# disagrees with the manifests, which is precisely the state a release pull request arrives in.
# Then `clippy --fix` rewrites source, `cargo fmt` formats what it wrote, and only then are the
# artefacts regenerated from the result.
#
# ---------------------------------------------------------------------------------------------
# Why `xtask repo-lint` is not here, and must not be added
# ---------------------------------------------------------------------------------------------
# Every `repo-lint` rule is of the form "two artefacts that must agree, disagree": a CSP and the
# HTML it governs, the harness's Postgres major and production's, `deny.toml`'s advisory ignores
# and `.cargo/audit.toml`'s. None of them carries the answer to *which side is wrong*, so an
# automated fix would not be applying a known correction; it would be picking a side, and the side
# a machine picks is whichever makes the build go green.
#
# For one rule that is not merely unsound but the exact failure it exists to prevent.
# `csp-no-unsafe-eval` fires when code needs a directive the policy refuses. The green-making edit
# is to widen the CSP, which ENGINEERING_GUIDE rule 1 forbids in as many words, because the SPA's
# access token lives in memory and the policy is the ceiling on where an injected script could
# send it. A bot that resolved that rule automatically would be a supply-chain downgrade wearing
# the same commit message as a formatting fix.
#
# `too_many_lines` and the other suggestion-less clippy lints are excluded for the weaker version
# of the same reason: no machine-applicable suggestion means no determined output.

# **Unfiltered on purpose, and it must stay that way while this workflow reports a required
# check.** A trigger GitHub declines to fire creates no run and therefore no check run, so a
# `paths:` filter here would leave `apply the mechanical fixes` at "Expected" (waiting for status
# to be reported) forever on any pull request that touches no Rust. Not a slow check: an
# unreportable one, on a branch with nothing to fix.
#
# `ci.yml` says the same thing about its own gate and avoids it the same way: filter *inside* the
# workflow, never at the trigger. `changes` below decides what this run has to do, and the gate at
# the bottom reports the verdict whether or not anything ran.
on:
  pull_request:

# One workflow, one group; see the block at the top for what a second member would cost.
# `cancel-in-progress: false` because a run's patch is what auto-fix-commit.yaml commits, and with
# a single member the pending slot cannot be taken by a sibling, so the newest head always gets a
# run.
concurrency:
  group: pr-autocommit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

# Must stay byte-identical to `ci.yml`'s, and no step below may override it. `rust-cache` hashes
# the `CARGO_*`/`RUST*` environment into its key, so a workflow that leaves these unset looks up a
# different key from the one `ci.yml`'s `lint` group writes and compiles the workspace from cold on
# every pull request. Cargo then hashes `RUSTFLAGS` into every *unit* fingerprint on top of that,
# so a step that clears it discards the restored cache just as thoroughly; see the `clippy --fix`
# step.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Whether this pull request contains anything the job below can act on. The filter lives here,
  # not as a `paths:` on the trigger; see the note there. Cheap enough to run on every pull
  # request, which is the point: it always reports.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to check out the tree and diff it against the base
    outputs:
      relevant: ${{ steps.filter.outputs.fixable }}
      readme: ${{ steps.filter.outputs.readme }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # `fetch-depth: 0` because `persist-credentials: false` leaves `dorny/paths-filter` no token
      # to fetch the base with; a full clone means it never needs one. Same reasoning as `ci.yml`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The union of `ci.yml`'s `rust`, `notices` and `frontend` filters: the inputs the two
      # lockfiles and the four artefacts are a function of. Directories, never `**/*.rs`, for the
      # reason `ci.yml` gives: `web/frontend` is a separate workspace and a glob would silently
      # couple the two.
      #
      # A pull request touching none of these has no lockfile to move and no Rust to format, so
      # the compile below is skipped instead of run to discover it has nothing to do. The run
      # still happens, and still reports.
      - name: path filters
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            fixable:
              - '.github/workflows/auto-fix.yaml'
              - '.github/actions/**'
              - 'crates/**'
              - 'services/**'
              - 'xtask/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'openapi.json'
              - 'about.toml'
              - 'THIRD-PARTY-NOTICES'
              # The published configuration contracts, and the `justfile` that writes them. The
              # Dockerfile whose `LABEL` regions are checked against them is deliberately *not*
              # here: nothing in this job rewrites it, and naming that mismatch is `ci.yml`'s
              # `test` job, whose `rust` filter lists the Dockerfile for exactly this reason.
              - 'docs/contracts/**'
              - 'justfile'
              - 'web/frontend/**'
            # Everything `README.md` is a function of: the template, the stack script, the files
            # the payload is read out of, `docs/` for the documentation table, and the rendered file
            # itself, so that a hand-edit of a generated document is undone by the job that would
            # overwrite it instead of surviving until the next unrelated render.
            readme:
              - '.github/workflows/auto-fix.yaml'
              - '.github/templates/README.md.hbs'
              - '.github/scripts/readme-stack.sh'
              - 'README.md'
              - 'docs/**'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'deploy/docker-compose.yml'

  fix:
    name: mechanical fixes
    runs-on: ubuntu-latest
    needs: [changes]
    # Generous: this job compiles the workspace under `--all-targets` for `clippy --fix`, checks it
    # again, and then builds `tankovault-api` for `xtask openapi`. Generous is not a budget to
    # spend: a run approaching it means something is rebuilding what the cache already holds.
    timeout-minutes: 60
    # Forks cannot read the app secrets, and a fork PR must not be able to make this repository
    # commit on its behalf. Skipping is correct: a fork's drift is the author's to fix.
    if: ${{ needs.changes.outputs.relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    # Read-only, and the only credential this job ever holds. Every dependency's build script runs
    # here; see "Why the job that builds never holds the token that writes" at the top.
    permissions:
      contents: read # to check out the branch and its base
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    # What the patch may touch: source, the two lockfiles and the generated artefacts. Must equal
    # `commit`'s copy in auto-fix-commit.yaml, which is the one that is enforced: a path here that
    # is missing there fails that job instead of being committed. `docs/contracts` is nine
    # artefacts, one per published image, and the one entry that is a *directory of* them, so a
    # service added to `crates/config-contract` is carried back without touching this line. Nothing
    # else in this job is meant to change (`npm ci` can touch `package-lock.json`), and anything
    # outside this list that changed is a bug to see in a red gate, not to commit silently.
    #
    # On a `renovate/*` branch the list is the two lockfiles and the generated artefacts alone,
    # the same branch pattern `renovate-auto-approve.yml` approves. Those pull requests are
    # approved without a human and merge on a green gate, so a bot commit there must not be able to
    # carry source: whatever `clippy --fix` or `cargo fmt` would rewrite after a dependency or
    # toolchain bump is left out of the patch, and `fmt + clippy` stays red for a human to look
    # at. A human's branch keeps the full list.
    env:
      FIX_PATHS: "${{ startsWith(github.head_ref, 'renovate/') && 'Cargo.lock web/frontend/Cargo.lock openapi.json crates/api-client/src/lib.rs THIRD-PARTY-NOTICES docs/contracts web/frontend/assets/main.css' || 'Cargo.lock web/frontend/Cargo.lock crates services xtask fuzz openapi.json THIRD-PARTY-NOTICES docs/contracts web/frontend/src web/frontend/assets/main.css' }}"
    steps:
      # `audit`, not `block`. This job's egress is rustup, the crates.io index and its CDN, the
      # Actions cache, the runner's apt mirrors, `install-action`'s release downloads, the npm
      # registry and Node's dist, and whatever `cargo-about` and the build scripts reach, so an
      # allowlist derived by reading this file would be a guess, and a wrong guess fails the job on
      # the first host it missed. The credential `block` would guard does not live here.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Full history, which is also every branch: the step below merges the base from
      # `refs/remotes/origin/*`, so it needs neither a shallow-clone merge base nor a credential
      # to fetch one with.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          fetch-depth: 0

      # See the note at the top of this file: everything below regenerates artefacts that record
      # the workspace version, and `ci.yml` judges them on the merge with the base, so this job
      # has to stand on that same tree or it regenerates a version CI never sees.
      #
      # `head`, `sha` and `tree` are what `commit` re-creates this tree from and checks it against:
      # the patch below is a diff from this exact tree, and applying it to any other is refused,
      # not fuzzed. They travel to it in the artefact, beside the patch.
      #
      # A conflicting merge is a human's call, and aborting leaves the branch exactly as its
      # author pushed it, which is recoverable, where a bot-resolved conflict is not.
      - name: merge the base branch, which is the tree CI judges
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse --verify "refs/remotes/origin/${BASE_REF}^{commit}")
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$base" HEAD; then
            echo "::notice::already contains $BASE_REF"
          elif ! git merge --no-edit "$base"; then
            git merge --abort
            echo "::error::this branch conflicts with $BASE_REF and cannot be brought up to \
            date automatically; merge or rebase it by hand, then push"
            exit 1
          fi
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      # `clippy --fix` rewrites `.rs` files and nothing else, and what it would rewrite is a
      # function of the sources, `clippy.toml` and the compiler, so a branch that touches none of
      # those has nothing for it to find, and compiling the workspace to prove that is the most
      # expensive thing this job does.
      #
      # That is the release pull request's case exactly. release-please changes
      # `$.workspace.package.version`, a CHANGELOG and a manifest; a version bump cannot introduce
      # or silence a lint, so minutes in `clippy --fix` would find nothing. Both lockfiles and the
      # four generated artefacts *do* record that version, so every other step still runs: this
      # skips the compile, not the fix.
      #
      # Manifests are deliberately absent from the list. A feature added in a `Cargo.toml` can in
      # principle expose `cfg`-gated code carrying a lint, and this job will then not fix it: a
      # red `fmt + clippy` and one command for the author, which is already what happens for every
      # lint with no machine-applicable suggestion. Including manifests would put the release pull
      # request, the case this exists for, straight back on the slow path.
      #
      # `rustfmt.toml` is absent for a different reason: `cargo fmt` below is unconditional, so a
      # change to it is already acted on.
      - name: decide whether clippy has anything to look at
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "${BASE_SHA}...HEAD")
          if printf '%s\n' "$changed" | grep -qE '\.rs$' \
            || printf '%s\n' "$changed" | grep -qE '(^|/)(clippy|rust-toolchain)\.toml$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust sources changed on this branch; clippy --fix will run"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Rust sources changed on this branch; skipping clippy --fix"
          fi

      # The second reader of `rust-toolchain.toml`, after `ci.yml`'s `changes` job. The *number*
      # has one home; what is repeated is the two-line read, which cannot drift from the manifest
      # because it is the manifest. `stable` would not do here: `xtask openapi` formats the
      # generated client with rustfmt, and `cargo fmt --check` then judges it under the pinned
      # toolchain.
      - name: resolve the toolchain from its manifest
        id: versions
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$toolchain" ]; then
            echo '::error::no channel = "…" line in rust-toolchain.toml'
            exit 1
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "::notice::toolchain $toolchain"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16 # zizmor: ignore[superfluous-actions,stale-action-refs]
        with:
          toolchain: ${{ steps.versions.outputs.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The group `ci.yml`'s `lint` job writes: the same workspace under the same `RUSTFLAGS`,
          # so the dependency artefacts match even though the clippy arguments differ (no
          # `--all-features`, `--cap-lints=warn`; see the fix step below). Without naming it the lookup uses a key derived from this job's own name, one
          # nothing writes, because this workflow runs on pull requests only and so never executes
          # on `main`. It would restore nothing, on every run.
          shared-key: lint
          # Reads `main`'s cache, never writes one: this runs only on pull requests, and a PR
          # populating the shared cache is how an unreviewed artefact reaches every other job.
          save-if: "false"

      # First, and before anything that passes `--locked`. A release pull request arrives with
      # manifests the lockfiles disagree with, so a `cargo fetch --locked` ahead of this step
      # fails and takes every fix in this job down with it: the deadlock described at the top.
      #
      # `cargo update --workspace`, not `cargo fetch`: it rewrites only the workspace members'
      # entries and leaves every third-party pin alone. A release must not silently move
      # dependency versions; that is what `supply-chain` and `deny` gate, and this runs before
      # them. No BoringSSL toolchain is needed yet either; `cargo update` resolves and rewrites
      # without compiling anything.
      - name: sync both lockfiles with the manifests
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo update --workspace --manifest-path web/frontend/Cargo.toml
          if git diff --quiet -- Cargo.lock web/frontend/Cargo.lock; then
            echo "Both lockfiles already in step with the manifests."
          else
            git diff --stat -- Cargo.lock web/frontend/Cargo.lock
          fi

      # `wreq` compiles BoringSSL from C/C++ source; `xtask openapi` builds `tankovault-api`, so
      # this job needs them exactly as `ci.yml`'s Rust jobs do, and via the same action, which
      # bounds the `apt-get` that would otherwise stall the job.
      - name: BoringSSL build dependencies
        uses: $/.github/actions/boringssl-deps

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-about

      # `cargo-about` resolves licences from a fetched graph; both, because the notices document
      # covers the frontend workspace too. `--locked` is safe here only because the step above
      # has already brought both lockfiles into step with the manifests.
      #
      # **Every target the `about.toml` files name**, and this list must stay identical to the
      # one in `ci.yml`'s `notices` job: the two regenerate the same artefact, so a target
      # missing from either produces a document the other rejects. `cargo fetch` resolves for the
      # host unless told, and cargo-about silently omits any crate whose source it cannot find:
      # this workflow on Linux and a developer on Windows would each drop the other's
      # target-specific crates and rewrite the file back and forth for ever.
      - name: fetch every dependency graph, for every target the notices cover
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo fetch --locked --manifest-path web/frontend/Cargo.toml

      # Only clippy's *machine-applicable* suggestions are applied; that is rustfix's contract,
      # not a flag. A lint with no concrete replacement (`too_many_lines`, which wants a judgement
      # about how to split a function) is left alone and stays a red `fmt + clippy`, which is the
      # correct outcome: the fixable half stops costing a round trip, the half that needs a
      # decision still gets one.
      #
      # An unfixable lint must not abort the run before rustfix has written anything, or the one
      # lint nobody can automate suppresses the fixes for all the ones anybody can. `--cap-lints`
      # is what buys that. It is emphatically **not** `RUSTFLAGS: ""`: cargo hashes `RUSTFLAGS`
      # into the fingerprint of every unit it builds, dependencies included, so clearing it means
      # the `lint` cache this job restores matches nothing and the step rebuilds the whole graph,
      # BoringSSL from C source among it, on every run, while `save-if: false` means it never
      # writes a cache of its own to warm the next one. That is seconds against minutes on the same
      # commit. A `--` argument reaches the workspace crates only, and `rust-cache` discards
      # workspace artefacts anyway, so the ceiling is free where the env variable is not.
      #
      # No `--all-features`, unlike the `clippy` gate in `ci.yml`: a lint that fires only in
      # feature-gated code is reported by that gate and left for a hand fix, not rewritten here.
      - name: apply clippy's machine-applicable fixes
        if: steps.scope.outputs.rust == 'true'
        run: |
          set -euo pipefail
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged \
            -- --cap-lints=warn

      # `--fix` rewrites expressions without reformatting them, so this runs second and formats
      # what it wrote. Doing it the other way round commits code that `cargo fmt --check` rejects.
      #
      # The host workspace only, matching the gate: `cargo fmt --all` stops at the workspace
      # boundary and `web/frontend` is a separate one, which `ci.yml` does not format-check
      # either. Widening this would start enforcing a rule no gate states.
      - name: format the result
        run: cargo fmt --all

      # rustfix reverts a fix that does not compile, but it judges that per crate and this
      # workspace has many. A tree that no longer builds must not reach the commit step:
      # failing here leaves the branch exactly as the author pushed it, which is recoverable,
      # where a committed broken tree is a bot-authored regression to bisect.
      #
      # Same shape as the step above, for the same cache reason: it verifies what rustfix
      # rewrote, and rustfix does not look at feature-gated code the `lint` cache does not cover.
      # `ci.yml`'s `features` job is what compiles the workspace under `--all-features`.
      #
      # Skipped with the step it guards. This checks rustfix's output, so with rustfix skipped
      # there is nothing here that `xtask openapi` below does not already compile, and `cargo fmt`
      # cannot produce a tree that stops building.
      - name: the fixed tree still compiles
        if: steps.scope.outputs.rust == 'true'
        run: cargo check --workspace --all-targets

      - name: regenerate the OpenAPI document and its client
        run: cargo run -p xtask -- openapi

      - name: regenerate THIRD-PARTY-NOTICES
        run: cargo run -p xtask -- notices

      # The same recipe a developer runs, not a second spelling of it in YAML.
      - name: Install just
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: just

      # The nine committed contracts, and only those. `just regenerate` would also rewrite the
      # Dockerfile's `LABEL` regions, and three lines a human pasted are not something a bot
      # should edit unreviewed; `deploy/docker/Dockerfile` is deliberately not in `FIX_PATHS`
      # either. `xtask config-contract` names that diff in the gate, and naming it is the whole
      # fix.
      - name: regenerate the configuration contracts
        run: just contract-json

      # Same Node major as `ci.yml`'s `css` job, which is what judges the result.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # `--ignore-scripts`: the only install hook in the lockfile is `@parcel/watcher`'s
      # build-from-source fallback, which the Tailwind CLI needs for `--watch` and not for a
      # one-shot build. The prebuilt platform package is an ordinary optional dependency and
      # installs regardless, and `main.css` is byte-identical with and without the hook.
      - name: rebuild the Tailwind output
        working-directory: web/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run css:build

      # Everything above, as one patch against the tree the merge step recorded. Staged first so
      # that a file a generator *created*, such as a new `docs/contracts/*.json`, is in it;
      # `--no-renames` because `commit` refuses a rename outright, and a deletion and a creation
      # say the same thing in a form it can check path by path.
      - name: package the fixes as a patch
        id: patch
        env:
          HEAD_SHA: ${{ steps.base.outputs.head }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          TREE: ${{ steps.base.outputs.tree }}
        run: |
          set -euo pipefail
          read -ra paths <<< "$FIX_PATHS"
          git add --all -- "${paths[@]}"
          git diff --cached --binary --no-renames HEAD -- "${paths[@]}" > "${RUNNER_TEMP}/fixes.patch"
          if [ -s "${RUNNER_TEMP}/fixes.patch" ]; then
            printf '%s %s %s\n' "$HEAD_SHA" "$BASE_SHA" "$TREE" > "${RUNNER_TEMP}/fixes.tree"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat HEAD -- "${paths[@]}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing to fix; the tree already matches every generator"
          fi

      # One day is ample: `commit` in auto-fix-commit.yaml reads it minutes from now, and nothing
      # else should.
      - name: upload the patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mechanical-fixes
          path: |
            ${{ runner.temp }}/fixes.patch
            ${{ runner.temp }}/fixes.tree
          if-no-files-found: error
          retention-days: 1

  # `README.md`, rendered from its template by this job and committed back to the branch by
  # `readme-commit` in auto-fix-commit.yaml: the same boundary as `fix` and `commit`, for the same
  # reason. The render runs `.github/scripts/readme-stack.sh` from the pull request's head, so this
  # job is the one that executes branch code and must never hold the App token; `readme-commit`
  # holds it and executes nothing from the tree. The hand-off is a `create-patch` artefact scoped
  # to `README.md`, and `readme-commit` refuses any other path.
  #
  # It renders beside `fix`, on the same head. The two commits are serialised in
  # auto-fix-commit.yaml instead, where `readme-commit` waits for `commit` and skips when `commit`
  # moved the branch: the run on the new head renders again.
  readme:
    name: render the README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    # A fork's branch is not in this repository, so there is nothing to commit to. `ci.yml`'s
    # `readme` job is what covers them: it renders in check mode and fails on a stale file.
    if: ${{ needs.changes.outputs.readme == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    # Read-only, and no secret is referenced anywhere in this job: it runs a script from the
    # branch.
    permissions:
      contents: read # to check out the branch
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The head of the branch, not the merge commit: the render has to read the `Cargo.toml`
      # the pull request proposes, and the patch is committed to the branch. The SHA, not the
      # branch name: `readme-commit` applies the patch to the head this run was started for and
      # no other.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Invoked through `bash`, not executed: this repository is authored on Windows, where git
      # does not record the executable bit.
      - name: collect the stack facts
        id: stack
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-stack.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-readme-variables-v2.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.stack.outputs.json }}

      # The same pin `ci.yml`'s `readme` job checks the file with, so the render committed here
      # and the render that gate compares against are the same renderer.
      - name: render README.md
        uses: TimSchoenle/actions/actions/common/render-template@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-render-template-v3.0.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      # Scoped to the one file this job renders, so nothing else the script might have touched
      # reaches the patch. Uploaded even when empty; an empty patch is what skips `readme-commit`.
      - name: package the render as a patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: readme-render
          paths: README.md

      - name: summarise
        if: steps.patch.outputs.has_changes != 'true'
        run: echo "README.md already matched its template." >> "$GITHUB_STEP_SUMMARY"

  # **The name branch protection points at; point it here and nowhere else.** This job carries
  # the required check because it is the only one that always runs: `fix` skips on a pull request
  # with no Rust in it and on every fork, and a skipped job is a weaker promise to a ruleset than a
  # job that ran and said so.
  #
  # `if: always()`, not `success()`, which would inherit the skips. It fails on a real `failure`
  # or `cancelled`; a skipped `fix` or `readme` is a pull request with nothing to fix, which is a
  # pass. Same shape, and the same reasoning, as `ci.yml`'s `ci` gate.
  #
  # It also fails while either job left a patch: auto-fix-commit.yaml commits it once this run has
  # finished, so the head this run checked is not the one to merge, and the run on the commit
  # decides.
  auto-fix:
    name: apply the mechanical fixes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, fix, readme]
    permissions: {}
    steps:
      - name: verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          FIXES_PENDING: ${{ needs.fix.outputs.changed }}
          README_PENDING: ${{ needs.readme.outputs.has_changes }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "::error::a required job reported '$r'"
                exit 1
                ;;
            esac
          done
          if [ "$FIXES_PENDING" = "true" ] || [ "$README_PENDING" = "true" ]; then
            echo "::error::there are fixes to commit; auto-fix-commit.yaml commits them, and the run on that commit decides"
            exit 1
          fi
          echo "All required jobs passed or were skipped as unaffected."
