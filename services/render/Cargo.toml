[package]
name = "tankovault-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Optional headless render service for JS-rendered provider pages."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[[bin]]
name = "render"
path = "src/main.rs"

[dependencies]
tankovault-config = { workspace = true }
tankovault-service = { workspace = true }
# For the SSRF address policy only. Deliberately not `tankovault-fetch`: this service needs
# the *table*, not the wreq/BoringSSL client stack the Docker build has to work around.
tankovault-domain = { workspace = true }
url = { workspace = true }
tankovault-solver = { workspace = true, features = ["axum"] }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
chromiumoxide = { workspace = true }

[lints]
workspace = true
