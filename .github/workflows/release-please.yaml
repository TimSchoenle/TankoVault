name: release-please

# Release automation, end to end: release-please opens and maintains the release pull request,
# and merging it tags the repository and publishes the service images *that changed* for that tag
# as multi-architecture manifests, signed and with an SBOM attested against the published digest.
# `helm-release` then proposes the matching bump to the chart in `TimSchoenle/helm-charts`.
#
# ---------------------------------------------------------------------------------------------
# A release publishes what changed, not everything. It did not always.
# ---------------------------------------------------------------------------------------------
# All nine images used to be rebuilt, retagged and repinned on every release, whatever the
# release contained — so a one-line fix in `notifier` rolled all nine Deployments, and a
# documentation release rolled them for nothing.
#
# The `plan` job below decides the set instead. `xtask release-plan` walks the workspace
# dependency graph, so a change to `crates/domain` still reaches every image and a change to
# `services/render` reaches one; the paths that are build inputs without belonging to a package
# live in a table in `xtask/src/release_plan.rs`, and `repo-lint` fails if a top-level path
# matches neither. Anything unrecognised counts as a change to everything: an unnecessary rebuild
# costs runner minutes, a missed one ships stale code under a version that claims otherwise.
#
# Each image is diffed from **the tag it is currently published at**, resolved from the registry,
# rather than from the previous release. That is what makes the decision self-healing: a leg that
# failed at v1.0.1 is rebuilt at v1.0.2 instead of being skipped for good.
#
# Two consequences, both deliberate. A service that did not change has no `vX.Y.Z` tag for that
# release, so its `latest` and `X.Y` stay at its last real build — the registry's tag set is the
# record of which releases changed it, and the chart is the one complete reference surface.
# And `release-please` still decides one version for the whole repository: its own job is
# untouched, because per-component release-please attributes commits by path prefix and would
# never see `crates/domain`.
#
# The escape hatch is the `RELEASE_REBUILD_ALL` repository variable, which makes `plan` select
# every image without consulting a diff.
#
# The structure-test steps sit on the publishing path, before the push, because that is the only
# place the arm64 contract is ever checked for `frontend` and the six other `scratch` services
# that `ci.yml`'s arm64 job does not cover.
#
# ---------------------------------------------------------------------------------------------
# Why `release-type: simple` in `release-please-config.json`, and not `rust`
# ---------------------------------------------------------------------------------------------
# This is the one piece of configuration a future maintainer is most likely to "fix" — JSON
# cannot carry a comment, so the reasoning lives here and in `docs/RELEASING.md`.
#
# release-please's `rust` strategy rewrites `[package] version` in the root manifest *and every
# workspace member*. This workspace has no root `[package]` — it is a virtual manifest — and all
# 26 members inherit `version.workspace = true` from `[workspace.package]`, which the Rust
# updater does not touch. So `rust` would rewrite 26 members' `version.workspace = true` into
# literal strings while leaving the actual source of truth at `0.1.0`.
#
# `simple` touches only `CHANGELOG.md` (its `version.txt` updater is `createIfMissing: false`
# and this repository has no `version.txt`, so it is a no-op), and an `extra-files` entry bumps
# `$.workspace.package.version` explicitly. One version, one place, no churn.
#
# The consequence is that `Cargo.lock` goes stale on the release PR — every member's recorded
# version changes — which would break every `--locked` build. `auto-fix.yaml`'s lockfile sync is
# what keeps it in step; it is not optional.
#
# ---------------------------------------------------------------------------------------------
# The cache contract with `ci.yml`
# ---------------------------------------------------------------------------------------------
# Three tag families on the GHCR `buildcache` repository, all arch-qualified because a BuildKit
# cache does not cross architectures:
#
#   backend-deps-<arch>     written by `ci.yml`, off `main` only. Read here, never written.
#   release-pr-deps-<arch>  written by `ci.yml`, off the release-please branch only. Read here.
#   release-deps-<arch>     written by `release-deps` below. Read by the legs.
#
# **Every one of them is written from the Dockerfile's `build-cache` target**, so each carries the
# musl chain and the wasm chain together and any one of them is a complete lineage on its own.
# That is a contract between the two workflows, not an implementation detail: a build that imports
# two *partial* lineages resolves one and silently recompiles the other, which is what a separate
# wasm tag family cost the `frontend` legs on every run of both files. The stage's comment in
# `deploy/docker/Dockerfile` has the numbers.
#
# No tag is written by two workflows, which is deliberate: two `mode=max` exporters in one tag is
# a write race, not a warm cache. `release-deps-<arch>` exists because this workflow and `ci.yml`
# both fire on the push that merges a release PR, so `backend-deps-<arch>` is still at the
# *previous* commit when the legs start.
#
# `release-pr-deps-<arch>` is what makes a release fast, and it is worth understanding why it can
# hit at all. The release commit rewrites `Cargo.toml` and `Cargo.lock`; all 26 members inherit
# `version.workspace = true`, so every first-party crate's metadata hash changes and `builder` is
# always a cold compile of the whole workspace — 26 minutes on arm64, 38 on amd64, once per
# architecture, on the critical path. But the *release pull request* already contains that exact
# bump, and `.dockerignore` drops `CHANGELOG.md`, `.github/` and the release-please manifest, so
# the build context on the PR is byte-identical to the one here. `ci.yml` compiles it there,
# hours earlier, and this workflow imports the result. `cook` was never the cost: `cargo chef`'s
# recipe masks local versions to `0.0.1`, so that layer has always hit.
#
# Which is why **no `SERVICE_BINS` is passed anywhere in this file**. It used to carry `plan`'s
# narrowed set to the warm-up and to both `build-push-action` calls in every leg — saving one
# thin-LTO link per unpublished image, and costing the import above, because the value is part of
# `builder`'s cache key and `ci.yml` passes the Dockerfile default. Three call sites had to agree
# on one string; now all three say nothing and agree with CI as well.
#
# `SOURCE_DATE_EPOCH` is the same rule and the same three call sites, arrived at from the other
# direction: buildx propagates it from the environment into the solve as a build arg, so it
# cannot be omitted from a build that has to *export* a reproducible image — it can only be held
# constant. It is `"0"` in both workflows' `env:` blocks, and `xtask repo-lint` fails if they
# disagree or if a step overrides it.
#
# ---------------------------------------------------------------------------------------------
# On the `${{ }}` discipline in this file
# ---------------------------------------------------------------------------------------------
# This workflow holds `packages: write` and `id-token: write`, so an expression expanded into a
# `run:` block matters more here than anywhere else: `${{ }}` is textual substitution performed
# *before* the shell sees the script, which makes it string concatenation into a command line
# and not a variable reference. Everything a script needs arrives through `env:`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Granted per job, never here.
permissions: {}

env:
  # Must equal ci.yml's, which carries the reasoning: buildx turns this environment value into
  # `build-arg:SOURCE_DATE_EPOCH`, so it is part of every BuildKit cache key both files write or
  # read. `xtask repo-lint` fails if the two drift.
  SOURCE_DATE_EPOCH: "0"
  GHCR_REGISTRY: ghcr.io
  # Docker Hub cannot represent `ghcr.io/<owner>/<repo>/<bin>` — it is a two-segment namespace,
  # so each service is its own repository under this account.
  #
  # Every reference built from it spells `docker.io/` out. `docker` and `cosign` apply that
  # default themselves; `oras` does not — it reads the first segment of
  # `timschoenle/tankovault-<bin>` as a registry host and resolves *that*. Release v8.1.0 pushed
  # and signed all nine images and then lost every one of their `publish` legs to
  # `dial tcp: lookup timschoenle: server misbehaving`, which names neither the reference nor the
  # tool that read it differently from its siblings — no contract attached, no SBOM attested, and
  # no chart pull request. `xtask repo-lint` holds every image reference here to a registry.
  DOCKERHUB_NAMESPACE: timschoenle
  # Kept in step with ci.yml's pin of the same tool; see the `renovate:` comment there.
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CONTAINER_STRUCTURE_TEST_VERSION: 1.22.1
  # The registry client that attaches each image's configuration contract to its digest.
  # `TimSchoenle/helm-charts` reads that attachment back and pins its own `oras`; the two do not
  # have to match version for version — the artifact is plain OCI — but a bump here is worth
  # checking against that repository's `justfile` rather than assumed.
  # renovate: datasource=github-releases depName=oras-project/oras
  ORAS_VERSION: 1.3.3
  # Where the deployable chart lives. It is a separate repository on purpose: the chart releases
  # on its own cadence and its version is not this workspace's version.
  HELM_REPO: TimSchoenle/helm-charts
  CHART_PATH: charts/tankovault

jobs:
  release-please:
    name: tag the release
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create release commits and tags
      issues: write # to create release issues
      pull-requests: write # to open and maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # `tag_name` carries the `v` and `version` does not, and the two are *not* interchangeable
      # downstream: image tags are `vX.Y.Z`, a chart's `appVersion` is `X.Y.Z`.
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # A GitHub App token rather than `GITHUB_TOKEN`: pushes made with the default token do not
      # trigger workflows, so the release PR would never run CI and the required `ci` check
      # could never pass.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Narrowed to what release-please actually does (zizmor `github-app`): without these,
          # the minted token inherits every permission the app's installation holds, and this
          # job goes on to build and publish images — so the blast radius of anything reached
          # through that build was the release bot's full authority.
          #
          # `contents: write` commits the version bumps, the changelog and the tag;
          # `pull-requests: write` opens, updates and labels the release PR. Nothing else is
          # used: the token is consumed by the one step below, and the registry pushes
          # authenticate with `GITHUB_TOKEN` and the Docker Hub secrets instead.
          permission-contents: write
          permission-pull-requests: write

      # `draft: true` in `release-please-config.json` is load-bearing and belongs to
      # `desktop-release`, which publishes the draft once the installers are attached. This
      # repository's releases are **immutable**: once one is published, no asset can be added,
      # changed or removed, so a release published here is a release that can never carry the
      # desktop builds. A draft has no such lock — and no git tag either, which is why the
      # `desktop` job checks out `github.sha`.
      #
      # `skip-github-pull-request: true` is the consequence, and it is not optional: the action
      # does two independent things, and only tagging may run before the tag exists. The
      # `release-pr` job at the end of this file does the other half, after `desktop-release` has
      # published the draft, and carries what happened when the two shared one process.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.generate_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Which images this release has to publish, and which are already published and stay where they
  # are. Everything downstream is a matrix over `images`.
  plan:
    name: plan the image set
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    # Required, not decorative: `DOCKERHUB_*` are `release` environment secrets, and a job that
    # omits the environment reads them as empty strings — `docker/login-action` then reports
    # "Username and password required" without naming the cause.
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out the tree and diff it against each image's published tag
    outputs:
      images: ${{ steps.plan.outputs.images }}
      any: ${{ steps.plan.outputs.any }}
    env:
      # This job builds one short-lived command-line program and throws the tree away; debug info
      # and incremental artefacts are pure cost here. See the toolchain step for why there is no
      # compilation cache to make them worth keeping.
      CARGO_PROFILE_DEV_DEBUG: none
      CARGO_INCREMENTAL: 0
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # `fetch-depth: 0` for the tags and the history: the planner diffs each image from the tag
      # it is published at, which a shallow clone does not contain.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: resolve the toolchain from its manifest
        id: toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo '::error::no channel = "…" line in rust-toolchain.toml'
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # No `Swatinem/rust-cache` here, deliberately: a cache would be a writable input to the job
      # that decides what a signed release publishes, which is the cache-poisoning class zizmor
      # audits for, in the one workflow holding `packages: write` and `id-token: write`.
      #
      # That used to cost ten minutes a release, because `xtask` reaches the API crate and so
      # dragged in most of the backend and BoringSSL to build a program that prints three lines.
      # `--no-default-features` (see `xtask/Cargo.toml`'s `full` feature) cuts the graph from 654
      # crates to 15, so the no-cache posture is now nearly free rather than the price of it.
      # There is no `apt-get` step for the same reason: `wreq` is no longer in the graph.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Docker Hub rather than GHCR because the chart pins Docker Hub, so that is the registry
      # whose tag set has to be the record of what is published.
      - name: log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # For each deployable binary, the newest release tag that actually exists in the registry.
      # Since an unchanged service is not republished, a service's tag set *is* the list of
      # releases that changed it, and its newest tag is the commit its published image was built
      # from — which is exactly the base its next diff has to start at.
      #
      # The tag this run just created is skipped: nothing has been pushed to it yet, and the
      # failed inspect would cost a round trip per image. A binary that resolves to nothing is
      # left out of the document entirely, which the planner reads as "never published, rebuild".
      - name: resolve each image's published tag
        id: bases
        if: vars.RELEASE_REBUILD_ALL != 'true'
        env:
          RELEASING: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # `--all` here is not a decision, it is how the deployable set is asked for: the planner
          # derives it from the Dockerfile's SERVICE_BINS minus the deploy blacklist, so no list
          # of the services exists in this file. `GITHUB_OUTPUT` is redirected because this call
          # is a query — only the step below may set the job's outputs.
          bins=$(GITHUB_OUTPUT=/dev/null cargo run -q -p xtask --no-default-features -- release-plan --all | sed -n 's/^service_bins=//p')
          # No `| head`: under `pipefail` an early-exiting reader SIGPIPEs `git tag` and turns a
          # successful read into a failed step. The probe budget below is a counter instead.
          tags=$(git tag --list 'v*' --sort=-v:refname)

          # One subshell per binary, because the probes are network round trips and nothing about
          # one image's answer informs another's: serially this walked up to nine images × 25 tags
          # and was most of this job's wall clock. Each writes its own file and the results are
          # collected after `wait`, so no two writers share a descriptor.
          probe_dir="${RUNNER_TEMP}/bases"
          mkdir -p "$probe_dir"
          for bin in ${bins}; do
            (
              probed=0
              for tag in ${tags}; do
                # Nothing has been pushed to the tag this run just created, so probing it would
                # cost one failed round trip per image and tell us nothing.
                if [ "$tag" = "$RELEASING" ]; then
                  continue
                fi
                probed=$((probed + 1))
                if [ "$probed" -gt 25 ]; then
                  echo "::warning::no published image found for ${bin} in the last ${probed} tags; it will be rebuilt"
                  break
                fi
                if docker buildx imagetools inspect \
                     "docker.io/${DOCKERHUB_NAMESPACE}/tankovault-${bin}:${tag}" >/dev/null 2>&1; then
                  printf '%s' "$tag" > "${probe_dir}/${bin}"
                  echo "::notice::${bin} is published at ${tag}"
                  break
                fi
              done
            ) &
          done
          # A failed probe means "never published", which is a legitimate answer, so the exit
          # status of a child is not an error here — but a child killed by a signal would be, and
          # `wait` without a job list would hide it. Each is waited on by pid.
          for pid in $(jobs -p); do
            wait "$pid" || true
          done

          bases='{}'
          for bin in ${bins}; do
            if [ -s "${probe_dir}/${bin}" ]; then
              tag=$(cat "${probe_dir}/${bin}")
              bases=$(printf '%s' "$bases" | jq -c --arg bin "$bin" --arg tag "$tag" '. + {($bin): $tag}')
            fi
          done
          printf '%s' "$bases" > "${RUNNER_TEMP}/bases.json"
          echo "::notice::bases: ${bases}"

      # `--all` short-circuits the diff entirely, for the release where the decision cannot be
      # trusted and every image has to be rebuilt by hand.
      - name: decide which images to publish
        id: plan
        env:
          REBUILD_ALL: ${{ vars.RELEASE_REBUILD_ALL }}
        run: |
          set -euo pipefail
          if [ "$REBUILD_ALL" = "true" ]; then
            cargo run -q -p xtask --no-default-features -- release-plan --all
          else
            cargo run -q -p xtask --no-default-features -- release-plan "${RUNNER_TEMP}/bases.json"
          fi

  # The warm-up the legs below are built on, one per architecture — the same job
  # `ci.yml`'s `docker-deps` is, at the release commit, and it exists for the same reason: `cook`
  # and `builder` are the entire wall clock of an image build and `builder` takes no `ARG BIN`, so
  # one compile per architecture serves all nine images.
  #
  # It covers the wasm chain too, and that is not a widening for tidiness: it is what keeps every
  # leg below on **one** cache lineage. A build importing two of them drops one and recompiles it,
  # which cost the `frontend` legs 39 and 29 minutes on release v5.0.0 against a minute each for
  # their siblings. `build-cache` in `deploy/docker/Dockerfile` carries the measurement and the
  # mechanism; there used to be a second `release-wasm-deps` job here, and it was the second
  # lineage.
  #
  # Without it every leg re-ran `builder` independently. `ci.yml`'s `backend-deps-<arch>` is
  # written at the *previous* `main` commit, and the release commit changes `Cargo.toml`,
  # `Cargo.lock` and `CHANGELOG.md` — so `COPY . .` inside `builder` misses and the whole workspace
  # is compiled again. Eighteen times, in parallel, where two would do.
  #
  # `cargo chef`'s recipe masks local package versions (it rewrites them to `0.0.1`), which is why
  # importing the pre-bump `backend-deps-<arch>` is still worth doing: the `cook` layer is
  # version-invariant and hits, so this job's worst case is the workspace compile alone.
  #
  # `release-pr-deps-<arch>` is the best case — the same tree, already compiled — but it is **only**
  # a hit if the release pull request's own `ci` finished before the merge, and that is a property
  # of how the release is merged, not of this file. Merged promptly it is never a hit: release
  # v3.3.0's branch head was pushed at 08:57:10 and merged at 08:59:22, while the pull request's
  # `docker build (deps, amd64)` ran until 09:35:55 — 34 minutes after this job had already started
  # compiling. Both warm-ups then cold-compiled all 573 crates. Waiting for the required `ci` check
  # on the release pull request is what turns this job from a 26-37 minute compile into an import;
  # nothing here can substitute for it, because by the time this workflow runs the tree is new and
  # no completed run has ever seen it.
  #
  # Its own tag to write, not `backend-deps-<arch>`: `ci.yml` fires on this same push and its
  # `docker-deps` exports to that tag concurrently. Sharing one would be the write race the
  # `docker-deps` comment describes, and a release build must not be able to poison what CI reads.
  # `release-pr-deps-<arch>` is only ever read here, which is what keeps that true after the
  # pull-request export was added.
  #
  # **This job is the only place a tag `ci.yml` writes may be read**, and that is the invariant the
  # legs below depend on. Reading one *there* is a race, not a fallback: `ci.yml` runs on this same
  # push, its `docker-deps` takes 21-39 minutes, and the legs start the moment this job ends — so
  # they import `backend-deps-<arch>` while its `mode=max` export is still uploading. BuildKit
  # discards a record whose blobs it cannot resolve and re-runs the vertex, and the vertex is
  # `cook`. Measured twice, both times amd64-only and both times exactly while `ci.yml`'s amd64
  # export was in flight: release v3.3.0 (run 31249584803) lost `frontend` for 30 minutes against
  # 49 seconds for its siblings, and the release before it (run 31241717361) lost `frontend` and
  # `worker` for 40 and 38. Both are on the critical path — nothing publishes until every leg is
  # done. The arm64 legs, whose `ci.yml` export had finished, hit every time.
  #
  # These tags live in GHCR rather than the Actions cache; `ci.yml`'s `docker-deps` carries the
  # reasoning, and the two files have to agree because they read each other's tags.
  release-deps:
    name: warm the build cache (${{ matrix.arch }})
    needs: [release-please, plan]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.plan.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read # to check out the build context
      packages: write # to export the layer cache to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Shell-computed for the case folding the `params` step below documents.
      - name: resolve the buildkit cache repository
        id: buildcache
        run: echo "ref=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}/buildcache" >> "$GITHUB_OUTPUT"

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build args and `platforms` must match the legs below exactly, or they look up a key this
      # never wrote. `BIN` is deliberately absent: no stage up to `builder` reads it, which is
      # what makes one warm-up serve every planned image.
      #
      # `SERVICE_BINS` is absent too, and that is load-bearing rather than an omission. It used
      # to carry `plan`'s narrowed set, which saved a thin-LTO link per unpublished image and
      # cost far more than it saved: the value is part of `builder`'s cache key, so it made this
      # build unable to read anything `ci.yml` writes — including `release-pr-deps-<arch>`, which
      # is this same tree already compiled on the release pull request. Leaving the Dockerfile's
      # default is what makes that import hit.
      #
      # `SOURCE_DATE_EPOCH` was the same mistake and cost the same import twice over, which is why
      # it is now a repository constant in this file's `env:` rather than anything derived. As the
      # commit timestamp it differed between the release pull request and the merge commit — the
      # two trees this import exists to bridge — and between every consecutive `main` push
      # besides. Moving it from `build-args:` to a step `env:` did not help: buildx propagates the
      # environment value into the solve as `build-arg:SOURCE_DATE_EPOCH` regardless, so the only
      # thing that changed was *which* build carried it. See the publishing leg below for what
      # that cost.
      - name: cook both dependency graphs and compile every binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          target: build-cache
          push: false
          outputs: type=cacheonly
          provenance: false
          # `release-pr-deps-<arch>` first: written by `ci.yml` on the release pull request, whose
          # build context is byte-identical to this commit's, so on a normal release this is a hit
          # and the job is an import rather than a 26-crate recompile. The other two are the
          # fallbacks for when it is absent or stale — a merge that raced another commit onto
          # `main`, or a release PR whose CI never finished.
          #
          # All three are written from this same `build-cache` target, which is what makes reading
          # three of them safe where reading two in a leg is not: they describe the same vertex
          # set, so there is no partial lineage for the merge to drop. That agreement is a contract
          # with `ci.yml` — if a tag here is ever written from a narrower target again, this job
          # goes back to cold-compiling the half it did not import.
          cache-from: |
            type=registry,ref=${{ steps.buildcache.outputs.ref }}:release-pr-deps-${{ matrix.arch }}
            type=registry,ref=${{ steps.buildcache.outputs.ref }}:release-deps-${{ matrix.arch }}
            type=registry,ref=${{ steps.buildcache.outputs.ref }}:backend-deps-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.buildcache.outputs.ref }}:release-deps-${{ matrix.arch }},mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true

  # One leg per (image, architecture). Both architectures build **natively**: `wreq` compiles
  # BoringSSL from C/C++/assembly and an emulated build of it costs upwards of an hour per
  # image, which is why there is no QEMU here and `ci.yml` says the same thing about its own
  # arm64 job.
  #
  # Each leg pushes *by digest only* — no tag — to both registries. The tags
  # are applied once, by the `manifest` job below, to a manifest list referencing both digests.
  # That is what makes `:v1.2.3` a single multi-architecture reference rather than whichever
  # architecture happened to push last.
  #
  # The matrix is `plan`'s output rather than a literal: that is what holds the published set to
  # the Dockerfile's `SERVICE_BINS` minus the deploy blacklist
  # (`[workspace.metadata.deploy.exclude]`, root `Cargo.toml`), which is where `xtask` is excluded.
  # `repo-lint` fails if this file names its images literally again, because a literal would
  # publish a hand-maintained list while every other gate stayed green.
  build:
    name: ${{ matrix.bin }} (${{ matrix.arch }})
    needs: [release-please, plan, release-deps]
    # `!cancelled() && !failure()` rather than the bare output test: an explicit `if:` replaces the
    # implicit `success()`, so the bare form would publish images from a run whose warm-up failed.
    # `plan` is skipped when the release created nothing, and a skipped `needs:` is neither a
    # success nor a failure, which is why the test below cannot become `success()`.
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release_created == 'true' && needs.plan.outputs.any == 'true' }}
    environment:
      name: release
      deployment: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read # to check out the build context
      packages: write # to push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        bin: ${{ fromJSON(needs.plan.outputs.images) }}
        arch: [amd64, arm64]
        # `include` entries that name only `arch` are merged into every combination with that
        # arch, which is how the runner label is attached without enumerating every leg.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The build target and structure-test contract are derived from the binary name in one
      # `case`, deliberately, rather than as inline `${{ a == b && x || y }}` expressions
      # repeated at each use site — which is exactly how the three got out of step before.
      - name: resolve image parameters
        id: params
        env:
          BIN: ${{ matrix.bin }}
        run: |
          case "$BIN" in
            render)   target=runtime-browser; cst=render ;;
            frontend) target=frontend;        cst=frontend ;;
            *)        target=runtime;         cst=service ;;
          esac
          {
            echo "target=${target}"
            echo "cst=${cst}"
            echo "dockerhub=docker.io/${DOCKERHUB_NAMESPACE}/tankovault-${BIN}"
            echo "ghcr=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}/${BIN}"
            echo "buildcache=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}/buildcache"
          } >> "$GITHUB_OUTPUT"
        # `,,` folds the case: GHCR rejects an uppercase path and `GITHUB_REPOSITORY` carries the
        # account's own casing (`TimSchoenle/TankoVault`). Workflow expressions have no lowercase
        # function, which is why every GHCR reference in this file reads a shell-computed output
        # rather than `${{ github.repository }}` directly.

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The by-digest push below is a registry call on the publishing path, so it goes through the
      # same wrapper the `manifest` job uses. See the action for the two releases that paid for it.
      - uses: ./.github/actions/registry-retry

      # Built and contract-checked *before* it is pushed, in two builds rather than one. The second
      # is a cache hit against the same buildkit instance — it re-exports and uploads, it does not
      # recompile — so the cost of the split is an upload, and what it buys is that nothing reaches
      # a registry until `container-structure-test` has passed against the exact artefact.
      #
      # This is not redundant with `ci.yml`, which is the reason it survives here: `ci.yml`'s
      # arm64 job covers `api` and `render` only, so these legs are the only place the other
      # seven images have their arm64 contract checked.
      #
      # `load` is possible only because both legs are native — there is no cross-architecture
      # image to hand to the local daemon.
      - name: build ${{ matrix.bin }} (${{ matrix.arch }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ steps.params.outputs.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BIN=${{ matrix.bin }}
          push: false
          load: true
          tags: tankovault-${{ matrix.bin }}:release-${{ matrix.arch }}
          provenance: false
          # **One tag, and only one.** It is the tag `release-deps` has finished writing in this
          # run, at this commit, covering both compile chains — so there is nothing left for a
          # second source to add, and a second source here is not free. Two of them is what made
          # the `frontend` legs recompile `cook` and `builder` from cold while their siblings
          # imported the same tag in under a minute; `build-cache` in the Dockerfile carries the
          # measurement. Anything from `ci.yml` is additionally the race `release-deps` documents,
          # since that workflow is still running on this same push.
          # No `SERVICE_BINS` and no `TANKOVAULT_COMMIT`: a build arg the warm-up did not pass is a
          # build arg a leg must not pass either, or it looks up a key nothing wrote.
          cache-from: type=registry,ref=${{ steps.params.outputs.buildcache }}:release-deps-${{ matrix.arch }}

      - name: install container-structure-test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CONTAINER_STRUCTURE_TEST_VERSION}"
          asset="container-structure-test-linux-${ARCH}"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${asset}" -O "${base}/checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum -c -
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/container-structure-test

      # Two configs: the image's own contract plus the musl loader assertion, whose path is the
      # one part of the contract that differs by architecture.
      - name: structure-test ${{ matrix.bin }} (${{ matrix.arch }})
        env:
          IMAGE: tankovault-${{ matrix.bin }}:release-${{ matrix.arch }}
          CST_CONFIG: deploy/docker/cst/${{ steps.params.outputs.cst }}.yaml
          LOADER_CONFIG: deploy/docker/cst/loader-${{ matrix.arch }}.yaml
        run: |
          container-structure-test test \
            --image "$IMAGE" \
            --config "$CST_CONFIG" \
            --config "$LOADER_CONFIG"

      # The generated documents, on the host. `--target contract` is a `scratch` stage holding
      # nothing but them, so this is a cache hit against the build above plus a layer export.
      - name: export the generated contracts
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          target: contract
          outputs: type=local,dest=${{ runner.temp }}/contract-out
          provenance: false
          cache-from: type=registry,ref=${{ steps.params.outputs.buildcache }}:release-deps-${{ matrix.arch }}

      # **Before the push, on every architecture.** Labels live in each platform manifest's own
      # config blob, so a per-platform build argument or a differing base can leave one arch
      # carrying them and another not — checking the index after the fact would see only one.
      # Both legs here are native and `load` the image, so this is the strong form the design
      # asks for: a failure costs a retry rather than a release, and nothing is attached or
      # signed until it passes.
      - name: the image publishes the contract it was built to publish
        env:
          BIN: ${{ matrix.bin }}
          ARCH: ${{ matrix.arch }}
        run: |
          bash .github/scripts/verify-config-contract.sh \
            "tankovault-${BIN}:release-${ARCH}" \
            "${RUNNER_TEMP}/contract-out/${BIN}.labels" \
            "${RUNNER_TEMP}/contract-out/${BIN}.json"

      # Handed to `manifest`, which attaches it to the published digest. The *verified* bytes,
      # from the leg that verified them — not a fresh generator run, which would be a second
      # chance to publish something the image does not carry. One architecture uploads because
      # both produced the same document and the check above proved each image embeds it.
      - name: upload this image's contract
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-${{ matrix.bin }}
          path: ${{ runner.temp }}/contract-out/${{ matrix.bin }}.json
          if-no-files-found: error
          retention-days: 1
      # Two `type=image` exporters in one build, so the layers are uploaded to both registries
      # from one pass. The manifest digest is content-addressed, so it is the *same* digest in
      # both — which is why the `manifest` job can use one digest file to assemble the list in
      # either registry.
      # `rewrite-timestamp=true` clamps the file timestamps inside the pushed image to
      # `SOURCE_DATE_EPOCH`, which is what makes a rebuild of this tag byte-identical. The value
      # comes from this file's workflow-level `env:` and is a constant on purpose.
      #
      # **Never derive it here.** buildx propagates the environment value into the solve as
      # `build-arg:SOURCE_DATE_EPOCH` — there is no exporter-only channel — so a per-commit value
      # makes this the one build in the repository carrying an argument no cache tag was written
      # under. It then recompiles the entire workspace: measured at 24 minutes on release v1.5.2,
      # on all eighteen legs, against a `builder` the warm-up above had imported in 28 seconds and
      # the structure-test build 40 lines up had just hit. Passing it as an explicit `--build-arg`
      # has the identical effect; the two are the same wire format. That is also why the variable
      # is not named in this step: it is inherited, and buildx reads it from the environment.
      #
      # `docker buildx build` under the retry helper rather than `docker/build-push-action`,
      # because a `uses:` step cannot be retried and this is the call that failed v2.1.0 —
      # `failed to fetch oauth token: denied: denied`, GHCR's throttle response, after seventeen
      # sibling legs had pushed to the same registry inside ninety seconds. The flags below are the
      # command line the action itself emitted, and a push is idempotent, so a retry re-uploads
      # only what did not land. Retrying a *build* failure would be the objection, and it cannot
      # arise: the structure-test build above compiled and loaded this exact target, so by here the
      # solve is a local cache hit and only the export can fail.
      - name: push ${{ matrix.bin }} (${{ matrix.arch }}) by digest
        id: build
        env:
          BIN: ${{ matrix.bin }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ steps.params.outputs.target }}
          DOCKERHUB_IMAGE: ${{ steps.params.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.params.outputs.ghcr }}
          BUILDCACHE: ${{ steps.params.outputs.buildcache }}
        run: |
          set -euo pipefail

          # Read only, and the same tag as the structure-test build above — this is a hit against
          # the local buildkit instance, so it re-exports and uploads rather than recompiling.
          # Eighteen legs exporting `mode=max` would each re-upload the whole imported layer chain
          # into a tag CI also reads, and a release build is the one build that must not poison
          # that, so there is no `--cache-to` here.
          metadata="${RUNNER_TEMP}/push-metadata.json"
          # `--attest type=provenance,disabled=true` is what `provenance: false` expands to, and it
          # matches ci.yml: a provenance attestation carries build timestamps, which breaks
          # byte-identical rebuilds. The SBOM attested in the `manifest` job compensates.
          "${RUNNER_TEMP}/registry-retry" docker buildx build \
            --file deploy/docker/Dockerfile \
            --target "$TARGET" \
            --platform "linux/${ARCH}" \
            --build-arg "BIN=${BIN}" \
            --cache-from "type=registry,ref=${BUILDCACHE}:release-deps-${ARCH}" \
            --attest type=provenance,disabled=true \
            --output "type=image,name=${DOCKERHUB_IMAGE},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true" \
            --output "type=image,name=${GHCR_IMAGE},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true" \
            --metadata-file "$metadata" \
            .

          # Both exporters push the same content-addressed manifest, so there is exactly one digest
          # to find — but buildx has reported it both at the root of the metadata document and
          # under a per-exporter key depending on the version, so this reads either and fails loudly
          # if the two exporters ever disagree rather than picking one arbitrarily.
          digest=$(jq -er '
            [.. | objects | ."containerimage.digest"? // empty] | unique
            | if length == 1 then .[0]
              else error("expected one image digest in the metadata, got \(.)") end
          ' "$metadata")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # The digest is what the `manifest` job assembles the list from. Written as an empty file
      # *named* for the digest, which is the conventional shape: artifact merging then yields one
      # directory whose filenames are exactly the digests to reference.
      - name: export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.bin }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One job per image: assemble the two per-architecture digests into a manifest list in each
  # registry, then sign and attest what was actually published.
  manifest:
    name: publish ${{ matrix.bin }}
    needs: [release-please, plan, build]
    # Same reason as `build`: a bare output test replaces the implicit `success()`, so with
    # `fail-fast: false` above a single failed leg still reached this job — and `imagetools create`
    # over whichever digests *did* upload publishes `:vX.Y.Z` as a single-architecture manifest
    # list. Tagging a half-built release is worse than not tagging one.
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release_created == 'true' && needs.plan.outputs.any == 'true' }}
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to check out (the SBOM step reads the repository)
      packages: write # to push the manifest list to ghcr.io
      id-token: write # cosign keyless (Fulcio/Rekor via the OIDC token)
    strategy:
      fail-fast: false
      matrix:
        bin: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every registry call in this job goes through this wrapper, and `repo-lint`'s
      # `registry-calls-in-publish-retry` rule fails if one is added that does not. The action
      # carries the incidents that paid for it; a real permissions failure still fails the step,
      # it just exhausts the schedule first.
      - uses: ./.github/actions/registry-retry

      - name: download this image's digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.bin }}-*
          merge-multiple: true

      # Both names resolved once, for the same reason the `build` job resolves them in a shell
      # step: the GHCR path has to be case-folded and no expression function can do it.
      - name: resolve image names
        id: names
        env:
          BIN: ${{ matrix.bin }}
        run: |
          {
            echo "dockerhub=docker.io/${DOCKERHUB_NAMESPACE}/tankovault-${BIN}"
            echo "ghcr=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}/${BIN}"
          } >> "$GITHUB_OUTPUT"

      - name: image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.names.outputs.dockerhub }}
            ${{ steps.names.outputs.ghcr }}
          # release-please already decided the version; `type=raw` off its tag is the single
          # source of truth. `latest` follows it because every release-please release is a real
          # semver release on the default branch.
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}

      # `imagetools create` takes the tag set and the source digests and writes one manifest
      # list per tag. `metadata-action` emits every tag for both registries, and each
      # `--tag` is applied to the list built from the same two digests — the digests are
      # content-addressed and therefore identical in both registries.
      - name: create the manifest lists
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            sources=""
            for d in *; do
              sources="${sources} ${image}@sha256:${d}"
            done
            tag_args=""
            for tag in ${TAGS}; do
              case "$tag" in
                "${image}:"*) tag_args="${tag_args} --tag ${tag}" ;;
              esac
            done
            # shellcheck disable=SC2086 -- word splitting is how the accumulated
            # strings become separate arguments; none of the values contain whitespace.
            "${RUNNER_TEMP}/registry-retry" docker buildx imagetools create ${tag_args} ${sources}
          done

      # Resolve the manifest **list** digest after creation. This is what gets signed: signing a
      # per-architecture digest would leave the tag most people actually pull unverifiable.
      - name: resolve the manifest list digests
        id: digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Spelled out at each call site rather than through a local alias, because that is what
          # `repo-lint`'s `registry-calls-in-publish-retry` rule reads.
          dockerhub=$("${RUNNER_TEMP}/registry-retry" docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${TAG}" --format '{{println .Manifest.Digest}}' | head -n1)
          ghcr=$("${RUNNER_TEMP}/registry-retry" docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}" --format '{{println .Manifest.Digest}}' | head -n1)
          {
            echo "dockerhub=${dockerhub}"
            echo "ghcr=${ghcr}"
          } >> "$GITHUB_OUTPUT"

      # Handed to `helm-release` as an artifact, not a job output: this is a matrix of nine and
      # `outputs` on a matrix job is last-writer-wins, so nine legs would deliver one digest.
      #
      # The Docker Hub digest is the one exported, because the chart's `repository` values name
      # Docker Hub (`timschoenle/tankovault-<bin>`). Both registries hold the same list digest —
      # a manifest list is content-addressed and both were assembled from the same two
      # per-architecture digests — but a chart must pin the registry it actually pulls from.
      - name: export the manifest list digest
        env:
          BIN: ${{ matrix.bin }}
          DIGEST: ${{ steps.digests.outputs.dockerhub }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/list-digests
          printf '%s' "$DIGEST" > "/tmp/list-digests/${BIN}"

      - name: upload the manifest list digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: list-digest-${{ matrix.bin }}
          path: /tmp/list-digests/*
          if-no-files-found: error
          retention-days: 1

      # The step below is a registry call with no retry of its own, and it is the one that failed
      # `publish api` at v2.0.0. syft resolves a plain reference through the local Docker daemon
      # *before* it tries the registry, so pulling here is what puts that round trip behind the
      # helper. The SBOM describes the same bytes either way: both paths resolve the
      # multi-architecture list to this runner's own platform.
      - name: pull the published image for the SBOM
        env:
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/registry-retry" docker pull "${GHCR_IMAGE}:${TAG}"

      # A `scratch` image defeats every package-manager-based scanner: there is no apt/apk
      # database, so a running container cannot be mapped back to its dependency set at all.
      # Syft reads the Rust binary's own metadata instead, which is the only way these images
      # become scannable after the fact.
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.names.outputs.ghcr }}:${{ needs.release-please.outputs.tag_name }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.bin }}.spdx.json
          output-file: sbom-${{ matrix.bin }}.spdx.json

      - name: attach the SBOM to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.bin }}
          path: sbom-${{ matrix.bin }}.spdx.json
          retention-days: 90

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # One OIDC token, minted here and handed to all four cosign calls below.
      #
      # Left to itself cosign fetches an *ambient* token per signature, and there are eight per
      # leg: `--recursive` signs the manifest list plus both per-architecture images, that is
      # three per registry and two registries, plus an attestation each. Nine `publish` legs run
      # concurrently, so v1.3.0 asked GitHub's OIDC endpoint for ~72 tokens inside two minutes
      # and it began answering `unauthorized` — which surfaces as
      # `fetching ambient OIDC credentials: invalid character 'u' looking for beginning of value`,
      # naming neither the endpoint nor the reason. All nine images published unsigned.
      #
      # Minted after `install cosign` rather than at the top of the job because the token is
      # short-lived and the SBOM step above is not fast. Written to a file, not an env var or an
      # argument: `--identity-token` accepts a path, and a token in `argv` is readable from
      # `/proc` by anything else on the runner.
      #
      # The file must hold the JWT and nothing else. cosign reads it with `os.ReadFile` and hands
      # the bytes to Fulcio as the `Authorization` header verbatim, so the newline `jq` writes
      # made every signature fail with `net/http: invalid header field value for "Authorization"`
      # — naming neither the file nor the newline. That is how v1.3.1 published nine unsigned
      # images. Command substitution strips the newline, `printf` puts none back, and `printf` is
      # a shell builtin so the token still never reaches any process's `argv`.
      - name: mint one OIDC token for cosign
        run: |
          set -euo pipefail
          umask 077
          for attempt in 1 2 3; do
            if token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" \
                       | jq -er '.value') && [ -n "$token" ]; then
              printf '%s' "$token" > "${RUNNER_TEMP}/cosign-oidc-token"
              exit 0
            fi
            echo "::warning::OIDC token request failed (attempt ${attempt}/3)"
            sleep $((attempt * 5))
          done
          echo "::error::could not mint an OIDC token for cosign"
          exit 1

      # Keyless: the identity is this workflow's OIDC token, recorded in Rekor. No private key
      # to store, rotate or leak — and verification names the workflow that produced the image
      # rather than "whoever held the key". `--recursive` also signs the per-architecture images
      # the list references, not only the list itself.
      - name: sign the published digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB_DIGEST: ${{ steps.digests.outputs.dockerhub }}
          GHCR_DIGEST: ${{ steps.digests.outputs.ghcr }}
        run: |
          set -euo pipefail
          token="${RUNNER_TEMP}/cosign-oidc-token"
          "${RUNNER_TEMP}/registry-retry" cosign sign --yes --recursive --identity-token "$token" "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}"
          "${RUNNER_TEMP}/registry-retry" cosign sign --yes --recursive --identity-token "$token" "${GHCR_IMAGE}@${GHCR_DIGEST}"

      # The configuration contract, attached to the digest a chart pins and signed with it.
      #
      # An OCI referrer rather than a layer: the image is untouched, so the digest does not churn
      # and the reproducible-build story holds — and the *attachment to a digest is the tie*
      # between image and document. There is no digest field inside the contract and there cannot
      # be: a digest is what building an image produces, so a field holding it would have to be
      # written after the push, changing bytes that were already hashed.
      #
      # The **verified** bytes, downloaded from the `build` leg that checked them against the
      # image it had loaded — not a fresh generator run, which would be a second chance to publish
      # a document the image does not embed. Attached verbatim, and nothing rewrites it after.
      #
      # Attached to the manifest **list**, because that is the digest `helm-release` writes into
      # the chart and therefore the digest its refresh asks for referrers.
      - name: install oras
        run: |
          set -euo pipefail
          asset="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${asset}" -O "${base}/oras_${ORAS_VERSION}_checksums.txt"
          grep "  ${asset}$" "oras_${ORAS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$asset" oras
          sudo mv oras /usr/local/bin/oras

      - name: download this image's contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contract-${{ matrix.bin }}
          path: ${{ runner.temp }}/contract

      - name: attach and sign the configuration contract
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB_DIGEST: ${{ steps.digests.outputs.dockerhub }}
          GHCR_DIGEST: ${{ steps.digests.outputs.ghcr }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          token="${RUNNER_TEMP}/cosign-oidc-token"
          artifact_type="application/vnd.terrace.config-schema.v1+json"
          contract="${RUNNER_TEMP}/contract/${BIN}.json"

          for pair in "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}" "${GHCR_IMAGE}@${GHCR_DIGEST}"; do
            # From the contract's own directory, by name. `oras` rejects an absolute file path,
            # and `--disable-path-validation` would only trade that refusal for a runner path
            # published as the attachment's title annotation.
            ( cd "$(dirname "$contract")" && "${RUNNER_TEMP}/registry-retry" oras attach \
              --artifact-type "$artifact_type" \
              "$pair" "$(basename "$contract"):application/json" )

            # The referrer's own digest, which is what cosign signs: signing the image again
            # would say nothing about the document hanging off it.
            #
            # Polled, because `registry-retry` cannot see this one: Docker Hub's referrers index
            # is eventually consistent, so for seconds after the attach above returns, a discover
            # answers with an empty index — a successful call, not a failed one, and the wrapper
            # only retries failures.
            digests=""
            for attempt in 1 2 3 4 5 6; do
              if [ "$attempt" -gt 1 ]; then
                sleep $(( (attempt - 1) * 5 ))
              fi
              digests=$("${RUNNER_TEMP}/registry-retry" oras discover --format json \
                --artifact-type "$artifact_type" "$pair" \
                | jq -r --arg t "$artifact_type" '[.. | objects | select(.artifactType? == $t) | .digest] | unique | .[]')
              if [ -n "$digests" ]; then
                break
              fi
            done

            # Still exactly one, or the chart repository would have to pick between two documents
            # claiming to describe the same image.
            if [ "$(printf '%s\n' "$digests" | grep -c .)" != "1" ]; then
              echo "::error::expected one config-schema referrer on ${pair} within 75s of attaching one, got: ${digests:-none}" >&2
              exit 1
            fi
            referrer="$digests"

            "${RUNNER_TEMP}/registry-retry" cosign sign --yes --identity-token "$token" "${pair%@*}@${referrer}"
          done

      - name: attest the SBOM against the published digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB_DIGEST: ${{ steps.digests.outputs.dockerhub }}
          GHCR_DIGEST: ${{ steps.digests.outputs.ghcr }}
          SBOM: sbom-${{ matrix.bin }}.spdx.json
        run: |
          set -euo pipefail
          token="${RUNNER_TEMP}/cosign-oidc-token"
          "${RUNNER_TEMP}/registry-retry" cosign attest --yes --identity-token "$token" --predicate "$SBOM" --type spdxjson "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}"
          "${RUNNER_TEMP}/registry-retry" cosign attest --yes --identity-token "$token" --predicate "$SBOM" --type spdxjson "${GHCR_IMAGE}@${GHCR_DIGEST}"

  # The hand-off to the deployable chart: pin the services this run published in
  # `TimSchoenle/helm-charts` to their new digests, and open a pull request there. It is a pull
  # request and not a push because the chart repository gates its own releases — this job
  # proposes, that repository decides.
  #
  # It runs after `manifest` and not after `build` deliberately: what a chart pins must be a
  # digest that is signed and SBOM-attested, and `manifest` is where both happen.
  #
  # Only the published services appear in `images`. The action updates the keys it is given and
  # leaves the rest of `values.yaml` untouched, so a service that did not change keeps the exact
  # `tag@digest` string it already had — which is what keeps its Deployment from rolling. The
  # chart therefore carries a mix of versions on purpose; every entry is digest-pinned, so the
  # mix is a record of when each service last changed rather than a drift.
  helm-release:
    name: Helm Release
    needs: [release-please, plan, manifest]
    # Same guard as `build` and `manifest`. With `fail-fast: false` on `manifest`, a bare output
    # test would let one failed leg through and this job would then propose a chart bump that
    # claims a release which is missing one of its services. The digest count is checked against
    # the plan below for the same reason, since `!failure()` alone no longer implies a full set.
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release_created == 'true' && needs.plan.outputs.any == 'true' }}
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing here uses `GITHUB_TOKEN`: the artifacts belong to this same run, which the runner's
    # own token covers, and the chart pull request is made with a token the action mints for the
    # *charts* repository from the release bot's credentials.
    permissions: {}
    outputs:
      pr_url: ${{ steps.chart.outputs.pr-url }}
      chart_version: ${{ steps.chart.outputs.chart-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: download every published manifest list digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/list-digests
          pattern: list-digest-*
          merge-multiple: true

      # The values key is *derived* from the binary name rather than read from a table, so that
      # adding a service does not also require editing a mapping here that nothing checks. The
      # image set itself comes from `plan`, which reads the Dockerfile and the deploy blacklist;
      # a hand-maintained list of the services here would sit outside everything that keeps them
      # in step.
      #
      # The chart nests the long-running services under `services.` and camel-cases their names;
      # `bootstrap` is a one-shot job and sits at the top level. A key that does not already exist
      # in `values.yaml` is an error in the action, so a naming drift fails loudly there.
      - name: map each published digest onto its chart values key
        id: images
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          PLANNED: ${{ needs.plan.outputs.images }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/list-digests/*)
          expected=$(printf '%s' "$PLANNED" | jq 'length')
          # The plan is what says how many services this release publishes, so it is what the
          # digest set has to match. Fewer means a `manifest` leg produced nothing and the chart
          # would be bumped to a version whose image set is incomplete; more means the artifact
          # pattern is picking up something this run did not plan.
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::planned ${expected} image(s) but downloaded ${#files[@]} digest(s); a chart bump from a partial publish would claim a release that was never built"
            exit 1
          fi
          images=$(
            for file in "${files[@]}"; do
              bin=$(basename "$file")
              digest=$(cat "$file")
              case "$digest" in
                sha256:*) ;;
                *) echo "::error::'${bin}' exported '${digest}', which is not a digest" >&2; exit 1 ;;
              esac
              case "$bin" in
                bootstrap) key="bootstrap.image.tag" ;;
                *) key="services.$(printf '%s' "$bin" | sed -E 's/-(.)/\U\1/g').image.tag" ;;
              esac
              jq -n --arg key "$key" --arg tag "$TAG" --arg digest "$digest" \
                '{($key): {tag: $tag, digest: $digest}}'
            done | jq -sc 'add'
          )
          echo "json=${images}" >> "$GITHUB_OUTPUT"

      - name: open the chart update pull request
        id: chart
        uses: TimSchoenle/actions/actions/helm/update-chart-version@3b83076da17618c3221049eb1e671f20e8403694 # tag=actions-helm-update-chart-version-v1.6.3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.HELM_REPO }}
          chart-path: ${{ env.CHART_PATH }}
          images: ${{ steps.images.outputs.json }}
          # `Chart.yaml` records `appVersion` without the `v` its image tags carry, so this is the
          # one place `version` is correct and `tag_name` is not.
          app-version: ${{ needs.release-please.outputs.version }}
          # Explicit rather than left to the action's default: an application release does not
          # change the chart's templates, so it is a patch of the chart regardless of whether the
          # application bumped a major. A chart change is the chart repository's own release.
          version-bump: patch
          # The action sanitizes this — mentions and issue-closing keywords are neutralized — so
          # the release notes can be carried across repositories without the chart pull request
          # cross-linking or closing anything in this one.
          changelog: ${{ needs.release-please.outputs.body }}

  # `always()`, so a release that tagged but failed to publish still gets a summary — which is the
  # reason the text below branches on `manifest`'s result rather than asserting the images
  # shipped. It ran on `always()` and claimed a full publish unconditionally, so every way the
  # build path can fail produced a green-sounding summary under a tag with nothing behind it.
  #
  # It also names which images were *not* published. With a narrowed release that is the only
  # place the decision is visible: a reader has to be able to tell "notifier was unchanged" from
  # "notifier was supposed to be built and silently was not".
  # The desktop client. Same source tree as the SPA image above — `web/frontend` builds two ways
  # (see `src/platform/`) — but it ships as installers on the GitHub release rather than as a
  # container, because nobody runs a reader's desktop app from a registry.
  #
  # Independent of `plan`/`build`: those decide which *images* changed, and this artifact is not
  # one. It is cut for every release, so a reader upgrading always finds a build carrying the tag.
  desktop:
    name: desktop app (${{ matrix.os }})
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read # to check out the tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # The release commit, named by sha rather than by tag: the release is still a draft at this
      # point and GitHub does not materialise a draft's tag until it is published, which happens
      # in `desktop-release` below. The two are the same commit — the push that started this run
      # is what release-please released.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No toolchain version named here on purpose: `rust-toolchain.toml` at the repository root
      # governs, and rustup walks up to it from `web/frontend` even though that is its own
      # workspace. A pin in this file is a seventh copy waiting to drift from the manifest.
      - name: install the toolchain named by rust-toolchain.toml
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web/frontend
          shared-key: desktop-${{ matrix.os }}

      # `wry` is `WebKitGTK` here. Same packages `ci.yml`'s frontend job installs and the `.deb`'s
      # `depends` names at runtime.
      - name: desktop build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev libayatana-appindicator3-dev

      # Version-pinned to the `dioxus` in `web/frontend/Cargo.lock`: `dx bundle` refuses to run
      # on a mismatch, because it emits the JS glue the runtime has to agree with. The same pin
      # is in `deploy/docker/Dockerfile`; both track the lockfile.
      #
      # Built from source, which costs several minutes. Acceptable here — this job runs once per
      # release — and it avoids taking a dependency on a third-party binary installer for a tool
      # that produces the artifact readers download.
      - name: install the Dioxus CLI
        run: cargo install dioxus-cli@0.7.10 --locked

      # Written into the working copy and never committed. The alternative — release-please
      # bumping `web/frontend/Cargo.toml` through `extra-files` — cannot also bump
      # `web/frontend/Cargo.lock`, and `ci.yml`'s `supply-chain` job runs `cargo metadata
      # --locked` over exactly that pair.
      #
      # The guard is not decoration: a silent no-match here ships every release numbered 0.1.0.
      - name: stamp the release version
        working-directory: web/frontend
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -c '^version = ".*"$' Cargo.toml)
          if [ "$matches" -ne 1 ]; then
            echo "::error::expected exactly one package version line in web/frontend/Cargo.toml, found ${matches}"
            exit 1
          fi
          sed -i "s/^version = \".*\"$/version = \"${VERSION}\"/" Cargo.toml
          grep '^version = ' Cargo.toml

      # `assets/main.css` is the committed Tailwind output, and `ci.yml`'s `css` job fails the
      # merge if it is stale — so the file at this tag is current and there is no reason to put
      # Node on the path that builds a signed-off artifact.
      #
      # The package types are resolved from one `case` rather than interpolated from the matrix,
      # for the reason the `build` job resolves its image parameters that way: a `${{ … }}` inside
      # a `run:` block is expanded into the script *before* the shell sees it, so the value is
      # code rather than data — flagged by zizmor (`template-injection`) whether or not the
      # particular value is under anyone's control. An unknown `os` fails loudly instead of
      # bundling nothing.
      #
      # The flag is repeated per type rather than given a comma-separated list, because that is
      # the form verified against `dx bundle`; a bash array so nothing depends on word splitting.
      - name: bundle
        working-directory: web/frontend
        env:
          TANKOVAULT_COMMIT: ${{ github.sha }}
          OS: ${{ matrix.os }}
        shell: bash
        run: |
          set -euo pipefail
          # appimagetool passes its own `-mkfs-time` to mksquashfs so an AppImage is
          # reproducible, and squashfs-tools refuses a timestamp given on the command line and
          # through `SOURCE_DATE_EPOCH` at once. The workflow-level constant is therefore fatal
          # to the appimage leg, and it reports itself as `linuxdeploy failed with exit code
          # Some(1)` with the real cause — `FATAL ERROR:SOURCE_DATE_EPOCH and command line
          # options can't be used at the same time to set timestamp(s)` — buried in a captured
          # stdout blob. Removing it here is safe precisely because this job builds no image:
          # the constant exists to keep buildx cache keys identical across workflows, and no
          # buildx runs in this process tree.
          unset SOURCE_DATE_EPOCH
          case "$OS" in
            windows) types=(--package-types msi --package-types nsis) ;;
            linux)   types=(--package-types deb --package-types appimage) ;;
            *)       echo "::error::no package types are defined for os ${OS}"; exit 1 ;;
          esac
          dx bundle --platform desktop --release \
            --no-default-features --features desktop \
            "${types[@]}" --out-dir dist

      # The unpacked app beside the installers, for people who would rather not run one.
      #
      # `dx` stages it at `target/dx/<bin>/release/<platform>/app`, which is discovered rather
      # than written down — and asserted to be exactly one, the same way the Dockerfile asserts
      # its web bundle. `head -n 1` over a glob that matched twice would silently archive
      # whichever sorted first.
      - name: portable archive
        working-directory: web/frontend
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          OS: ${{ matrix.os }}
        shell: bash
        run: |
          set -euo pipefail
          matches=$(find target/dx -type d -path '*/release/*/app')
          count=$(printf '%s\n' "$matches" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one staged app directory under target/dx, found ${count}"
            printf '%s\n' "$matches" >&2
            exit 1
          fi
          echo "packing ${matches}"
          name="tankovault-desktop-${VERSION}-${OS}"
          if [ "$OS" = "windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${matches}/*' -DestinationPath 'dist/${name}.zip'"
          else
            tar -czf "dist/${name}.tar.gz" -C "$matches" .
          fi

      # Uploaded to the run first and attached to the release by the job below, so the checksums
      # file covers the same bytes that were published rather than a second build of them.
      - name: collect
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: web/frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # One job attaches everything, so `sha256sums.txt` is written over the complete set. Split
  # across the matrix it would describe half a release, twice.
  #
  # It is also the job that **publishes** the release, which is why a desktop build that fails
  # leaves a draft and no tag rather than a published release nobody can attach anything to.
  #
  # ---------------------------------------------------------------------------------------------
  # The update channel: why this job signs a manifest
  # ---------------------------------------------------------------------------------------------
  # `web/frontend/src/update` lets an installed desktop client update itself from these releases,
  # which means it downloads an executable and runs it. `sha256sums.txt` cannot authorise that: it
  # is served from the same place as the files it describes, so it proves only that the download
  # was not corrupted in transit — which TLS already did.
  #
  # So the installers are described by `desktop-manifest.json` (the version, and one entry per
  # platform naming the installer with its SHA-256), and that document is signed twice:
  #
  #   desktop-manifest.json.minisig         minisign; **this is the gate**. The client carries the
  #                                         public key and reads nothing out of the manifest until
  #                                         it verifies.
  #   desktop-manifest.json.cosign.bundle   cosign, keyless — the same posture the images have.
  #                                         Nothing in the client reads it; it is there so a
  #                                         release is publicly verifiable with `cosign`.
  #
  # minisign rather than cosign for the client's own check because verification has to happen
  # inside a reader's app: `minisign-verify` is one ed25519 check with zero dependencies, while a
  # keyless verification needs a Fulcio chain, a Rekor proof and a TUF trust root that goes stale.
  # `docs/RELEASING.md` carries the full reasoning and the key-rotation procedure.
  #
  # All of it happens **before** `checksums`, so the checksums file covers the manifest and both
  # signatures rather than describing only the files that existed when it ran.
  desktop-release:
    name: attach the desktop builds and publish
    needs: [release-please, desktop]
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release_created == 'true' }}
    # Required, not decorative: `RELEASE_BOT_*` and `MINISIGN_*` are `release` environment secrets,
    # and a job that omits the environment reads them as empty strings.
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out; the release itself is written with the bot token below
      id-token: write # cosign keyless over the desktop manifest (Fulcio/Rekor via the OIDC token)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      # Targets are matched **by extension, not by file name**: `dx` derives the installer names
      # from the product name and the version (`Tankovault_2.1.0_x64_en-US.msi`) and nothing in
      # this repository controls that string, so a client that looked for a name would break on the
      # first bundler change. A file matching none of the cases is an error rather than a skip —
      # shipping a manifest that silently omits a platform leaves those readers with an update they
      # are told about and cannot take.
      #
      # The portable archives are deliberately absent: nothing installs them, and the client
      # reports such a copy as one it must not replace.
      #
      # No `published_at` here. The release is still a draft, so it has none; the client reads it
      # from the API, which is the value the hold-back window has to use anyway — the moment the
      # installers became reachable, not the moment they were built.
      - name: build the desktop manifest
        working-directory: dist
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -z "$(ls -A .)" ]; then
            echo "::error::no desktop artifacts were produced"
            exit 1
          fi
          targets='{}'
          for file in *; do
            case "$file" in
              desktop-manifest.json*|sha256sums.txt) continue ;;
              *.zip|*.tar.gz)  continue ;;
              *.msi)           kind=windows-x86_64-msi ;;
              *.exe)           kind=windows-x86_64-nsis ;;
              *.AppImage)      kind=linux-x86_64-appimage ;;
              *.deb)           kind=linux-x86_64-deb ;;
              *)
                echo "::error::'${file}' matches no manifest target; the desktop client would not be able to resolve this release"
                exit 1
                ;;
            esac
            if printf '%s' "$targets" | jq -e --arg k "$kind" 'has($k)' >/dev/null; then
              echo "::error::two files claim the '${kind}' target; the second is '${file}'"
              exit 1
            fi
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            size=$(stat -c%s "$file")
            targets=$(printf '%s' "$targets" | jq -c \
              --arg k "$kind" --arg f "$file" --arg s "$sha" --argjson z "$size" \
              '. + {($k): {file: $f, sha256: $s, size: $z}}')
          done
          # Every platform the release publishes has to be in it. `desktop-release` is skipped when
          # either matrix leg fails, so a missing key here means a naming change this `case` did
          # not see rather than a build that did not run.
          for required in windows-x86_64-msi windows-x86_64-nsis linux-x86_64-appimage linux-x86_64-deb; do
            if ! printf '%s' "$targets" | jq -e --arg k "$required" 'has($k)' >/dev/null; then
              echo "::error::the manifest has no '${required}' entry"
              exit 1
            fi
          done
          jq -n --arg v "$VERSION" --argjson t "$targets" '{version: $v, targets: $t}' \
            > desktop-manifest.json
          cat desktop-manifest.json

      # The signature the *client* checks. Without it an installed reader is told a release exists
      # and refuses to install it, which is the safe failure but still a broken update channel — so
      # a missing secret fails the release here rather than shipping one nobody can take.
      #
      # `-H` prehashes, because that is what the client verifies with (`allow_legacy: false` in
      # `discover::verify`); the password goes in on stdin because minisign otherwise looks for a
      # terminal, and an unencrypted key simply ignores it.
      - name: sign the desktop manifest with minisign
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::the release environment has no MINISIGN_SECRET_KEY, so this release cannot be signed and no installed desktop client will accept it as an update. See docs/RELEASING.md."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          key="${RUNNER_TEMP}/minisign.key"
          # `tr -d '\r'`: minisign parses the key file line by line and a secret pasted into the
          # GitHub secret from a Windows editor carries CRLF, which makes the base64 line
          # unreadable and reports itself only as an unhelpful decode failure.
          printf '%s\n' "$MINISIGN_SECRET_KEY" | tr -d '\r' > "$key"
          # The passphrase on stdin, newline-terminated: with no terminal minisign reads it with
          # `readpassphrase`, which takes the line and strips the newline. An unencrypted key
          # (generated with `-W`) never prompts and ignores this.
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -H -s "$key" -m desktop-manifest.json \
                -t "TankoVault ${TAG} desktop manifest"
          rm -f "$key"

      # The check that makes the signature worth anything: it verifies against **the keys the
      # shipped client actually compiles in**, read out of the source rather than restated here.
      #
      # A key pair that has been rotated on one side only is otherwise invisible until a reader's
      # client refuses the release — at which point the release is published, immutable, and cannot
      # be re-signed. An empty list is the pre-key state and warns rather than fails, because that
      # is a client which does not check for updates at all.
      - name: verify the signature against the client's own trusted keys
        env:
          KEYS_FILE: web/frontend/src/update/discover.rs
        run: |
          set -euo pipefail
          # `awk` and not a `sed` address range: sed searches for the range's end starting at the
          # line *after* the start, so a one-line `const TRUSTED_KEYS: &[&str] = &[];` would run on
          # to the next `];` in the file — which is inside the test module, whose fixture key also
          # begins `RW`. That would have made a release "verify" against a published test vector.
          keys=$(awk '/^const TRUSTED_KEYS/ { inside = 1 }
                      inside { print; if (/\];/) exit }' "$KEYS_FILE" \
                 | grep -o '"RW[A-Za-z0-9+/=]\{1,\}"' | tr -d '"' || true)
          if [ -z "$keys" ]; then
            echo "::warning::the desktop client carries no trusted signing key, so it does not check for updates; this release is signed but no shipped build can verify it. See docs/RELEASING.md."
            exit 0
          fi
          for key in $keys; do
            if minisign -V -P "$key" -m dist/desktop-manifest.json >/dev/null 2>&1; then
              echo "::notice::the manifest verifies against a key the client trusts"
              exit 0
            fi
          done
          echo "::error::the manifest does not verify against any key in ${KEYS_FILE}; MINISIGN_SECRET_KEY and the client's TRUSTED_KEYS have drifted apart. Publishing now would ship a release no installed client can take."
          exit 1

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Same one-token discipline as the `manifest` job, and for the same two reasons recorded
      # there: cosign otherwise fetches an ambient token per call, and the file must hold the JWT
      # with **no trailing newline** or Fulcio rejects the `Authorization` header without saying
      # why. `printf` is a builtin, so the token never reaches any process's `argv`.
      - name: mint one OIDC token for cosign
        run: |
          set -euo pipefail
          umask 077
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                       "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -er '.value')
          printf '%s' "$token" > "${RUNNER_TEMP}/cosign-oidc-token"

      # Transparency, not the gate. This is what lets anyone check a release with the same tooling
      # the images are verified with, without the client having to carry a sigstore stack.
      - name: attest the desktop manifest with cosign
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --identity-token "${RUNNER_TEMP}/cosign-oidc-token" \
            --bundle desktop-manifest.json.cosign.bundle \
            desktop-manifest.json

      # Last, so it covers the manifest and both signatures as well as the installers.
      - name: checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./* > sha256sums.txt
          cat sha256sums.txt

      # Publishing the draft is what creates the git tag, and the tag ruleset admits only the
      # release bot — so this runs on the bot's token rather than `GITHUB_TOKEN`, which would be
      # refused at the one step that cannot be retried by hand. Narrowed to `contents`, which is
      # what uploading an asset and clearing the draft bit both need.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      # The order is the whole point. This repository's releases are **immutable**: the moment one
      # is published its asset set is frozen, and `gh release upload` against it fails no matter
      # what `--clobber` is asked to do. So release-please creates a draft, the installers go onto
      # the draft, and only then is it published.
      #
      # The installers themselves carry **no code signature**: there is no Authenticode certificate
      # and no repository signature, so Windows SmartScreen warns on first run and `apt` cannot
      # verify the `.deb`. What a reader downloading by hand has is `sha256sums.txt`; what the
      # desktop client's updater has is the signed manifest above, which is a stronger claim than
      # the checksums and the reason it exists.
      - name: attach the installers and publish the release
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
          # Everything that reaches this release afterwards does so by tag — the changelog links,
          # a reader cloning at the version, the next run of release-please working out what the
          # previous release was. A publish that left no tag behind is not a release, and it is
          # the half of this step that reports nothing on its own.
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha'

      - name: write the summary
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "## Desktop client ${TAG}"
            echo
            echo "Windows (\`.msi\`, \`.exe\`) and Linux (\`.deb\`, \`.AppImage\`) installers, plus a"
            echo "portable archive per platform, are attached to the release with \`sha256sums.txt\`."
            echo
            echo "\`desktop-manifest.json\` describes each installer by digest and is signed with"
            echo "minisign (\`.minisig\`) and, for public verification, with keyless cosign"
            echo "(\`.cosign.bundle\`). The minisign signature is what an installed client checks"
            echo "before it will download or run anything — see \`docs/RELEASING.md\`."
            echo
            echo "**The installers carry no code signature.** Windows SmartScreen will warn on"
            echo "first run; verify a manual download against the checksums file."
          } >> "$GITHUB_STEP_SUMMARY"

  # release-please's other half: the pull request proposing the release *after* this one.
  #
  # ---------------------------------------------------------------------------------------------
  # Why this is a second job and not the same invocation
  # ---------------------------------------------------------------------------------------------
  # The action tags releases and opens the release pull request in one process, and the two halves
  # disagree about when a tag exists. `draft: true` means the release the job at the top of this
  # file creates carries **no git tag** — GitHub materialises one only on publish, which is
  # `desktop-release`, minutes later. The pull-request half resolves "the previous release" by
  # looking that tag up — so in one process it looks for a tag the half before it has not created
  # yet. Release v3.1.0 logged exactly that:
  #
  #     ❯ looking for tagName: v3.1.0
  #     ✔ No latest release found for path: ., component: , but a previous version (3.1.0) was
  #       specified in the manifest.
  #     ✔ Considering: 259 commits
  #
  # The version still came from the manifest, so the failure was not visible there — but with no
  # release commit to bound the walk, the changelog became the entire history of the repository
  # re-listed and every `!` commit ever merged was counted again. #138 proposed 4.0.0 for a `main`
  # that had **nothing** on it since v3.1.0, and `auto-merge-release-please.yml` would have cut
  # that release on schedule.
  #
  # So the halves are ordered against the thing they disagree about: tag (draft, no tag) →
  # `desktop-release` (publish, tag exists) → pull request. A `workflow_dispatch` of this file is
  # the manual equivalent, since with nothing to tag it reaches this job directly.
  #
  # `desktop-release` failing leaves the release a draft and untagged, and this job is skipped
  # rather than run against a base that does not exist — the release pull request then stays absent
  # until the next push to `main`, which is the honest state. `summary` reports it.
  release-pr:
    name: open the release pull request
    needs: [release-please, desktop-release]
    # Skipped, not failed, when there was nothing to release: `desktop-release` only runs behind
    # `release_created`, so on an ordinary push to `main` it reports `skipped` and the previous
    # release's tag — the base this job needs — has been in place for as long as that release has.
    if: ${{ !cancelled() && needs.release-please.result == 'success' && (needs.desktop-release.result == 'success' || needs.desktop-release.result == 'skipped') }}
    # Required, not decorative: `RELEASE_BOT_*` are `release` environment secrets, and a job that
    # omits the environment reads them as empty strings.
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push the release branch
      issues: write # to label the release PR
      pull-requests: write # to open and maintain the release PR
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # The same app token and the same narrowing as the tagging job, for the same reason: a push
      # made with `GITHUB_TOKEN` triggers no workflows, so the release pull request would never run
      # CI and the required `ci` check could never pass.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # `skip-github-release: true` is what keeps this the *other* half. Without it this job would
      # re-run the tagging pass — harmless today, because a release pull request already tagged is
      # relabelled `autorelease: tagged` and skipped, but that is the action's bookkeeping and not
      # a property of this workflow.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.generate_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  summary:
    name: release summary
    needs: [release-please, plan, release-deps, build, manifest, helm-release, desktop-release, release-pr]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: write the summary
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          DOCKERHUB_NS: ${{ env.DOCKERHUB_NAMESPACE }}
          PLANNED: ${{ needs.plan.outputs.images }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PUBLISHED: ${{ needs.manifest.result }}
          CHART: ${{ needs.helm-release.result }}
          CHART_PR: ${{ needs.helm-release.outputs.pr_url }}
          CHART_VERSION: ${{ needs.helm-release.outputs.chart_version }}
          RELEASED: ${{ needs.desktop-release.result }}
          NEXT_PR: ${{ needs.release-pr.result }}
        run: |
          # Case-folded to match what was actually pushed; see the `build` job's `params` step.
          GHCR_PREFIX="${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}"
          count=$(printf '%s' "${PLANNED:-[]}" | jq 'length' 2>/dev/null || echo 0)
          names=$(printf '%s' "${PLANNED:-[]}" | jq -r 'join(", ")' 2>/dev/null || echo '')
          {
            echo "## Release ${TAG}"
            echo
            if [ "$PLAN_RESULT" != "success" ]; then
              echo "Planning reported \`${PLAN_RESULT}\` — **nothing was published for this tag**."
              echo "Read the \`plan\` job before re-running."
            elif [ "$count" -eq 0 ]; then
              echo "**No image changed in this release.** Nothing was rebuilt, nothing was"
              echo "republished, and no chart update was opened: every service stays on the digest"
              echo "it was already deployed at, and the tag records the changelog alone."
            elif [ "$PUBLISHED" != "success" ]; then
              echo "Publishing reported \`${PUBLISHED}\` — **the ${count} planned"
              echo "image(s) were not all published**. Read the failed jobs in this run before"
              echo "re-running; a partially pushed digest set is not a release."
            else
              echo "${count} image(s) **published** as \`linux/amd64\` + \`linux/arm64\` manifest lists:"
              echo
              echo "\`${names}\`"
              echo
              echo "to \`docker.io/${DOCKERHUB_NS}/tankovault-*\` and \`${GHCR_PREFIX}/*\`."
              echo
              echo "Every other service was unchanged, so it was not rebuilt and carries no"
              echo "\`${TAG}\` tag — its published digest, and the chart entry pinning it, are"
              echo "unchanged and its Deployment will not roll."
              echo
              echo "Each published image was structure-tested before it was pushed, signed with"
              echo "cosign (keyless) and SBOM-attested against the published digest."
              echo
              echo "Licensed under PolyForm Noncommercial 1.0.0 — the terms ship inside every image"
              echo "at \`/LICENSE\`. Commercial use needs a separate licence from the copyright holder."
              echo
              echo "SBOMs are attached to this run as artifacts (one per published image, SPDX JSON)."
            fi
            echo
            # Reported separately from the publish: the chart bump can fail on its own — a rejected
            # token, a values key the chart renamed — and that leaves published images with nothing
            # deploying them, which is invisible from this repository otherwise.
            case "$CHART" in
              success) echo "Chart bump to \`${CHART_VERSION}\` proposed: ${CHART_PR}" ;;
              skipped) echo "No chart bump was attempted (nothing was published, or publishing did not complete)." ;;
              *)       echo "The chart bump reported \`${CHART}\` — **the images are published but"
                       echo "no chart update was opened**. Re-run this job, or bump the chart by hand." ;;
            esac
            echo
            # The release is created as a draft and published by `desktop-release`, so this is not
            # a footnote about installers: until that job succeeds there is no `${TAG}` tag and
            # nothing a reader can download, however much of the image set went out.
            if [ "$RELEASED" != "success" ]; then
              echo "Attaching the desktop builds reported \`${RELEASED}\` — **the release is still a"
              echo "draft and \`${TAG}\` was never tagged**. Re-run this run's desktop jobs; the"
              echo "draft is publishable once its installers are attached."
            fi
            echo
            # The pull request for the *next* release is built from the tag this run published, so
            # it is the one job that cannot run until the draft is out. Not opening it is safe —
            # the next push to `main` opens it — but it is invisible from anywhere else.
            if [ "$NEXT_PR" != "success" ]; then
              echo "The next release pull request reported \`${NEXT_PR}\` and was **not opened**."
              echo "Re-run this workflow by hand (\`workflow_dispatch\`) once \`${TAG}\` is tagged,"
              echo "or wait for the next push to \`main\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
