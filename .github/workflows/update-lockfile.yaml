name: update-lockfile

# Keeps both lockfiles in step with `Cargo.toml` on pull requests, and commits the result.
#
# This exists for release-please and is **not optional**. `release-please-config.json` bumps
# `$.workspace.package.version`, which every one of the 26 workspace members inherits via
# `version.workspace = true`. That changes each member's recorded version in `Cargo.lock` —
# and release-please does not update lockfiles for the `simple` strategy (see the reasoning
# block in `release-please.yaml` for why `simple` and not `rust`).
#
# **Both** lockfiles, because `web/frontend` is a separate workspace that inherits nothing and
# is therefore easy to forget. It depends on `crates/api-client` and `crates/domain` by path,
# so those two carry the bumped version into `web/frontend/Cargo.lock` as surely as into the
# host one — and this workflow updated only the host lockfile until 2026-08-03. Release #50
# shipped a frontend lockfile still recording 0.4.1, which failed `cargo fetch --locked` and
# took `lockfile integrity` and `third-party notices` down with it, on `main`, after merge.
#
# Left alone, the release pull request would carry a `Cargo.lock` that disagrees with the
# manifests, and every `--locked` build in the repository fails: `xtask ci`, the `msrv` and
# `supply-chain` jobs, and the Dockerfile's `cargo auditable build --release --locked`. The
# release PR could then never go green, which is a deadlock rather than a flaky failure.
#
# It runs on every pull request, not only release ones: a Renovate PR that edits a manifest has
# exactly the same problem, and a single mechanism is easier to trust than two.
#
# `cargo update --workspace` rather than `cargo fetch`: it rewrites only the workspace members'
# entries and leaves every third-party pin alone. A release must not silently move dependency
# versions — that is what `supply-chain` and `deny` gate, and this workflow runs before them.

on:
  pull_request:

# Shared with `auto-format.yaml`, which also commits to the pull request's head branch. Two jobs
# pushing to one branch at once means a losing `git push` and a red job on a problem that does not
# exist, so they queue instead of racing — `cancel-in-progress: false`, because cancelling a job
# mid-push is worse than making it wait.
concurrency:
  group: pr-autocommit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  update-lockfile:
    name: Update Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Forks cannot read the app secrets, and a fork PR must not be able to make this repository
    # commit on its behalf. Skipping is correct: a fork's lockfile drift is the author's to fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions: {}
    # `RELEASE_BOT_APP_ID` and `RELEASE_BOT_PRIVATE_KEY` are secrets of the `release`
    # environment, not of the repository — the same pair `release-please.yaml` mints its token
    # from, declared in one place so there is one app to rotate. A job that does not name the
    # environment reads them as empty strings, and `create-github-app-token` then fails with
    # "the 'client-id' (or deprecated 'app-id') input must be set to a non-empty string",
    # which is what made this workflow red on every pull request. `deployment: false`: this is
    # a secret scope, not a deployment, and a deployment record would show up in the timeline
    # of every PR.
    environment:
      name: release
      deployment: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # A GitHub App token, not `GITHUB_TOKEN`: a push made with the default token does not
      # trigger workflows, so the lockfile fix would land without re-running the checks that
      # need it — leaving the PR red on a problem that had already been solved.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Narrowed to the one permission this job uses (zizmor `github-app`). By default the
          # minted token inherits *every* permission the app's installation holds, so a
          # compromised step here — a malicious build script reached through a dependency, say —
          # would hold the release bot's full authority for the life of the token. It needs to
          # push one commit to the PR branch; `contents: write` is that and nothing else.
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust
        # The same pin as every `ci.yml` job, deliberately: two SHAs for one action are two
        # things to review and one to forget. See `.github/zizmor.yml` for why this action is
        # pinned to a `master` commit rather than its `v1` tag.
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable

      # No BoringSSL toolchain is installed on purpose: `cargo update` resolves and rewrites the
      # lockfile without compiling anything, so none of `cmake`/`nasm`/`clang` is needed here.
      - name: Sync both lockfiles with the manifests
        id: sync
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo update --workspace --manifest-path web/frontend/Cargo.toml
          if git diff --quiet -- Cargo.lock web/frontend/Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Both lockfiles already in step with the manifests."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- Cargo.lock web/frontend/Cargo.lock
          fi

      - name: Commit the updated lockfiles
        if: steps.sync.outputs.changed == 'true'
        env:
          # The GitHub Actions bot identity, so the commit is attributable to automation rather
          # than to whoever last touched the branch.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git add Cargo.lock web/frontend/Cargo.lock
          git commit -m "build: sync both Cargo.lock files with the workspace manifests"
          git push
