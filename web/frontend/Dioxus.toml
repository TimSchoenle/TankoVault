[application]
name = "tankovault"

[web.app]
# Deliberately empty. `dx` *appends* this into the `<title>` already in `index.html` rather than
# replacing it, so the shipped bundle read "TankoVault — manga trackerTankoVault — manga tracker";
# removing the key instead appends `dx`'s own default. `index.html` owns the pre-boot title (see
# the comment there) and `crate::title` owns it from first render on.
title = ""
# Base path when the SPA is served under a sub-path by the API/CDN.
base_path = ""

[web.watcher]
# The Tailwind CLI writes assets/tailwind.css; watch it so `dx serve` hot-reloads styles.
watch_path = ["src", "assets"]

[web.resource]
# Extra static assets copied verbatim into the build output.
[web.resource.dev]

[bundle]
identifier = "dev.tankovault.frontend"
