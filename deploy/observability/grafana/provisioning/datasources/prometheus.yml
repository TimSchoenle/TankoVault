# `uid` is fixed, not generated: the committed dashboard JSON references it, and a generated one
# would render every panel "datasource not found" instead of failing the import.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: tankovault-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must match global.scrape_interval in prometheus.yml or $__rate_interval picks a window
      # narrower than the scrape interval and every rate() renders as gaps.
      timeInterval: 15s
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.5.0
