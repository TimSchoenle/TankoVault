[package]
name = "tankovault-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Shared production runtime for TankoVault services: bootstrap, graceful shutdown, health probes, middleware, rate limiting, audit and metrics."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[lints]
workspace = true

[features]
default = []
# Postgres-backed audit sink and connection-pool health check. Enabled by the services
# that own a database handle; `render` and `challenge-solver` deliberately do not.
db = ["dep:tankovault-db", "dep:sqlx"]
# Redis-backed rate-limit store, so a limit holds across replicas rather than per process.
redis = ["dep:fred"]

[dependencies]
tankovault-config.workspace = true
tankovault-domain.workspace = true

async-trait.workspace = true
axum.workspace = true
futures.workspace = true
governor.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `reload` only: the rebuild supervisor behind `crate::reload`, which brings the filesystem
# watcher and its debouncer with it. The `loader` half arrives through `tankovault-config`
# instead, so this crate never names a figment.
terrace-config = { workspace = true, features = ["reload"] }

tankovault-db = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# `i-scripts` is not part of fred's default `i-std` feature set but is what exposes
# `LuaInterface::eval`, which the token-bucket store needs for an atomic check-and-consume.
fred = { workspace = true, optional = true, features = ["i-scripts"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# `Jail` for the reload tests: it sandboxes the environment *and* a temp directory, and
# `std::env::set_var` is `unsafe` in edition 2024, which `unsafe_code = "forbid"` rules out.
figment = { workspace = true, features = ["test"] }
# The runtime error type the reload test instantiates the supervisor with, which is what every
# service's `main` actually passes.
anyhow = { workspace = true }
# `tests/prop_ratelimit.rs` (TEST P-07). Already in the lockfile via five other members, so
# this adds no new resolution and nothing to `cargo deny`'s duplicate budget.
proptest = { workspace = true }
