name: Renovate Auto Approve

# Renovate's `automerge` cannot merge into a branch whose protection requires a review, and it
# will not approve its own pull request. This supplies the approval for the bot's pull requests
# only, identified by *account id* rather than by name — a name is claimable, an id is not.
#
# It approves; it does not merge. The required status check (`ci`, defined in ci.yml) is still
# what decides whether the merge happens, so an auto-approved dependency bump that breaks a gate
# stays open exactly like anyone else's.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same pull request supersedes the run judging the previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-auto-approve-renovate
  cancel-in-progress: true

permissions: {}

jobs:
  auto-approve-renovate:
    name: Auto Approve Renovate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to read the bot's PRs and their commits, and to approve them
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Auto-approve Renovate PRs
        uses: TimSchoenle/actions/actions/maintenance/auto-approve-pr@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-maintenance-auto-approve-pr-v3.0.0
        with:
          token: ${{ github.token }}
          user_ids: "29139614,253958393" # Renovate, actions-maintenance-bot
          branch_pattern: '^renovate\/.*$'
          reject_forks: 'true'
          ignore_empty_prs: 'true'
