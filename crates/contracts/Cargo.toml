[package]
name = "tankovault-contracts"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Shared NATS message/event schemas, HTTP wire contracts and subject naming."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[dependencies]
tankovault-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
# The HTTP contracts in `sync` are schema'd so `services/api` can annotate the routes it
# proxies, which is what lets `xtask openapi` generate a typed client for them.
utoipa = { workspace = true }

[lints]
workspace = true
