[package]
name = "tankovault-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Layered typed configuration loading."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[dependencies]
# Only for `MatchingConfig`, whose defaults are the scorer's own — so a knob and the value it
# overrides cannot drift apart (ARCH-16). `tankovault-matcher` is a leaf crate over `domain`.
tankovault-matcher = { workspace = true }
serde = { workspace = true }
figment = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
