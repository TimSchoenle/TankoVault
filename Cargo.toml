[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/config",
    "crates/contracts",
    "crates/service",
    "crates/db",
    "crates/fetch",
    "crates/solver",
    "crates/adapters",
    "crates/auth",
    "crates/email",
    "crates/matcher",
    "crates/bus",
    "crates/api-client",
    "crates/test-support",
    "services/api",
    "services/control-plane",
    "services/worker",
    "services/notifier",
    "services/sync",
    "services/challenge-solver",
    "services/render",
    "services/frontend",
    "xtask",
]
# The Dioxus WASM frontend is built with the `dx` CLI against the `wasm32` target
# and is intentionally excluded from the default host workspace build.
exclude = ["web/frontend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["TankoVault contributors"]
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
# A lint *group* must sit at a lower priority than individual lints so specific
# overrides win; without this, `cargo clippy` refuses to run (equal-priority error).
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# `pedantic` on as a warn-level group; individual noisy lints relaxed workspace-wide.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# --- internal crates ---
tankovault-domain = { path = "crates/domain" }
tankovault-config = { path = "crates/config" }
tankovault-contracts = { path = "crates/contracts" }
tankovault-service = { path = "crates/service" }
tankovault-db = { path = "crates/db" }
tankovault-fetch = { path = "crates/fetch" }
tankovault-solver = { path = "crates/solver" }
tankovault-adapters = { path = "crates/adapters" }
tankovault-auth = { path = "crates/auth" }
tankovault-email = { path = "crates/email" }
tankovault-matcher = { path = "crates/matcher" }
tankovault-bus = { path = "crates/bus" }
# Not referenced by any workspace member — `web/frontend` is excluded from the workspace
# and uses its own path dep. Kept as the single place the crate is named, so a future
# host-side consumer inherits the same path rather than inventing one.
tankovault-api-client = { path = "crates/api-client" }

# --- OpenAPI: schema derivation from handlers + browsable API docs ---
# The derived spec is exported by `xtask openapi` and fed to `progenitor` (an xtask dep) to
# regenerate the typed `crates/api-client`, which the frontend consumes; `utoipa-scalar`
# serves the same spec as a browsable UI at `/scalar`.
utoipa = { version = "5", features = ["uuid", "axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# --- async runtime & web ---
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
axum = { version = "0.8", features = ["macros", "json", "query"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header", "query"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
# `catch-panic`: turns a panicking handler into a 500 for that one request instead of a
# process abort. See the `panic = "unwind"` note in `[profile.release]`.
tower-http = { version = "0.7", features = ["trace", "cors", "compression-full", "timeout", "request-id", "set-header", "catch-panic"] }

# --- data / storage ---
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "macros", "migrate"] }
fred = { version = "10.1", features = ["enable-rustls"] }
async-nats = "0.49"
bytes = "1"

# --- crawl / parse ---
# `reqwest` remains for internal, non-crawling HTTP (AniList sync, notifier webhooks, the
# generated API client). Everything that talks to a *provider* goes through `wreq` instead:
# providers sit behind Cloudflare/DDoS-Guard, which fingerprint the TLS ClientHello and the
# HTTP/2 SETTINGS frame. Only a client that reproduces a real browser's handshake gets
# through, which rustls/reqwest cannot do by construction.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "brotli", "cookies", "stream"] }
# BoringSSL-backed client with browser TLS/HTTP2 emulation. Default features give the
# bundled webpki trust store (no OS CA bundle needed on `scratch`) and charset decoding.
wreq = { version = "5.3", features = ["json", "stream", "gzip", "brotli", "zstd", "deflate"] }
# The emulation profile catalogue (Chrome/Firefox/Safari/Edge/OkHttp, per-OS header sets).
# Only `emulation`: the compression features here are re-exports of `wreq`'s, already
# selected above, and `emulation-rand` would pick a *random* profile per client — the
# opposite of the stable per-provider identity the fetch stack needs.
wreq-util = { version = "2.2", default-features = false, features = ["emulation"] }
scraper = "0.27"
governor = "0.10"
url = "2.5"
# Headless-browser driver for the optional `render` service (design §9). Default
# features only (`bytes`); the `fetcher`/TLS features pull a chromium *downloader* we
# don't use — the CDP link is a plain local `ws://`, so no aws-lc/OpenSSL is dragged in.
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"] }

# --- domain building blocks ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde", "std"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
thiserror = "2"
anyhow = "1"
figment = { version = "0.10", features = ["toml", "env"] }

# --- auth / security ---
argon2 = "0.5"          # 0.6 is only a pre-release (rc); 0.5 is the current stable.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
aes-gcm = "0.11"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
# Constant-time comparison for the internal service-to-service token. Already in the tree
# transitively (aes-gcm, argon2); declared here so the comparison is not hand-rolled.
subtle = "2"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
# NOTE: the OpenTelemetry stack (`opentelemetry`, `opentelemetry_sdk`, `opentelemetry-otlp`,
# `tracing-opentelemetry`) was declared here and used by zero members, while
# `crates/config` exposed an `otlp_endpoint` knob that only logged "export is pending". A
# config knob that silently does nothing is worse than an absent one: an operator who sets it
# believes traces are being exported and finds out during an incident. Both the declarations
# and the knob are removed. Re-add them together, with an actual `OpenTelemetryLayer` in
# `crates/service/src/telemetry.rs`, or not at all.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }


# --- email ---
# rustls + ring to match the rest of the stack (no native-tls / OpenSSL in the
# runtime images); webpki-roots for a bundled trust store.
# No `pool` feature: the pooled builder spawns a background task and so requires a
# running Tokio reactor at `build()` time; a connection-per-send transport is plenty
# for the notifier's occasional alerts and keeps construction runtime-independent.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# `unwind`, not `abort`. With `abort`, a panic anywhere in a handler terminated the whole
# process — so any single panicking code path (an overflow, an out-of-range slice, an
# `unwrap` on a `HeaderValue`) let an unauthenticated client restart a replica at will and
# take every in-flight request with it. Unwinding lets `CatchPanicLayer`
# (`crates/service/src/http.rs`) turn it into a 500 for the one request that caused it.
#
# The cost is landing-pad code in the binary. That is the correct trade for a network
# service: a panic here is a bug to fix, not a reason to drop everyone else's requests.
panic = "unwind"
# Silent wrapping in a pagination offset is worse than a caught error, and this workload is
# nowhere near arithmetic-bound. Cheap insurance against the class of bug SEC-11 found.
overflow-checks = true
