[package]
name = "tankovault-frontend"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Static web server for the Dioxus SPA with a streaming /v1/* reverse proxy to the api."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[[bin]]
name = "frontend"
path = "src/main.rs"

[lib]
name = "tankovault_frontend"
path = "src/lib.rs"

[dependencies]
tankovault-config = { workspace = true }
# The `Describe` derive on this service's own config root, beside the blocks
# `tankovault-config` describes. `config-contract` walks the root to build the document
# this image publishes, so a local block that skipped the derive would be a key the
# contract claims the binary does not read.
terrace-config = { workspace = true, features = ["schema"] }
tankovault-service = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
tower = { workspace = true }
# `fs` adds ServeDir/ServeFile (static bundle + SPA fallback); `set-header` and `trace`
# already ride on the workspace feature set, merged here.
# `compression-full`: the WASM bundle is the largest thing this tier serves and was
# shipped uncompressed. `set-header`/`trace` come from the workspace default set.
tower-http = { workspace = true, features = ["fs", "compression-full"] }
# The whole Content-Security-Policy: the scan that admits the shell's inline boot scripts by
# hash (computed from the served `index.html` at startup rather than hardcoded — a constant
# drifts the moment the shell is edited, and silently, since the only symptom is a browser
# refusing to run it), the typed directives, and the per-response nonce behind
# `TANKOVAULT_FRONTEND__CLOUDFLARE__SCRIPT_NONCE`.
csp-shell = { workspace = true }

[lints]
workspace = true
