# The toolchain everything is built with. CI reads the channel from here; the only other copies
# are the two `FROM` tags in `deploy/docker/Dockerfile`, which Renovate's `rust toolchain` group
# moves in the same pull request as this line.
#
# Without it, the workspace's `rust-version`, CI's `dtolnay/rust-toolchain@stable` and each
# developer's last `rustup` install would each pick a different Rust, and a nightly-only key in
# `rustfmt.toml` would work for whoever added it and fail silently in CI.
#
# Pinning here means `cargo`, `rustfmt` and `clippy` agree everywhere, and a toolchain bump
# becomes a reviewed pull request, not a Tuesday.
#
# `rust-version` in the workspace manifest is the *minimum supported* version and is what the
# `msrv` CI job checks; this is the version everything is actually built with. The two are
# separate claims with separate jobs behind them and move independently.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# `wasm32-unknown-unknown` for `web/frontend`, which is excluded from the host workspace but
# built by this same toolchain.
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
