[package]
name = "tankovault-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The typed configuration blocks every TankoVault service reads, and the TankoVault dialect of the terrace-config loader."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[dependencies]
# For `MatchingConfig`: its defaults are the scorer's own — so a knob and the value it overrides
# cannot drift apart — and its `impl Canonicaliser` is the one place the configured thresholds
# meet the scorer, which is what keeps both out of `crates/db` (ARCH-16). `tankovault-matcher` is
# a leaf crate over `domain`.
tankovault-matcher = { workspace = true }
# For the `Canonicaliser` port itself, which is domain vocabulary rather than the scorer's.
tankovault-domain = { workspace = true }
serde = { workspace = true }
# Config is where secrets enter the process, so it is where the wrapper has to start: a
# `SecretString` field cannot be un-wrapped by the aggregate that nests it, so the DSN a
# service reads out of `TANKOVAULT_DATABASE__URL` stays wrapped all the way to the pool
# builder. `figment` deserialises into it through the crate's `serde` feature.
secrecy = { workspace = true }
# The loader itself: this crate owns the *schema* and the TankoVault dialect
# (`src/loader.rs`), and nothing of the layering, the secrets-directory provider or the
# shadow-key rejection. The reload supervisor is `crates/service`'s half; taking it here would
# link notify into every consumer of a config struct.
#
# `explain` is what `super::explain` reports at boot — where every key came from, and which of
# them a higher layer is quietly shadowing. It costs no dependency, only a second walk of the
# layers and the strings that render them.
terrace-config = { workspace = true, features = ["loader", "explain"] }

[dev-dependencies]
# The loader's own test harness: a temporary directory, a cleared environment restored on the
# way out, and arrangement methods that derive every file and variable name from the dialect
# under test rather than restating it. It replaced a hand-rolled `figment::Jail` fixture, and
# with it the `#[expect(clippy::result_large_err)]` that `figment::Error` forced onto every
# test in this crate.
terrace-config = { workspace = true, features = ["testing"] }

[lints]
workspace = true
