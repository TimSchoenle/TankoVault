[package]
name = "tankovault-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Password hashing (argon2id), JWT access tokens, rotating refresh tokens, secret sealing."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[dependencies]
tankovault-domain = { workspace = true }
# Every credential this crate takes or returns is a `secrecy` wrapper rather than a `String`:
# the signing key, the pepper, the plaintext password, the minted access token and the raw
# refresh token. That is what makes `expose_secret()` the grep that answers "where does the
# pepper leave its wrapper" — see the rationale block in the workspace manifest.
secrecy = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
# RFC 6238 TOTP: HMAC-SHA1 over the time step, base32 for the secret the user's authenticator
# app reads, and a constant-time compare of the resulting digits. SHA-1 is the algorithm every
# authenticator implements and the only one the `otpauth://` URI's consumers can be assumed to
# support; it is used here as an HMAC, where the collision weaknesses that retired it for
# signatures do not apply.
hmac = { workspace = true }
sha1 = { workspace = true }
data-encoding = { workspace = true }
percent-encoding = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Only the token test that decodes a JWT payload to assert no authorization claim leaked
# into it needs to inspect raw JSON; the crate itself never parses arbitrary JSON.
serde_json = { workspace = true }

[lints]
workspace = true
