name: Security

# Static analysis of the workflows themselves: the one body of code with write access to the
# repository that nothing else reads. Catches unpinned actions, over-broad `permissions`,
# credentials persisted into `.git/config`, and `${{ }}` interpolated into a `run:` block, which is
# a shell injection, not a template.
#
# `pedantic` on purpose: the default persona reports only what is provably exploitable today,
# pedantic reports the shape that becomes exploitable after one careless edit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, alongside CI's full run: zizmor's audit set grows between releases.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Nothing granted at the workflow level; every job asks for what it needs and no more.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the workflows
      security-events: write # to upload the SARIF findings to code scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: TimSchoenle/actions/actions/security/zizmor@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-security-zizmor-v2.0.0
