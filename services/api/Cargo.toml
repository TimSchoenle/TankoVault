[package]
name = "tankovault-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Axum HTTP edge: public read/write + admin, auth, resolved links, SSE."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
tankovault-config = { workspace = true }
tankovault-service = { workspace = true, features = ["db", "redis"] }
tankovault-db = { workspace = true }
# `dns` supplies `ssrf::validate_and_resolve`, which `admin/providers.rs` needs before it
# stores an operator-supplied `base_url` (SEC-5). It used to come from `tankovault-fetch` —
# and `tankovault-adapters`, `tankovault-fetch` and `tankovault-solver` are all *gone* from
# this manifest as of PERF-18, because they pulled `wreq`/BoringSSL into a binary that already
# links `rustls` through `reqwest` and `sqlx`. The one endpoint that needed them, the adapter
# dry-run, is proxied to `services/worker` now. Do not re-add them: check
# `cargo tree -p tankovault-api -i boring-sys2` before adding any dependency here.
tankovault-domain = { workspace = true, features = ["dns"] }
tankovault-auth = { workspace = true }
# Passwords, reset tokens, the JWT key and the pepper are all `secrecy` wrappers here, and the
# request DTOs that carry them are too — a handler that logs `?req` must not be able to print
# the password it just received.
secrecy = { workspace = true }
# The WebAuthn relying party. Deliberately *not* in `crates/auth` alongside argon2 and the JWT
# mint, even though it is the same kind of primitive: that crate is also a dependency of
# `services/sync`, `xtask` and the fuzz targets, none of which will ever verify a passkey, and
# an auth crate is exactly where a heavy dependency spreads to every binary unnoticed. This
# service is the only relying party there is.
webauthn-rs = { workspace = true }
tankovault-email = { workspace = true }
tankovault-matcher = { workspace = true }
tankovault-bus = { workspace = true }
tankovault-contracts = { workspace = true }
axum = { workspace = true }
tokio-stream = { workspace = true }
# `StreamExt::take_until`, which bounds the SSE stream by the access token's expiry.
# tokio-stream's StreamExt has no equivalent.
futures = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true }
metrics = { workspace = true }
uuid = { workspace = true }
# The watchlist's keyset cursor is an opaque token, so the sort key and id it carries are
# base64url-encoded rather than spelled in the query string. Already in the lock file via
# `crates/auth`; this adds no new dependency to the tree.
base64 = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }
fred = { workspace = true }
tokio-util = { workspace = true }
# `crate::stream_tickets::StreamTicketStore` is held as `Arc<dyn …>` in `AppState`, and its two
# methods are `async`. Native async fns in traits are not dyn compatible, so the seam needs this
# — the same reason `tankovault_service::ratelimit::RateLimitStore` uses it.
async-trait = { workspace = true }

[features]
# Opt-in: the HTTP integration suites need Docker (an ephemeral Postgres via the harness). Off
# by default so `cargo test -p tankovault-api` stays fast and DB-free.
integration = []

[dev-dependencies]
# The in-process router harness. Split out of `crates/test-support` (ARCH-17) so that the
# repository-layer suites no longer compile this service to run SQL tests.
tankovault-api-test-support = { path = "test-support" }
tankovault-test-support = { path = "../../crates/test-support" }

[lints]
workspace = true
