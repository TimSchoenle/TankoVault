# Prometheus scrape configuration for the TankoVault reference stack. Every service exposes
# metrics on an isolated listener (TANKOVAULT_METRICS__LISTEN, default 0.0.0.0:9090), so every
# target below is `<service>:9090` regardless of the service's own HTTP port. `job` is the only
# label naming which process a series came from — do not collapse jobs into one target list, or
# every rule in the alert/recording files loses its subject.

global:
  # 15s keeps rate(...[5m]) comfortably over-sampled (20 points) for this low-cardinality stack.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: tankovault

rule_files:
  - /etc/prometheus/rules/*.rules.yml

# Deliberately no Alertmanager: rules fire and are visible on Prometheus' own Alerts page and the
# dashboard's "Firing alerts" panel. Wiring one (no receiver this repo can ground) is a deployment
# decision:
#
#   alerting:
#     alertmanagers:
#       - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  # Prometheus' own metrics: up, rule-evaluation failures, TSDB health.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # static_configs, not DNS discovery: a static target that stops answering keeps its series and
  # reports up==0, which is alertable. A DNS-discovered target disappears when the container dies,
  # and an alert on a vanished series never fires. Reversed for `worker` below.
  - job_name: api
    static_configs:
      - targets: ["api:9090"]

  - job_name: control-plane
    static_configs:
      - targets: ["control-plane:9090"]

  - job_name: notifier
    static_configs:
      - targets: ["notifier:9090"]

  - job_name: sync
    static_configs:
      - targets: ["sync:9090"]

  - job_name: challenge-solver
    static_configs:
      - targets: ["challenge-solver:9090"]

  - job_name: render
    static_configs:
      - targets: ["render:9090"]

  - job_name: frontend
    static_configs:
      - targets: ["frontend:9090"]

  # DNS discovery, because `worker` is the only multi-replica tier (deploy.replicas: 2): a static
  # target would resolve to whichever replica DNS returned, interleaving two processes' counters
  # under one `instance` and making every replica switch look like a counter reset. The cost: a
  # dead worker vanishes rather than reporting up==0 — TankoVaultWorkerFleetIncomplete and
  # TankoVaultWorkerTargetsAbsent cover that gap.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
        refresh_interval: 30s

  # The only source of JetStream queue depth: scan_tasks_served_total counts tasks handed out, not
  # pending, so a wedged pipeline looks like an empty one from the worker's side. -jsz=all (on
  # nats-exporter) is what produces the per-consumer series the relabelling below depends on.
  #
  # Nine cluster-topology labels (server_id, leader flags, etc.) are dropped: constant on this
  # single-node stack and would multiply every series by a churning server_name across restarts.
  # Worker consumer names are `tankovault-workers-<mode>-<slug>`
  # (tankovault_contracts::subjects::worker_consumer); the two regex rules below split that back
  # into the same provider/scan dimensions scan_tasks_served_total uses. If that naming scheme
  # changes, these two rules go stale silently — the queue-depth panels going blank is the symptom.
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
    metric_relabel_configs:
      - action: labeldrop
        regex: (server_id|server_name|stream_leader|meta_leader|consumer_leader|stream_raft_group|cluster|domain|account_id|consumer_desc|is_meta_leader|is_stream_leader|is_consumer_leader)
      - source_labels: [consumer_name]
        regex: tankovault-workers-(full|fast)-(.+)
        target_label: scan
        replacement: ${1}
      - source_labels: [consumer_name]
        regex: tankovault-workers-(full|fast)-(.+)
        target_label: provider
        replacement: ${2}

  # GET /ready answers 200/503 with a JSON body, which Prometheus can't scrape as exposition —
  # blackbox_exporter turns the HTTP status into probe_success. This is the only way DB-pool
  # exhaustion, a Postgres outage or an unreachable NATS becomes alertable (docs/OBSERVABILITY.md,
  # "What is not measured"). /ready is mounted outside HttpStack, so no X-Internal-Token here.
  - job_name: readiness
    metrics_path: /probe
    params:
      module: [tankovault_ready]
    static_configs:
      - targets: ["http://api:8080/ready"]
        labels: { service: api }
      - targets: ["http://control-plane:8081/ready"]
        labels: { service: control-plane }
      - targets: ["http://notifier:8082/ready"]
        labels: { service: notifier }
      - targets: ["http://sync:8083/ready"]
        labels: { service: sync }
      - targets: ["http://render:8084/ready"]
        labels: { service: render }
      # Round-robin DNS picks one of the two replicas per probe; accepted because the dependencies
      # probed (Postgres, NATS) are shared, so both replicas answer alike. A single wedged replica
      # is TankoVaultWorkerFleetIncomplete's job instead.
      - targets: ["http://worker:8085/ready"]
        labels: { service: worker }
      - targets: ["http://challenge-solver:8090/ready"]
        labels: { service: challenge-solver }
      - targets: ["http://frontend:3000/ready"]
        labels: { service: frontend }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: probe_url
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The prober's own health: without this, probe_success going absent because the prober died is
  # indistinguishable from every service being fine.
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
