# blackbox_exporter module for /ready. `timeout: 3s` sits just above health.rs's 2s
# per-dependency bound, so it distinguishes "503, dependency down" from "no answer at all" — two
# different pages. `follow_redirects: false`: /ready never redirects, so following one would let a
# misconfiguration probe some other endpoint's health instead.

modules:
  tankovault_ready:
    prober: http
    timeout: 3s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
