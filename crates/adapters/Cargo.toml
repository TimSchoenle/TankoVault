[package]
name = "tankovault-adapters"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "SourceAdapter trait and config-driven (Madara/generic) provider adapters."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[dependencies]
tankovault-domain = { workspace = true }
tankovault-fetch = { workspace = true }
tankovault-solver = { workspace = true }
async-trait = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
# `spawn_blocking`: HTML parsing is uninterruptible CPU (html5ever tokenise + tree-build) and
# must not run on a Tokio worker thread, where it stalls every other task on the runtime.
tokio = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
