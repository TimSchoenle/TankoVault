name: CodeQL

# Advanced setup in place of CodeQL default setup. Default setup reads exclusions only from the
# `github-codeql-config-file` repository property, which a personal-account repository cannot
# set, so test fixtures and assertion messages raised alerts as if they were production code.
# The shared action runs with `build-mode: none` and excludes the standard test locations; its
# README lists them.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # to check out the code
      security-events: write # to upload the SARIF findings to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CodeQL
        uses: TimSchoenle/actions/actions/security/codeql@f33849da61e2397d3a9277762d09a1bf0d2b9d7c # tag=actions-security-codeql-v1.1.2
        with:
          language: ${{ matrix.language }}
          paths-ignore: |
            # Integration-test support crate; its fixtures seal with a fixed key.
            services/api/test-support/**
