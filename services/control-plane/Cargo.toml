[package]
name = "tankovault-control-plane"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Scheduler + planner + orchestrator: expands runs into tasks and dispatches them."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

# A library as well as a binary, so the model builder can be driven by an integration test.
# Without it the only entry point is a `main` that also wants Redis, NATS and an HTTP listener,
# and the one stage worth testing end to end — a real build against a real catalogue — would
# have no way in.
[lib]
name = "tankovault_control_plane"
path = "src/lib.rs"

[[bin]]
name = "control-plane"
path = "src/main.rs"

[dependencies]
tankovault-config = { workspace = true }
# Redis/NATS URLs arrive from config as `SecretString`.
secrecy = { workspace = true }
tankovault-service = { workspace = true, features = ["db"] }
tokio-util = { workspace = true }
tankovault-db = { workspace = true }
tankovault-recsys = { workspace = true }
tankovault-domain = { workspace = true }
tankovault-bus = { workspace = true }
tankovault-contracts = { workspace = true }
tankovault-matcher = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
time = { workspace = true }
futures = { workspace = true }
fred = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tankovault-test-support = { path = "../../crates/test-support" }
tankovault-config = { workspace = true }

[features]
# Opt-in: the model-build suite needs Docker.
integration = []

[lints]
workspace = true
