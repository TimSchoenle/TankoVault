name: BoringSSL build dependencies
description: >-
  Installs the C/C++ toolchain `wreq` needs to compile BoringSSL from source, skipping the work
  when the runner image already ships it and bounding every apt call so a stalled mirror fails
  fast instead of eating the job's timeout.

# Nine jobs across `ci.yml` and `auto-fix.yaml` need these three packages. One owned step is
# what bounds the install: a copy per job would leave each one to hang on a stalled apt mirror
# until the job's 60-minute timeout, where the step normally costs 11–20s.
#
# Two things follow, and both belong here, not at the call sites:
#
#   - `timeout` wraps `apt-get`, not the step. A composite action's steps cannot declare
#     `timeout-minutes`, but bounding the command is the better shape anyway: it names the thing
#     that hangs, and `sudo timeout`, not `timeout sudo`, so the signal reaches `apt-get` itself
#     instead of dying at the privilege boundary.
#   - A stall is transient, so it is retried, not fatal. These jobs commit and gate; one that
#     fails on a mirror hiccup costs a human a re-run for no defect.

runs:
  using: composite
  steps:
    - name: cmake, nasm and libclang-dev
      shell: bash
      run: |
        set -euo pipefail

        # `dpkg-query`, not `dpkg -s`: the latter also succeeds for a package that has been
        # removed but kept its config files, and a false "already installed" here fails the
        # BoringSSL build later, somewhere that reads nothing like this step.
        missing=""
        for pkg in cmake nasm libclang-dev; do
          dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null | grep -qx installed \
            || missing="$missing $pkg"
        done

        if [ -z "$missing" ]; then
          echo "cmake, nasm and libclang-dev are already installed."
          exit 0
        fi

        # A stall and a slow mirror need different limits. `Acquire::http::Timeout` fails a fetch
        # that receives nothing for 30s, and `Acquire::Retries` refetches it, so a stall is caught
        # per file within seconds. The wall-clock cap is only the backstop, and it is one deadline
        # shared by every call and attempt, not a cap per attempt: a mirror serving 50-150 KB/s
        # would make a 360s cap per attempt kill attempt after attempt still fetching the same
        # 28.8 MB package. A slow download that is progressing gets the whole budget; a fast
        # failure is retried inside it. 18 minutes keeps a stalled install well under the job
        # timeout.
        #
        # Only network work runs under the cap. Killing `apt-get install` mid-unpack leaves dpkg
        # interrupted and every later attempt fails at once ("dpkg was interrupted").
        deadline=$((SECONDS + 1080))
        apt_bounded() {
          for attempt in 1 2 3; do
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            if sudo timeout "$remaining" apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 "$@"; then
              return 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::apt-get $1 failed (attempt ${attempt}/3); retrying"
              sleep $((attempt * 5))
            fi
          done
          echo "::error::apt-get $1 did not complete within the 18-minute apt budget"
          return 1
        }

        apt_bounded update
        # shellcheck disable=SC2086 # deliberate word splitting: `missing` is a package list.
        apt_bounded install -y --no-install-recommends --download-only $missing
        # shellcheck disable=SC2086 # as above.
        sudo apt-get install -y --no-install-recommends --no-download $missing
