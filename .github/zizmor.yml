# zizmor configuration — read by the `zizmor` job in `.github/workflows/security.yml`.
#
# Two suppressions, both about `dtolnay/rust-toolchain`. Everything else runs at the `pedantic`
# persona with no severity floor: a finding not listed here fails the job.

rules:
  # Declined, not worked around. The toolchain version is a job input read from
  # `rust-toolchain.toml` by the `changes` job, so the number has one home; replacing the action
  # would re-derive `default`, `component add` and `target add` in shell across eight jobs. It also
  # sets `RUSTUP_TOOLCHAIN` and logs the resolved version, which is what makes "which compiler ran
  # this" answerable afterwards.
  superfluous-actions:
    ignore:
      - ci.yml
      # Same action, same argument; shares `ci.yml`'s pin so there is one number to review.
      - update-lockfile.yaml
      # Same again, and here the pinned toolchain is load-bearing rather than incidental: that
      # job runs `clippy --fix` and formats the generated client, so the clippy and rustfmt it
      # uses must be the ones `fmt + clippy` will then judge the result with.
      - auto-fix.yaml

  # Pinned to a `master` commit deliberately: the only release tag, `v1`, has not moved since
  # 2025-08 and predates the toolchains this workspace builds with. Still an immutable pin, and
  # `renovate.json` disables automatic updates so a bump is a decision.
  stale-action-refs:
    ignore:
      - ci.yml
      - update-lockfile.yaml
      - auto-fix.yaml
