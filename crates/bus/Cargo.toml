[package]
name = "tankovault-bus"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "NATS JetStream connection, stream provisioning, publish and consume helpers."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[dependencies]
tankovault-contracts = { workspace = true }
# `ResolvedTls` only: the same certificate paths the HTTP tier uses, so the broker connection
# and the service mesh cannot end up trusting different authorities.
tankovault-config = { workspace = true }
async-nats = { workspace = true }
# `Bus::connect` takes the NATS URL as a `SecretString`: `nats://user:pass@host` is a
# supported form, so the URL is a credential even when a given deployment leaves it bare.
secrecy = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
# `CancellationToken` in the shared `consume` loop's shutdown arm.
tokio-util = { workspace = true }
thiserror = { workspace = true }
# Handler error type for the shared `consume` loop: the loop only logs and decides retry vs
# settle, so it deliberately does not constrain what a handler's failures are.
anyhow = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
