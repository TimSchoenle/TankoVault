[package]
name = "tankovault-worker"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Scan worker: executes tasks via adapters + fetch stack, upserts deltas idempotently."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[[bin]]
name = "worker"
path = "src/main.rs"

[lib]
name = "tankovault_worker"
path = "src/lib.rs"

[dependencies]
tankovault-config = { workspace = true }
# The `Describe` derive on this service's own config root, beside the blocks
# `tankovault-config` describes. `config-contract` walks the root to build the document
# this image publishes, so a local block that skipped the derive would be a key the
# contract claims the binary does not read.
terrace-config = { workspace = true, features = ["schema"] }
tankovault-service = { workspace = true, features = ["db"] }
tokio-util = { workspace = true }
axum = { workspace = true }
tankovault-domain = { workspace = true }
tankovault-db = { workspace = true }
tankovault-adapters = { workspace = true }
tankovault-fetch = { workspace = true }
# The internal-tier token handed to the solver client.
tankovault-solver = { workspace = true }
tankovault-bus = { workspace = true }
tankovault-contracts = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
