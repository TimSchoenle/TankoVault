[package]
name = "tankovault-fetch"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The provider fetch stack: SSRF guard, browser emulation, rate limiting, solving, retry."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[dependencies]
# `dns` supplies the resolving half of the SSRF guard, which this crate re-exports from
# `ssrf.rs` — the policy lives in `domain` so a service can apply it without linking wreq.
tankovault-domain = { workspace = true, features = ["dns"] }
tankovault-solver = { workspace = true }
# `ClientMaterial` only: the PEM bytes the mTLS solver client presents. The crawl stack
# otherwise stays independent of the service runtime.
tankovault-service = { workspace = true }
# The internal-tier token the solver client presents on every outbound call.
secrecy = { workspace = true }
async-trait = { workspace = true }
wreq = { workspace = true }
wreq-util = { workspace = true }
url = { workspace = true }
governor = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The crawl tier is the one place a provider's behaviour towards us is observable, and it sits
# below `tankovault-service` — so it records against the `metrics` facade directly. Names are
# literals here for that reason, and `xtask repo-lint` holds them to the catalogue.
metrics = { workspace = true }
time = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# A scriptable upstream for `HttpChallengeSolver`, which had no test below the `ChallengeSolver`
# trait at all (TEST F-09).
wiremock = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
