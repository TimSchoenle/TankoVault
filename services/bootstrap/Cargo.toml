[package]
name = "tankovault-bootstrap"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "One-shot installation steps: apply migrations, provision the first administrator, install the built-in provider presets."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[lib]
name = "tankovault_bootstrap"
path = "src/lib.rs"

[dependencies]
tankovault-config = { workspace = true }
# The `Describe` derive on this service's own config root, beside the blocks
# `tankovault-config` describes. `config-contract` walks the root to build the document
# this image publishes, so a local block that skipped the derive would be a key the
# contract claims the binary does not read.
terrace-config = { workspace = true, features = ["schema"] }
# For `install_crypto_provider` alone — this CLI serves nothing. It still opens a `sqlx` pool,
# and a Postgres that requires TLS makes sqlx build a rustls client config, which is the call
# that panics without a process-wide provider. Naming the shared runtime keeps one spelling of
# that invariant across all nine binaries rather than a second copy here.
tankovault-service = { workspace = true }
tankovault-db = { workspace = true }
tankovault-domain = { workspace = true }
# The admin step hashes a password; `connect` and the seed both take wrapped secrets.
tankovault-auth = { workspace = true }
secrecy = { workspace = true }
tankovault-adapters = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
# The preset reconcile compares `providers.config` against the shipped definition.
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
