# zizmor configuration — read by the `zizmor` job in `.github/workflows/security.yml`.
#
# Two suppressions, both about the same action, both argued rather than asserted. Everything
# else runs at the `pedantic` persona with no severity floor: a finding that is not listed here
# fails the job.

rules:
  # `superfluous-actions` says `dtolnay/rust-toolchain` does nothing `rustup` in a script step
  # could not. That is true of the *installation* and false of everything around it here:
  #
  #   * The toolchain version is a job input, not a literal — `${{ needs.changes.outputs.toolchain }}`,
  #     read out of `rust-toolchain.toml` by the `changes` job so this repository keeps one home
  #     for that number (OPS-4.1). A hand-written `rustup toolchain install` step would have to
  #     re-derive `default`, `component add` and `target add` in shell, in eight jobs.
  #   * The action sets `RUSTUP_TOOLCHAIN` and reports the resolved version into the job log,
  #     which is what makes "which compiler did this run use" answerable after the fact.
  #
  # Replacing it with a script is a net loss in exactly the dimension this repository cares
  # about, so the finding is declined rather than worked around.
  superfluous-actions:
    ignore:
      - ci.yml

  # `stale-action-refs` flags a pinned SHA that no tag points at. `dtolnay/rust-toolchain` is
  # pinned to a `master` commit deliberately: its only release tag, `v1`, has not moved since
  # 2025-08 and predates the toolchain releases this workspace builds with, while `master` is
  # where the action is actually maintained. The pin is still a pin — an immutable commit,
  # reviewed when it changes — and `renovate.json` disables automatic updates for it so a bump
  # is a decision rather than a Tuesday.
  stale-action-refs:
    ignore:
      - ci.yml
