# Full end-to-end local stack (design §19): Postgres + Redis + NATS(JetStream) +
# FlareSolverr, a one-shot migrate/seed step, every TankoVault backend service, and the Dioxus
# web frontend. Backend images are built from the single parameterised deploy/docker/Dockerfile;
# the frontend from deploy/docker/Dockerfile.frontend (build context = repo root for both).
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Then open the app at http://localhost:3000 (the frontend server serves the SPA and proxies
# /v1/* to api).
#
# Secrets here are DEV-ONLY placeholders and are refused at boot when
# TANKOVAULT_PROFILE=production. Copy deploy/local.env.example to deploy/local.env, fill it
# in, and pass `--env-file deploy/local.env` before any non-local use.
#
# ---- Exposure ----------------------------------------------------------------------------
# **Only `frontend` (3000) is published on the host.** Everything else talks over the compose
# network by service name. This is not tidiness: `sync`, `control-plane`, `render` and
# `challenge-solver` expose privileged, formerly unauthenticated contracts, and Docker's port
# publishing bypasses the host firewall via DOCKER-USER/iptables — so `ports:` on any of them
# put "read or rewrite any user's sync state" and "fetch any URL and return the body" on every
# interface the host has. Postgres and Redis carry documented default credentials.
#
# To debug one of them, bind loopback explicitly and temporarily:
#     ports: ["127.0.0.1:8083:8083"]
#
# Defence in depth on top of placement: every internal service requires
# TANKOVAULT_INTERNAL__TOKEN (see x-internal below). Port hygiene alone is one
# misconfiguration away from failing.
name: tankovault

x-build: &build
  context: ..
  dockerfile: deploy/docker/Dockerfile

x-telemetry: &telemetry
  TANKOVAULT_TELEMETRY__JSON_LOGS: "true"
  TANKOVAULT_TELEMETRY__LOG_FILTER: "info,tankovault=debug"

# Shared secret for service-to-service calls, identical on every service in the internal
# tier. The dev fallback is a visible placeholder; production refuses to boot without a real
# one. Generate with `openssl rand -hex 32`.
x-internal: &internal
  TANKOVAULT_INTERNAL__TOKEN: "${TANKOVAULT_INTERNAL__TOKEN:-dev-internal-token-not-for-production-use}"

x-db-url: &db-url "postgres://tankovault:tankovault@postgres:5432/tankovault"

# ---- Container healthcheck for the scratch services ----------------------------------------
# These images have no shell, no `wget` and no `curl`, so a `CMD-SHELL` probe is impossible —
# which is why the eight app services carried no healthcheck at all and `depends_on` could only
# ever say `service_started`. The one executable that is always present is the service binary,
# so it probes itself: `--healthcheck` is an argv branch handled at the top of every `main`
# before config or telemetry (`crates/service/src/healthcheck.rs`).
#
# The probe is a TCP connect to the service's *own* `bind_addr`, read from the same config the
# server binds — so a rebind (the worker's `TANKOVAULT_BIND_ADDR: 0.0.0.0:8085`, say) is
# followed automatically and nothing here names a port. It is liveness, not readiness:
# "the listener is accepting" is what should trigger a restart, while "Postgres is reachable"
# is a routing decision that `/ready` already answers over HTTP.
#
# `timeout: 3s` sits just above the probe's own 2s connect timeout, so the process exits with
# a verdict rather than being killed without one.
x-healthcheck: &healthcheck
  test: ["CMD", "/usr/local/bin/tankovault-service", "--healthcheck"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

# ---- Runtime hardening for the scratch services --------------------------------------------
# The images are already `scratch` + non-root, so the marginal gain is small — but all three of
# these are free here and remove whole classes of escalation.
#
# `read_only` is safe by construction rather than by inspection: a `scratch` image *is* four
# baked-in files (the binary, the musl loader, `libgcc_s`, the CA bundle) and nothing else, so
# there is no writable path for a service to have quietly depended on. Not applied to `render`
# — see the note there.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # ---- Infrastructure ---------------------------------------------------------------
  postgres:
    # Pinned to a stable major. This was `19beta2-alpine`: the 187-entry `.sqlx` offline
    # cache and every migration are validated against whatever runs here, so a beta catalog
    # meant CI was type-checking queries against a moving target.
    image: postgres:17-alpine
    deploy: { resources: { limits: { memory: 1g } } }
    environment:
      POSTGRES_USER: tankovault
      POSTGRES_PASSWORD: tankovault
      POSTGRES_DB: tankovault
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tankovault -d tankovault"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    deploy: { resources: { limits: { memory: 256m } } }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2-alpine
    deploy: { resources: { limits: { memory: 512m } } }
    command: ["-js", "-m", "8222"] # JetStream + HTTP monitoring (for the healthcheck)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  flaresolverr:
    # Pinned: `latest` silently changes the bot-management behaviour the adapters are tuned
    # against, and an unpinned image is an unreviewed code change on every `docker compose pull`.
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    environment:
      LOG_LEVEL: info
    shm_size: 1gb
    deploy: { resources: { limits: { memory: 2g } } }

  # ---- Schema migrations + demo seed (runs once, then exits) -------------------------
  migrate:
    build:
      <<: *build
      args: { BIN: xtask }
    command: ["migrate"]
    # One-shot: it runs, exits 0 and is gated on by `service_completed_successfully`, so a
    # healthcheck would have nothing to report. Hardening still applies.
    <<: *hardening
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  seed:
    build:
      <<: *build
      args: { BIN: xtask }
    command: ["seed"]
    <<: *hardening
    environment:
      DATABASE_URL: *db-url
      # Required: `changeme12345` is published here, so it is not a password.
      TANKOVAULT_SEED_ADMIN_PASSWORD: "${TANKOVAULT_SEED_ADMIN_PASSWORD:?set it in deploy/local.env — see deploy/local.env.example}"
      TANKOVAULT_AUTH__PASSWORD_PEPPER: "${TANKOVAULT_AUTH__PASSWORD_PEPPER:-}"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # ---- Services ---------------------------------------------------------------------
  api:
    deploy: { resources: { limits: { memory: 768m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: api }
    environment:
      <<: [*telemetry, *internal]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: api
      TANKOVAULT_DATABASE__URL: *db-url
      # Required, with no fallback: the previous default `dev-jwt-secret-change-me` is
      # published in this repository, so every session signed with it is forgeable by anyone
      # who has read this file. `validate_auth_secrets` now refuses it in every profile, not
      # only production, so a working default here would only move the failure later.
      TANKOVAULT_AUTH__JWT_SECRET: "${TANKOVAULT_AUTH__JWT_SECRET:?set it in deploy/local.env — see deploy/local.env.example; generate with `openssl rand -hex 32`}"
      # Refresh cookies are Secure by default now. Kept off here because this stack is plain
      # HTTP on localhost, where a Secure cookie is simply never sent. Do not copy this line
      # into a deployment that terminates TLS.
      TANKOVAULT_AUTH__COOKIE_SECURE: "false"
      TANKOVAULT_AUTH__PASSWORD_PEPPER: "${TANKOVAULT_AUTH__PASSWORD_PEPPER:-}"
      TANKOVAULT_CONTROL_PLANE_URL: http://control-plane:8081
      TANKOVAULT_SYNC_URL: http://sync:8083
      TANKOVAULT_NATS__URL: nats://nats:4222 # live per-user notification SSE relay (/v1/me/stream)
      # ---- Transactional email (welcome on sign-up, password reset) -------------------
      # Optional: when unset, the API uses a no-op mailer (logs + drops) and these flows
      # simply skip sending. `base_url` is the public web origin used to build reset links.
      TANKOVAULT_EMAIL__BASE_URL: http://localhost:3000
      # Example: OVH-hosted Exchange over STARTTLS on 587 (or use security=tls + port 465
      # with host ssl0.ovh.net). `username` is the full mailbox address.
      TANKOVAULT_EMAIL__HOST: "${TANKOVAULT_EMAIL__HOST:-pro3.mail.ovh.net}"
      TANKOVAULT_EMAIL__PORT:  "${TANKOVAULT_EMAIL__PORT:-587}"
      TANKOVAULT_EMAIL__SECURITY: "${TANKOVAULT_EMAIL__SECURITY:-starttls}"
      TANKOVAULT_EMAIL__USERNAME: "${TANKOVAULT_EMAIL__USERNAME:-no-reply@your-domain.com}"
      TANKOVAULT_EMAIL__PASSWORD: "${TANKOVAULT_EMAIL__PASSWORD:-}"
      TANKOVAULT_EMAIL__FROM:  "${TANKOVAULT_EMAIL__FROM:-TankoVault <no-reply@your-domain.com>}"
      # The SMTP envelope sender (MAIL FROM) defaults to `username` above, which is what OVH
      # Exchange authorises "send as" against — so `from` may differ from the login without
      # tripping `550 5.7.60`. Override only if bounces must go to a different mailbox:
      TANKOVAULT_EMAIL__ENVELOPE_FROM: "${TANKOVAULT_EMAIL__ENVELOPE_FROM:-}"
      # Alternatively point at any relay with a single lettre URL (takes precedence):
      # TANKOVAULT_EMAIL__URL: smtps://no-reply%40your-domain.com:change-me@ssl0.ovh.net:465
      #
      # ---- Rate limiting ---------------------------------------------------------------
      # Redis lets the limit hold across replicas instead of being multiplied by their
      # count. Without it the limiter silently falls back to per-replica counters.
      TANKOVAULT_REDIS__URL: redis://redis:6379
      TANKOVAULT_RATE_LIMIT__BACKEND: redis
      # The frontend server fronts the API here and *appends* the peer address to
      # X-Forwarded-For (nginx's $proxy_add_x_forwarded_for convention); the limiter reads the
      # right-most entry, which is therefore the one our own proxy wrote. Everything to its
      # left is client-supplied and ignored.
      #
      # Do NOT enable this where the API is reachable without going through that proxy — the
      # right-most entry would then be attacker-chosen too. The API no longer publishes a
      # host port, which is what makes this safe in this file.
      TANKOVAULT_RATE_LIMIT__TRUST_FORWARDED_FOR: "true"
      #
      # ---- Security --------------------------------------------------------------------
      # The frontend is served from the same origin as the proxied API, so no cross-origin hop
      # exists and the CORS allowlist stays empty (same-origin only). A split-origin deployment
      # must name its origins:
      # TANKOVAULT_SECURITY__CORS__ALLOWED_ORIGINS: '["https://app.example.com"]'
      # Enable once the edge actually terminates TLS; over plain HTTP it is misleading.
      TANKOVAULT_SECURITY__HSTS: "false"
      #
      # ---- Audit + privacy -------------------------------------------------------------
      # IP and User-Agent are personal data (GDPR Art. 4(1)), so retaining them is an
      # explicit opt-in rather than a default.
      TANKOVAULT_AUDIT__RECORD_IP: "false"
      TANKOVAULT_AUDIT__RECORD_USER_AGENT: "false"
      TANKOVAULT_AUDIT__RETENTION_DAYS: "365"
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  control-plane:
    deploy: { resources: { limits: { memory: 512m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: control-plane }
    environment:
      <<: [*telemetry, *internal]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: control-plane
      TANKOVAULT_DATABASE__URL: *db-url
      TANKOVAULT_NATS__URL: nats://nats:4222
      TANKOVAULT_REDIS__URL: redis://redis:6379 # singleton-scheduler leader election (design §12)
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    # The probe reads the same `bind_addr` the server binds, so it follows the ops listener
    # rebound below to 8085 with nothing here naming a port — which also means it works
    # unchanged across both replicas, neither of which publishes a host port.
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: worker }
    environment:
      <<: [*telemetry, *internal]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: worker
      TANKOVAULT_DATABASE__URL: *db-url
      TANKOVAULT_NATS__URL: nats://nats:4222
      TANKOVAULT_WORKER__CHALLENGE_SOLVER_ENDPOINT: http://challenge-solver:8090
      # Ops listener (liveness/readiness) on 8085; the Prometheus scrape is served on the
      # isolated metrics port (TANKOVAULT_METRICS__LISTEN, default 0.0.0.0:9090). Neither is
      # published to the host: the worker runs 2 replicas and compose cannot map one host port
      # to both. Both are reachable on the compose network (`worker:8085`, `worker:9090`).
      TANKOVAULT_BIND_ADDR: 0.0.0.0:8085
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      # Was `service_started`. The worker's first scan can hit the solver immediately, so
      # "the process exists" was not the guarantee this dependency needed.
      challenge-solver: { condition: service_healthy }
    deploy:
      replicas: 2 # JetStream consumer group → free horizontal scale
      resources: { limits: { memory: 768m } }

  notifier:
    deploy: { resources: { limits: { memory: 384m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: notifier }
    environment:
      <<: *telemetry
      TANKOVAULT_TELEMETRY__SERVICE_NAME: notifier
      TANKOVAULT_DATABASE__URL: *db-url
      TANKOVAULT_NATS__URL: nats://nats:4222
      # The notifier's email channel shares the API's relay configuration rather than
      # carrying its own SMTP URL, so both send with the same envelope-sender policy — the
      # one relays that enforce "send as" actually accept. Name the recipients to enable it.
      TANKOVAULT_EMAIL__HOST: "${TANKOVAULT_EMAIL__HOST:-}"
      TANKOVAULT_EMAIL__PORT: "${TANKOVAULT_EMAIL__PORT:-587}"
      TANKOVAULT_EMAIL__SECURITY: "${TANKOVAULT_EMAIL__SECURITY:-starttls}"
      TANKOVAULT_EMAIL__USERNAME: "${TANKOVAULT_EMAIL__USERNAME:-}"
      TANKOVAULT_EMAIL__PASSWORD: "${TANKOVAULT_EMAIL__PASSWORD:-}"
      TANKOVAULT_EMAIL__FROM: "${TANKOVAULT_EMAIL__FROM:-}"
      # Comma-free JSON array, e.g. '["ops@example.com"]'. Empty disables the channel.
      TANKOVAULT_CHANNELS__EMAIL_TO: "${TANKOVAULT_NOTIFIER_EMAIL_TO:-[]}"
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  sync:
    deploy: { resources: { limits: { memory: 512m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: sync }
    environment:
      <<: [*telemetry, *internal]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: sync
      TANKOVAULT_DATABASE__URL: *db-url
      TANKOVAULT_ANILIST__CLIENT_ID: "${TANKOVAULT_ANILIST__CLIENT_ID:-}"
      TANKOVAULT_ANILIST__CLIENT_SECRET: "${TANKOVAULT_ANILIST__CLIENT_SECRET:-}"
      # OAuth returns the browser to the frontend origin, which proxies /v1/* to the api.
      # Must point at the frontend's callback route, not the API: the API's callback needs the
      # SPA's in-memory Bearer token, which a raw browser OAuth redirect cannot carry.
      TANKOVAULT_ANILIST__REDIRECT_URI: http://localhost:3000/account/anilist-callback
      # Required: this key seals every user's AniList access/refresh token at rest, and the
      # previous fallback was 32 zero bytes. `openssl rand -base64 32`.
      TANKOVAULT_ANILIST__TOKEN_ENCRYPTION_KEY: "${TANKOVAULT_ANILIST__TOKEN_ENCRYPTION_KEY:?set it in deploy/local.env — see deploy/local.env.example}"
    depends_on:
      migrate: { condition: service_completed_successfully }

  challenge-solver:
    deploy: { resources: { limits: { memory: 384m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: challenge-solver }
    environment:
      <<: [*telemetry, *internal]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: challenge-solver
      TANKOVAULT_SOLVER__FLARESOLVERR_ENDPOINT: http://flaresolverr:8191
    depends_on:
      flaresolverr: { condition: service_started }

  # Optional headless-render tier (design §9). Uses the Chromium-provisioned runtime
  # (the scratch image has no browser); doubles as a ChallengeSolver back-end on /v1/solve.
  render:
    deploy: { resources: { limits: { memory: 2g } } }
    shm_size: 1gb
    healthcheck: *healthcheck
    # `cap_drop` + `no-new-privileges` matter most on this tier: it is the only one running a
    # real browser against untrusted remote content, and Chromium here is already `--no-sandbox`
    # (no user namespaces in the container), so nothing it does needs a capability.
    #
    # `read_only: true` is deliberately NOT set, unlike the scratch services. Those are safe by
    # construction — the image has no writable path to depend on. This one is a full Debian base
    # under a browser that writes a profile, a cache and any number of scratch files whose paths
    # are not enumerable from here; guessing the tmpfs set wrong produces a silent crash loop on
    # the tier that is hardest to debug. Turn it on only after an empirical pass with
    # `--read-only` against a real render, and record the required mounts here when you do.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      <<: *build
      target: runtime-browser
      args: { BIN: render }
    environment:
      <<: [*telemetry, *internal]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: render
      # CHROME_PATH + NO_SANDBOX are baked into the runtime-browser image.

  # ---- Frontend (Dioxus WASM SPA served by the axum `frontend` server) ---------------
  # The `frontend` server serves the built SPA and reverse-proxies /v1/* (REST + SSE) to `api`,
  # giving the single origin the client's same-origin API calls (API_BASE = "") require. This is
  # the front door for the E2E stack: open http://localhost:3000.
  frontend:
    deploy: { resources: { limits: { memory: 256m } } }
    # Same self-probe as the backends, but this image's entrypoint has its own name
    # (deploy/docker/Dockerfile.frontend), so the anchor above cannot be reused verbatim.
    healthcheck:
      test: ["CMD", "/usr/local/bin/tankovault-frontend", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.frontend
    environment:
      <<: *telemetry
      TANKOVAULT_TELEMETRY__SERVICE_NAME: frontend
      # Same-origin front door: proxy /v1/* (REST + SSE) to the api service.
      TANKOVAULT_FRONTEND__API_UPSTREAM: http://api:8080
    ports: ["3000:3000"]
    depends_on:
      # Was `service_started`, which only means the API *process* exists — so every
      # `compose up` raced the frontend against an API that was not yet listening. The API's
      # healthcheck makes the ordering real.
      api: { condition: service_healthy }

volumes:
  pgdata:
