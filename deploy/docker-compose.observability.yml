# Observability overlay: Prometheus, Grafana and a blackbox prober for the readiness endpoints.
# Run alongside the main stack: docker compose -f deploy/docker-compose.yml
# -f deploy/docker-compose.observability.yml --env-file deploy/local.env up -d
# Grafana on http://127.0.0.1:3001, Prometheus on http://127.0.0.1:9091 — both loopback-bound.
#
# A separate overlay, not a compose profile, so the main file's "only frontend is published"
# invariant stays literally true of that file; an overlay can also amend existing services, which
# a profile cannot.
#
# Grafana and Prometheus are the only services here that publish a port. Both bind to `127.0.0.1`
# explicitly — publishing without a host part would bypass the host firewall via
# DOCKER-USER/iptables and expose Prometheus's unauthenticated PromQL endpoint to every interface.
# Grafana requires an admin password with no default, for the same reason the api refuses a
# placeholder JWT secret.

name: tankovault

# Third-party images, unlike the scratch services, so `read_only` is decided per service instead
# of being in this anchor — their writable paths aren't enumerable from this file.
x-obs-hardening: &obs-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  prometheus:
    # Pinned to the v3.5 LTS line, never `:latest`: a minor can change PromQL evaluation or
    # staleness handling and silently re-tune every alert rule.
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    <<: *obs-hardening
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Unauthenticated write endpoint (`curl -X POST .../-/reload`); another reason the
      # published port stays loopback-only.
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9091:9090"]
    deploy: { resources: { limits: { memory: 1g } } }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      blackbox-exporter: { condition: service_healthy }

  blackbox-exporter:
    # Probes GET /ready over HTTP: Prometheus can't scrape a JSON body directly, so without this
    # the only signal covering dependencies (Postgres, NATS, pool exhaustion) is invisible.
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    <<: *obs-hardening
    read_only: true
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    deploy: { resources: { limits: { memory: 128m } } }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats-exporter:
    # Only source of queue depth in the stack (scan_tasks_served_total counts tasks handed out,
    # not pending). `-jsz=all` produces the per-consumer series every backlog rule here depends on;
    # without it only server-level totals appear.
    image: natsio/prometheus-nats-exporter:0.20.1@sha256:4fbf6dacb84780a45a1c3af9b1080c69451a288d20902deae671b80717bb8f61
    <<: *obs-hardening
    read_only: true
    command: ["-port", "7777", "-varz", "-jsz=all", "http://nats:8222"]
    deploy: { resources: { limits: { memory: 128m } } }
    healthcheck:
      # Liveness only: /metrics returns 200 with zeroed series even when NATS is unreachable.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7777/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      nats: { condition: service_healthy }

  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    <<: *obs-hardening
    # `read_only` deliberately not set: a full Alpine base whose writable paths aren't enumerable
    # from here, and a wrong guess produces a crash loop. Enable only after an empirical pass.
    environment:
      # No default: the image's admin/admin is published in Grafana's own docs, so it isn't a
      # password.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set it in deploy/local.env — see deploy/local.env.example; generate with `openssl rand -hex 24`}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      # Anonymous access reaches Explore too — arbitrary PromQL against the whole TSDB.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No outbound calls: consistent with this stack's IP/User-Agent opt-in-only retention policy.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/tankovault-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    deploy: { resources: { limits: { memory: 512m } } }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus: { condition: service_healthy }

volumes:
  promdata:
  grafanadata:
