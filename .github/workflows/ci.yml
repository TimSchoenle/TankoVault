name: CI

# Design §19 (CI) / §21 (Definition of Done): fmt + clippy(-D warnings) +
# cargo-deny + cargo-audit + workspace tests + the wasm frontend check + a
# docker build of every service image.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The `tankovault-db` repositories use sqlx's compile-time-checked query macros. Every
  # ordinary build/lint/test job resolves them from the committed offline query cache
  # (`.sqlx/`) instead of a live database; the dedicated `sqlx` job below verifies that
  # cache is in sync with the real schema.
  SQLX_OFFLINE: "true"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No version here on purpose: `rust-toolchain.toml` pins it, and naming a version in
      # both places is how they drift apart. The action honours the file.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The provider fetch stack links BoringSSL (`wreq`), which its build script compiles
      # from C/C++ source. Installed explicitly rather than relying on whatever the hosted
      # runner image happens to ship.
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      - name: cargo test
        run: cargo test --workspace --all-targets
      # `--all-targets` silently EXCLUDES doc tests, so every `///` example in the workspace
      # was unverified. This is the run that compiles them.
      - name: doc tests
        run: cargo test --workspace --doc
      # Fails if a backend DTO changed without regenerating the OpenAPI artifacts
      # (services/api/src/openapi.rs -> xtask openapi -> openapi.json + the progenitor
      # crates/api-client client, consumed by the frontend via web/frontend/src/wire.rs). A
      # local pre-commit hook (installed automatically by xtask/build.rs, see
      # xtask/hooks/pre-commit) normally keeps this from ever drifting; this is the backstop
      # for commits made without it.
      - name: OpenAPI artifacts are up to date
        run: cargo run -p xtask -- openapi --check

  # Feature-combination legs. Every other job compiles the *one* feature set the services
  # happen to select, so `crates/service`'s `db` and `redis` features and `crates/domain`'s
  # `sqlx` feature had exactly one combination that was ever built — a `#[cfg(feature = ...)]`
  # that stopped compiling with a feature off, or a crate that only builds because a sibling
  # unified a feature onto it, would not have been caught anywhere.
  #
  # This is the feature axis of the audit's OPS-4.6. The other two axes are settled below and
  # here, rather than left open:
  #
  #   * **arch** — the `docker-arm64` job at the bottom of this file builds every image for
  #     `linux/arm64` on a *native* arm runner. It is opt-in behind a repository variable
  #     because those runners are free only on public repositories; the reasoning is written
  #     out there. QEMU emulation is not the fallback: the fetch stack compiles BoringSSL from
  #     C/C++/asm, which under emulation costs upwards of an hour per image.
  #   * **OS** — no Windows or macOS leg, deliberately and permanently. Nothing ships on
  #     either: every artifact is a musl binary in a `scratch` or Debian image. A Windows leg
  #     would cover the *development* platform, where a break is discovered by the developer
  #     within seconds of making it, at the cost of a BoringSSL toolchain (nasm + cmake) on
  #     every run. The Windows-specific hazards this project has actually hit are tooling
  #     hazards — PowerShell's cp1252 decoding of UTF-8 source, `Select-String` clearing `$?`
  #     after a native command — and no CI leg detects either. They are documented in
  #     `docs/audit/PROGRESS.md` instead.
  features:
    name: feature combinations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      # Libraries only. The services are binaries that require their features, so
      # `--no-default-features` across the workspace would fail for reasons that are not bugs;
      # the crates are where an unbuildable combination actually hides.
      - name: crates with no default features
        run: |
          cargo check --no-default-features \
            -p tankovault-domain -p tankovault-service -p tankovault-config \
            -p tankovault-contracts -p tankovault-fetch -p tankovault-solver \
            -p tankovault-matcher -p tankovault-auth -p tankovault-email
      - name: workspace with all features
        run: cargo check --workspace --all-targets --all-features

  # Verifies the committed sqlx offline query cache (`.sqlx/`) against a real, migrated
  # Postgres: `cargo sqlx prepare --check` recompiles every `query!`/`query_as!` macro
  # against the live schema and fails if the cache is stale (a query or migration changed
  # without running `cargo run -p xtask -- sqlx-prepare`). This is what keeps the SQL
  # compile-time-verified; every other job only consumes the cache offline.
  sqlx:
    name: sqlx offline cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tankovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Force live checking in this job: the whole point is to re-derive the query metadata
      # from the database, overriding the workflow-wide offline default.
      SQLX_OFFLINE: "false"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tankovault
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: apply migrations
        run: sqlx migrate run --source migrations
      - name: offline query cache is up to date
        run: cargo sqlx prepare --workspace --check

  # DB-backed and HTTP access-control integration suites. These stand up an ephemeral Postgres
  # via testcontainers (Docker is available on the GitHub-hosted runner), run the migrations,
  # and drive the real Axum router in-process — so authorization regressions fail CI here. The
  # suites are gated behind each crate's `integration` feature, which is why the fast offline
  # `test` job above never touches Docker and stays the default path.
  integration:
    name: integration (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      # SQLX_OFFLINE (inherited) resolves the query macros from the committed cache at compile
      # time; the container supplies the live database the tests run against at runtime.
      - name: repo + HTTP access-control + sync-reconciliation integration suites
        run: cargo test -p tankovault-db -p tankovault-api -p tankovault-sync --features integration

  # `web/frontend` is excluded from the host workspace (it targets wasm32), so none of the
  # jobs above touch it. This job ran `cargo check` alone, which meant its 41 tests and the
  # full `clippy::pedantic` set it declares in its own Cargo.toml executed nowhere at all —
  # quality machinery that was configured but never load-bearing.
  frontend:
    name: frontend (test + clippy + wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/frontend
      # Host target, not wasm32: these are pure logic tests (chapter part-grouping, the
      # notification classifier, the i18n catalogue-parity check) with no DOM dependency, so
      # they run without a browser. Anything needing a DOM would need wasm-bindgen-test.
      - name: cargo test (host)
        working-directory: web/frontend
        run: cargo test
      - name: clippy (pedantic, as declared by the crate)
        working-directory: web/frontend
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo check (wasm)
        working-directory: web/frontend
        run: cargo check --target wasm32-unknown-unknown

  # `assets/main.css` is Tailwind CLI output committed so a build without Node still works.
  # Nothing checked that the committed file matched what `input.css` currently produces, so a
  # class added to a component and used in `rsx!` could silently have no style behind it.
  css:
    name: tailwind output is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install the Tailwind CLI
        working-directory: web/frontend
        run: npm ci
      - name: rebuild and compare
        working-directory: web/frontend
        run: |
          npm run css:build
          if ! git diff --quiet -- assets/main.css; then
            echo "::error::assets/main.css is stale. Run 'npm run css:build' in web/frontend and commit the result."
            git diff --stat -- assets/main.css
            exit 1
          fi

  # The audit that produced docs/audit found a live AniList client secret and a live AES-256
  # data-encryption key committed in `deploy/local.env`. This job is what would have caught
  # them at the pull request, which is the only point at which the fix is cheap.
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in the tip commit is still a leaked secret.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # `rust-version = "1.85"` in the workspace manifest was a claim nothing verified. This job
  # makes it true or makes it fail. It deliberately builds with the *minimum* rather than the
  # pinned toolchain, so `rust-toolchain.toml` is overridden here on purpose.
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      # `--locked` so the check measures this lockfile's dependency set rather than whatever
      # a resolver picks today. `RUSTFLAGS` is cleared: `-D warnings` would fail the job on
      # lints an older compiler happens to emit, which is not what MSRV means.
      - name: cargo check
        env:
          RUSTFLAGS: ""
          RUSTUP_TOOLCHAIN: "1.85"
        run: cargo check --workspace --locked

  # Measurement only, with no threshold yet: the audit's finding is that coverage is unevenly
  # distributed (the 10 largest modules hold 11 tests across 9,600 LOC), and a number nobody
  # has seen is not something to gate on. Add a ratchet once there is a baseline to ratchet.
  coverage:
    name: coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --all-targets --summary-only

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `-D unnecessary-skip` makes the duplicate-version budget shrink *visibly*.
          # `[bans].skip` is `deny.toml`'s record of the duplicates that exist today, and
          # `multiple-versions = "deny"` already fails on a new one — but nothing noticed an
          # entry whose duplicate had since resolved upstream, so the list could only ever grow
          # and its dated comment could only ever drift (BUILD_AND_OPS §1.5). This turns
          # cargo-deny's `unnecessary-skip` warning into an error, so the pull request that
          # happens to collapse a duplicate is the one that deletes its skip line.
          command: check advisories licenses sources bans
          # `command-arguments`, not `arguments`: the action composes
          # `[arguments] [command] [command-arguments]`, and cargo-deny only accepts `-D`
          # after the subcommand.
          command-arguments: -D unnecessary-skip

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # `cargo-deny` and `cargo-audit` detect *vulnerable* dependencies. Neither notices a
  # dependency set that quietly changed: `Cargo.lock` is committed and the Docker builds pass
  # `--locked`, but nothing verified that a pull request's manifest edit came with the
  # corresponding lockfile update. A PR that bumps a version range without regenerating the
  # lockfile passes every other gate and then makes the image build a different resolution
  # from the one that was reviewed.
  supply-chain:
    name: lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
      # `--locked` makes cargo refuse to touch `Cargo.lock`; resolving metadata is what forces
      # it to notice that the lockfile does not satisfy the manifests. `--offline` so a
      # registry hiccup cannot turn this into a flake — the lockfile pins everything it needs.
      - name: Cargo.lock satisfies every manifest
        run: cargo metadata --locked --offline --format-version 1 > /dev/null
      # Same guarantee for the workspace-excluded WASM frontend, which has its own lockfile and
      # is therefore covered by none of the jobs above.
      - name: web/frontend Cargo.lock satisfies its manifest
        working-directory: web/frontend
        run: cargo metadata --locked --offline --format-version 1 > /dev/null

  # The observability layer is config, so nothing in the Rust gates above can tell when it stops
  # being valid — and a rule file that fails to parse takes its whole group with it, which means
  # every alert built on it is silently disarmed. Prometheus reports that on a page nobody visits
  # until an incident, i.e. exactly when the alerts were supposed to have already fired.
  #
  # `check rules` proves the PromQL parses. `test rules` proves it *means* what the comments claim,
  # and is the gate that matters: both bugs found while writing these rules parsed fine (a `unless`
  # between two series that differ only in the label being compared, and a missing minimum-traffic
  # conjunct that made a single 500 on an idle instance read as 100% failure).
  observability:
    name: prometheus rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Same pinned image the deploy overlay runs, so the promtool that validates the rules is the
      # Prometheus that will evaluate them.
      - name: promtool check config + rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: promtool unit tests
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 test rules /etc/prometheus/rules/tests/alerts.test.yml
      # The dashboard references the datasource by a fixed uid and every panel by a recorded series
      # name; a malformed file imports as an empty dashboard rather than failing, so parse it here.
      - name: dashboard JSON is well-formed
        run: python3 -m json.tool deploy/observability/grafana/dashboards/tankovault-overview.json > /dev/null
      # Catches a mis-merged overlay: an anchor that no longer resolves, a duplicated key, a service
      # name that collides with the base file.
      - name: compose overlay merges
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only
          TANKOVAULT_AUTH__JWT_SECRET: ci-validation-only
          TANKOVAULT_SEED_ADMIN_PASSWORD: ci-validation-only
          TANKOVAULT_ANILIST__TOKEN_ENCRYPTION_KEY: ci-validation-only
        run: |
          docker compose -f deploy/docker-compose.yml \
            -f deploy/docker-compose.observability.yml config --quiet

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        bin:
          - api
          - worker
          - control-plane
          - notifier
          - sync
          - challenge-solver
          - render
          - xtask
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Clamp image layer mtimes to the commit timestamp so repeated builds of the same
      # commit are byte-identical (see deploy/docker/Dockerfile → SOURCE_DATE_EPOCH).
      - name: derive SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: build ${{ matrix.bin }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            BIN=${{ matrix.bin }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          # The render tier needs a real browser at runtime (Chromium), so it selects the
          # dedicated runtime-browser stage; every other binary is a musl build that ships on
          # the default `scratch` runtime.
          target: ${{ matrix.bin == 'render' && 'runtime-browser' || 'runtime' }}
          push: false
          # Load the built image into the local Docker daemon so the container-structure-test
          # step below can inspect it by tag.
          load: true
          tags: tankovault-${{ matrix.bin }}:ci
          # Reproducible output: no attestation/provenance layer, and mtimes rewritten.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Enforce the image contract (design §21): non-root UID:GID 1001:1001, the expected
      # entrypoint, the required baked-in files (service binary, CA trust store), and — for the
      # render tier's Debian base — the absence of root and the presence of Chromium. The render
      # binary uses its own contract; every scratch service shares deploy/docker/cst/service.yaml.
      - name: install container-structure-test
        run: |
          curl -fsSL -o container-structure-test \
            https://storage.googleapis.com/container-structure-test/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test
          sudo mv container-structure-test /usr/local/bin/container-structure-test
      - name: structure-test ${{ matrix.bin }} image
        run: |
          config="deploy/docker/cst/service.yaml"
          if [ "${{ matrix.bin }}" = "render" ]; then
            config="deploy/docker/cst/render.yaml"
          fi
          container-structure-test test \
            --image "tankovault-${{ matrix.bin }}:ci" \
            --config "$config"

  # Cross-architecture image build, opt-in.
  #
  # Every service image is `FROM scratch` over a musl binary and `Dockerfile.frontend` already
  # parameterises `BUILD_TARGET`, so nothing in the build is x86-specific — but "nothing looks
  # x86-specific" is not evidence, which is what this job supplies. It runs on a **native** arm
  # runner: QEMU is not a substitute here, because `wreq` compiles BoringSSL from C/C++/assembly
  # and an emulated build of it costs upwards of an hour per image.
  #
  # Gated on the `ENABLE_ARM64_CI` repository variable, and gated rather than simply added
  # because `ubuntu-24.04-arm` runners are free only on **public** repositories; on a private
  # one they bill. The same shape as `ALLOW_IMAGE_PUBLISH` in `release.yml`: the leg exists and
  # is correct, and turning it on is a deployment decision rather than a code change. Set the
  # variable to any non-empty value to enable it.
  #
  # Scoped to the two images whose *content* differs by architecture — a `scratch` service
  # (the musl binary plus the loader and `libgcc_s` it resolves) and the `render` tier (a
  # Debian base with a distro Chromium, the one image whose base packages are arch-specific).
  # Building all eight would triple the wall clock to re-prove the same Dockerfile.
  docker-arm64:
    name: docker build (arm64)
    if: vars.ENABLE_ARM64_CI != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        bin: [api, render]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: derive SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: build ${{ matrix.bin }} image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          build-args: |
            BIN=${{ matrix.bin }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          target: ${{ matrix.bin == 'render' && 'runtime-browser' || 'runtime' }}
          push: false
          load: true
          tags: tankovault-${{ matrix.bin }}:ci-arm64
          provenance: false
          cache-from: type=gha,scope=arm64-${{ matrix.bin }}
          cache-to: type=gha,scope=arm64-${{ matrix.bin }},mode=max
      # The same image contract as the amd64 leg. `container-structure-test` ships a separate
      # arm64 binary; the config files are architecture-independent.
      - name: install container-structure-test
        run: |
          curl -fsSL -o container-structure-test \
            https://storage.googleapis.com/container-structure-test/v1.22.1/container-structure-test-linux-arm64
          chmod +x container-structure-test
          sudo mv container-structure-test /usr/local/bin/container-structure-test
      - name: structure-test ${{ matrix.bin }} image
        run: |
          config="deploy/docker/cst/service.yaml"
          if [ "${{ matrix.bin }}" = "render" ]; then
            config="deploy/docker/cst/render.yaml"
          fi
          container-structure-test test \
            --image "tankovault-${{ matrix.bin }}:ci-arm64" \
            --config "$config"

  docker-frontend:
    name: docker build (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: derive SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          push: false
          # Load the built image into the local Docker daemon so the container-structure-test
          # step below can inspect it by tag.
          load: true
          tags: tankovault-frontend:ci
          provenance: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      # Enforce the frontend image contract (design §21): non-root UID:GID 1001:1001, the
      # unprivileged 3000 exposed port, the entrypoint, the static-dir env var, and the presence
      # of the server binary + built SPA bundle (deploy/docker/cst/frontend.yaml).
      - name: install container-structure-test
        run: |
          curl -fsSL -o container-structure-test \
            https://storage.googleapis.com/container-structure-test/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test
