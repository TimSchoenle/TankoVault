# Full end-to-end local stack (design §19): Postgres, Redis, NATS, TRAWL, a migrate/seed
# step, every TankoVault backend service, and the frontend, all built from deploy/docker/Dockerfile.
# Run: docker compose -f deploy/docker-compose.yml up --build, then open http://localhost:3000.
#
# Secrets here are DEV-ONLY placeholders, refused at boot when TANKOVAULT_PROFILE=production. Copy
# deploy/local.env.example to deploy/local.env, fill it in, and pass `--env-file deploy/local.env`.
#
# **Only `frontend` (3000) is published on the host.** `sync`, `control-plane`, `render` and
# `challenge-solver` expose privileged, formerly unauthenticated contracts, and Docker's port
# publishing bypasses the host firewall via DOCKER-USER/iptables — `ports:` on any of them puts
# those contracts on every interface the host has. To debug one, bind loopback temporarily:
# `ports: ["127.0.0.1:8083:8083"]`. Defence in depth: every internal service also identifies its
# caller and authorises the route (x-internal-* below).
name: tankovault

x-build: &build
  context: ..
  dockerfile: deploy/docker/Dockerfile

x-telemetry: &telemetry
  TANKOVAULT_TELEMETRY__JSON_LOGS: "true"
  TANKOVAULT_TELEMETRY__LOG_FILTER: "info,tankovault=debug"
  # Sentry, off unless deploy/local.env turns it on. Passed through with an empty default
  # rather than given one here: a DSN is a credential, and a working default published in this
  # file is what `xtask repo-lint` exists to catch. `ENABLED=true` with an empty DSN is refused
  # at boot rather than started silently — docs/CONFIGURATION.md §4 `telemetry.sentry`.
  TANKOVAULT_TELEMETRY__SENTRY__ENABLED: "${TANKOVAULT_SENTRY_ENABLED:-false}"
  TANKOVAULT_TELEMETRY__SENTRY__DSN: "${TANKOVAULT_SENTRY_DSN:-}"
  TANKOVAULT_TELEMETRY__SENTRY__TRACES_SAMPLE_RATE: "${TANKOVAULT_SENTRY_TRACES_SAMPLE_RATE:-0}"

# Internal-tier identity. Each *caller* has its own credential and each *callee* lists only the
# callers it accepts, so a service's token opens the routes that service is meant to reach and
# nothing else — one tier-wide secret previously meant `challenge-solver`'s credential could
# unlink a user's tracker account through `sync`.
#
# `token` is the portable mode. Under Kubernetes set TANKOVAULT_INTERNAL__IDENTITY=mtls and mount
# cert-manager's key pair plus trust-manager's CA bundle instead; the peer entries then carry
# `__SAN` rather than `__TOKEN`. The one thing that does change there: a kubelet probe presents no
# client certificate, so `/health` and `/ready` move to the plaintext listener on
# TANKOVAULT_INTERNAL__TLS__PROBE_LISTEN (`0.0.0.0:9091`) and every probe must point at it.
#
# Required, no fallback: the previous published default was refused only when missing, not when
# present and well-known, so an inherited default authorized every inter-tier call. `xtask
# repo-lint` fails if a working default reappears here without a matching refusal in code.
x-token-api: &token-api
  "${TANKOVAULT_INTERNAL_TOKEN_API:?set it in deploy/local.env — see deploy/local.env.example; generate with `openssl rand -hex 32`}"
x-token-worker: &token-worker
  "${TANKOVAULT_INTERNAL_TOKEN_WORKER:?set it in deploy/local.env — see deploy/local.env.example; generate with `openssl rand -hex 32`}"

# `api` calls control-plane, sync and worker; it serves no internal route itself.
x-internal-api: &internal-api
  TANKOVAULT_INTERNAL__IDENTITY: "token"
  TANKOVAULT_INTERNAL__CALLER__NAME: "api"
  TANKOVAULT_INTERNAL__CALLER__TOKEN: *token-api

# `worker` is both: it is called by `api` for the adapter dry-run, and it calls the two
# solver-hosting services. The two credentials are deliberately distinct.
x-internal-worker: &internal-worker
  TANKOVAULT_INTERNAL__IDENTITY: "token"
  TANKOVAULT_INTERNAL__CALLER__NAME: "worker"
  TANKOVAULT_INTERNAL__CALLER__TOKEN: *token-worker
  TANKOVAULT_INTERNAL__PEERS__API__TOKEN: *token-api

# Called by `api` only.
x-internal-from-api: &internal-from-api
  TANKOVAULT_INTERNAL__IDENTITY: "token"
  TANKOVAULT_INTERNAL__PEERS__API__TOKEN: *token-api

# Called by `worker` only. Both of these fetch a caller-supplied URL, so the narrower the peer
# list the better.
x-internal-from-worker: &internal-from-worker
  TANKOVAULT_INTERNAL__IDENTITY: "token"
  TANKOVAULT_INTERNAL__PEERS__WORKER__TOKEN: *token-worker

x-db-url: &db-url "postgres://tankovault:tankovault@postgres:5432/tankovault"

# scratch images have no shell/wget/curl, so the service binary probes its own bind_addr instead
# (`--healthcheck`, crates/service/src/healthcheck.rs). Liveness only, not readiness.
x-healthcheck: &healthcheck
  test: ["CMD", "/usr/local/bin/tankovault-service", "--healthcheck"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

# scratch + non-root already limits blast radius; these are free additions on top.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # ---- Infrastructure ---------------------------------------------------------------
  postgres:
    # Stable major only (was `19beta2-alpine`): a beta catalog meant CI type-checked queries
    # against a moving target.
    #
    # `pgvector/pgvector`, not stock `postgres`: migration 0027 does `CREATE EXTENSION vector`
    # and the recommender retrieves through an HNSW index, so the extension is a hard dependency
    # of the deployment. This image is the official Postgres image with pgvector preinstalled —
    # same major, same entrypoint, same environment contract, so nothing else here changes.
    # It is Debian-based rather than Alpine; the memory limit below already accommodates that.
    #
    # Operators running their own Postgres must install pgvector before upgrading. See
    # `deploy/README.md`.
    image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
    deploy: { resources: { limits: { memory: 1g } } }
    # Postgres ships defaults sized for a machine it knows nothing about, and every one of them
    # is wrong here: 128 MB of `shared_buffers` against a catalogue whose `chapters` table alone
    # passed 1.2 GB, an `effective_cache_size` claiming 4 GB inside a 1 GB container, and a
    # `random_page_cost` of 4 that prices an SSD as a spinning disk. Measured effect of the
    # defaults: dashboard and trigram-match statements that run in 40–140 ms warm took 1.0–3.3 s
    # in the slow log, because a running scan's chapter inserts evict the working set continuously.
    #
    # `jit=off` is deliberate, not a rounding error. This workload is OLTP; every observed JIT
    # compilation so far has been on a plan whose cost estimate was inflated by a bad shape, and
    # it charged 190–260 ms to compile a query that then ran in tens of milliseconds. Nothing here
    # runs long enough to earn the compile back.
    #
    # `shm_size` is raised because parallel workers allocate their exchange buffers in /dev/shm,
    # which Docker caps at 64 MB by default — the failure is "could not resize shared memory
    # segment" mid-query, not a slowdown.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
    shm_size: 256mb
    environment:
      POSTGRES_USER: tankovault
      POSTGRES_PASSWORD: tankovault
      POSTGRES_DB: tankovault
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tankovault -d tankovault"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    deploy: { resources: { limits: { memory: 256m } } }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2-alpine@sha256:d4ac35882ac65aff236cd65b9d3fa4d24332c681e1a85f94eedccd3cdd65b1da
    deploy: { resources: { limits: { memory: 512m } } }
    command: ["-js", "-m", "8222"] # JetStream + HTTP monitoring (for the healthcheck)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  trawl:
    # Pinned: `latest` silently changes bot-management behaviour the adapters are tuned against.
    image: ghcr.io/germondai/trawl:1.3.1@sha256:1276e2937346190380310e15b3c4cbbf7757827c2ed3056459ad999b10cb90c9
    environment:
      # Per-domain cookie jar, so a solved session is replayed instead of re-solved. Without a
      # reachable Redis every solve falls back to a fresh browser tier — slow, not broken.
      REDIS_URL: redis://redis:6379
      # One warm Camoufox instance, not the image's default of 3: each is a full Firefox, and
      # three of them do not fit the 2g limit below.
      BROWSER_POOL_SIZE: "1"
    # `/health` gates on live browser-pool capacity, not just the listener, so `service_healthy`
    # below means "can actually solve" rather than "process started". The long start period is
    # the browser pool warming up.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8191/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    shm_size: 1gb
    deploy: { resources: { limits: { memory: 2g } } }
    depends_on:
      redis: { condition: service_healthy }

  # ---- Install steps (each runs once, then exits) ------------------------------------
  # The `bootstrap` image, not `xtask`: these are the same steps a cluster runs, so the local
  # stack exercises the artefact that ships rather than a task runner that never leaves the
  # repository. `xtask migrate`/`xtask seed` still do this against a developer's own database
  # and call the same implementation (`services/bootstrap`).
  migrate:
    build:
      <<: *build
      args: { BIN: bootstrap }
    command: ["migrate"]
    <<: *hardening
    environment:
      TANKOVAULT_DATABASE__URL: *db-url
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  seed:
    build:
      <<: *build
      args: { BIN: bootstrap }
    command: ["seed-admin"]
    <<: *hardening
    environment:
      TANKOVAULT_DATABASE__URL: *db-url
      # Required: `changeme12345` is published here, so it is not a password.
      TANKOVAULT_SEED_ADMIN_PASSWORD: "${TANKOVAULT_SEED_ADMIN_PASSWORD:?set it in deploy/local.env — see deploy/local.env.example}"
      # Must be the value the api runs with, or the account it creates can never log in.
      TANKOVAULT_AUTH__PASSWORD_PEPPER: "${TANKOVAULT_AUTH__PASSWORD_PEPPER:-}"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # Runs on every `up`, not just the first: it installs presets this build ships that the
  # database lacks *and* re-applies each one to the providers still following it, which is how
  # a selector fix reaches a stack that already has the row. Providers you registered yourself,
  # ones unlocked in the console, and every provider's crawl budget and pause state are left
  # alone — see docs/PROVIDERS.md §Managed presets.
  seed-providers:
    build:
      <<: *build
      args: { BIN: bootstrap }
    command: ["seed-providers"]
    <<: *hardening
    environment:
      TANKOVAULT_DATABASE__URL: *db-url
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # ---- Services ---------------------------------------------------------------------
  api:
    deploy: { resources: { limits: { memory: 768m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: api }
    environment:
      <<: [*telemetry, *internal-api]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: api
      TANKOVAULT_DATABASE__URL: *db-url
      # Required, no fallback: the previous published default made every session forgeable.
      # `validate_auth_secrets` refuses it in every profile.
      TANKOVAULT_AUTH__JWT_SECRET: "${TANKOVAULT_AUTH__JWT_SECRET:?set it in deploy/local.env — see deploy/local.env.example; generate with `openssl rand -hex 32`}"
      # Plain HTTP on localhost never sends a Secure cookie anyway; do not copy into a TLS deployment.
      TANKOVAULT_AUTH__COOKIE_SECURE: "false"
      TANKOVAULT_AUTH__PASSWORD_PEPPER: "${TANKOVAULT_AUTH__PASSWORD_PEPPER:-}"
      # Must agree with TANKOVAULT_EMAIL__BASE_URL (the API falls back to it): passkeys are bound
      # to this origin by the browser. `localhost` is a secure context over plain HTTP; no other
      # host gets that exception.
      TANKOVAULT_AUTH__WEBAUTHN_ORIGIN: http://localhost:3000
      TANKOVAULT_CONTROL_PLANE_URL: http://control-plane:8081
      TANKOVAULT_SYNC_URL: http://sync:8083
      TANKOVAULT_WORKER_URL: http://worker:8085
      TANKOVAULT_NATS__URL: nats://nats:4222 # live per-user notification SSE relay (/v1/me/stream)
      # Optional: unset uses a no-op mailer and these flows skip sending.
      TANKOVAULT_EMAIL__BASE_URL: http://localhost:3000
      TANKOVAULT_EMAIL__HOST: "${TANKOVAULT_EMAIL__HOST:-pro3.mail.ovh.net}"
      TANKOVAULT_EMAIL__PORT:  "${TANKOVAULT_EMAIL__PORT:-587}"
      TANKOVAULT_EMAIL__SECURITY: "${TANKOVAULT_EMAIL__SECURITY:-starttls}"
      TANKOVAULT_EMAIL__USERNAME: "${TANKOVAULT_EMAIL__USERNAME:-no-reply@your-domain.com}"
      TANKOVAULT_EMAIL__PASSWORD: "${TANKOVAULT_EMAIL__PASSWORD:-}"
      TANKOVAULT_EMAIL__FROM:  "${TANKOVAULT_EMAIL__FROM:-TankoVault <no-reply@your-domain.com>}"
      # Defaults to `username`; override only if bounces must go elsewhere.
      TANKOVAULT_EMAIL__ENVELOPE_FROM: "${TANKOVAULT_EMAIL__ENVELOPE_FROM:-}"
      # Alternatively point at any relay with a single lettre URL (takes precedence):
      # TANKOVAULT_EMAIL__URL: smtps://no-reply%40your-domain.com:change-me@ssl0.ovh.net:465
      # Redis holds the rate limit across replicas; without it the limiter falls back per-replica.
      TANKOVAULT_REDIS__URL: redis://redis:6379
      TANKOVAULT_RATE_LIMIT__BACKEND: redis
      # Safe only because the API publishes no host port: the frontend proxy appends to
      # X-Forwarded-For and the limiter trusts the right-most entry. Enabling this where the API
      # is directly reachable would let an attacker forge that entry.
      TANKOVAULT_RATE_LIMIT__TRUST_FORWARDED_FOR: "true"
      # Same-origin here, so CORS stays empty. Split-origin needs:
      # TANKOVAULT_SECURITY__CORS__ALLOWED_ORIGINS: '["https://app.example.com"]'
      # Enable once the edge terminates TLS; over plain HTTP it is misleading.
      TANKOVAULT_SECURITY__HSTS: "false"
      # IP/User-Agent are personal data (GDPR Art. 4(1)); retaining them is opt-in, not default.
      TANKOVAULT_AUDIT__RECORD_IP: "false"
      TANKOVAULT_AUDIT__RECORD_USER_AGENT: "false"
      TANKOVAULT_AUDIT__RETENTION_DAYS: "365"
      # Legal documents. `dir` roots the relative `sources` paths below, and the whole block is
      # optional — an instance with no `[legal]` section publishes no Legal column rather than
      # dead links. The mounted files are read on demand behind an mtime check, so correcting a
      # policy is an edit and a reload of the page, not a restart.
      #
      # The samples say so in their first line. Replace them before anyone else uses the
      # instance: no legal copy in this repository is legal advice or fit for a deployment.
      TANKOVAULT_LEGAL__DIR: /etc/tankovault/legal
      # One variable per leaf, because that is the only shape the environment layer builds a map
      # from: it is `figment`'s `Env` provider split on `__`, so a JSON document in a single
      # variable arrives as a *string* and the API exits at boot with "expected a map for key
      # LEGAL.DOCUMENTS". A TOML file (TANKOVAULT_CONFIG) is where a document set with many
      # locales belongs; this is the two the repository ships.
      TANKOVAULT_LEGAL__DOCUMENTS__TERMS__UPDATED: "2026-08-04"
      TANKOVAULT_LEGAL__DOCUMENTS__TERMS__SOURCES__EN: terms.en.md
      TANKOVAULT_LEGAL__DOCUMENTS__TERMS__SOURCES__DE: terms.de.md
      TANKOVAULT_LEGAL__DOCUMENTS__PRIVACY__UPDATED: "2026-08-04"
      TANKOVAULT_LEGAL__DOCUMENTS__PRIVACY__SOURCES__EN: privacy.en.md
      TANKOVAULT_LEGAL__DOCUMENTS__PRIVACY__SOURCES__DE: privacy.de.md
    volumes:
      # Read-only: the API serves these, it never writes them.
      - ./legal:/etc/tankovault/legal:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  control-plane:
    deploy: { resources: { limits: { memory: 512m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: control-plane }
    environment:
      <<: [*telemetry, *internal-from-api]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: control-plane
      TANKOVAULT_DATABASE__URL: *db-url
      TANKOVAULT_NATS__URL: nats://nats:4222
      TANKOVAULT_REDIS__URL: redis://redis:6379 # singleton-scheduler leader election (design §12)
      # Duplicate-sweep budgets. The defaults are sized for a catalogue in a steady state, where
      # a sweep has a handful of pairs to judge; a first pass over an unswept catalogue is a
      # different job, and the merge ceiling binds on every run until the backlog is gone. Raise
      # both in deploy/local.env to drain it, then put them back — the ceiling is the only bound
      # on how many series one background run may delete.
      TANKOVAULT_SCHEDULER__MERGE_SWEEP_PAIRS: "${TANKOVAULT_SCHEDULER__MERGE_SWEEP_PAIRS:-500}"
      TANKOVAULT_SCHEDULER__MERGE_SWEEP_MAX_AUTO_MERGES: "${TANKOVAULT_SCHEDULER__MERGE_SWEEP_MAX_AUTO_MERGES:-200}"
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: worker }
    environment:
      <<: [*telemetry, *internal-worker]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: worker
      TANKOVAULT_DATABASE__URL: *db-url
      TANKOVAULT_NATS__URL: nats://nats:4222
      TANKOVAULT_WORKER__CHALLENGE_SOLVER_ENDPOINT: http://challenge-solver:8090
      # Ops listener on 8085; Prometheus scrape on the isolated metrics port (default :9090).
      # Neither is published: compose can't map one host port to 2 replicas.
      TANKOVAULT_BIND_ADDR: 0.0.0.0:8085
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      # service_healthy, not service_started: the first scan can hit the solver immediately.
      challenge-solver: { condition: service_healthy }
    deploy:
      replicas: 2 # JetStream consumer group → free horizontal scale
      resources: { limits: { memory: 768m } }

  notifier:
    deploy: { resources: { limits: { memory: 384m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: notifier }
    environment:
      <<: *telemetry
      TANKOVAULT_TELEMETRY__SERVICE_NAME: notifier
      TANKOVAULT_DATABASE__URL: *db-url
      TANKOVAULT_NATS__URL: nats://nats:4222
      # Shares the API's relay config so both send under the same envelope-sender policy.
      TANKOVAULT_EMAIL__HOST: "${TANKOVAULT_EMAIL__HOST:-}"
      TANKOVAULT_EMAIL__PORT: "${TANKOVAULT_EMAIL__PORT:-587}"
      TANKOVAULT_EMAIL__SECURITY: "${TANKOVAULT_EMAIL__SECURITY:-starttls}"
      TANKOVAULT_EMAIL__USERNAME: "${TANKOVAULT_EMAIL__USERNAME:-}"
      TANKOVAULT_EMAIL__PASSWORD: "${TANKOVAULT_EMAIL__PASSWORD:-}"
      TANKOVAULT_EMAIL__FROM: "${TANKOVAULT_EMAIL__FROM:-}"
      # JSON array, e.g. '["ops@example.com"]'. Empty disables the channel.
      TANKOVAULT_CHANNELS__EMAIL_TO: "${TANKOVAULT_NOTIFIER_EMAIL_TO:-[]}"
    depends_on:
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  sync:
    deploy: { resources: { limits: { memory: 512m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: sync }
    environment:
      <<: [*telemetry, *internal-from-api]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: sync
      TANKOVAULT_DATABASE__URL: *db-url
      TANKOVAULT_ANILIST__CLIENT_ID: "${TANKOVAULT_ANILIST__CLIENT_ID:-}"
      TANKOVAULT_ANILIST__CLIENT_SECRET: "${TANKOVAULT_ANILIST__CLIENT_SECRET:-}"
      # Must point at the frontend's callback, not the API: the API callback needs the SPA's
      # in-memory Bearer token, which a raw browser redirect can't carry.
      TANKOVAULT_ANILIST__REDIRECT_URI: http://localhost:3000/account/anilist-callback
      # Required: seals every user's AniList token at rest; the previous fallback was 32 zero bytes.
      TANKOVAULT_ANILIST__TOKEN_ENCRYPTION_KEY: "${TANKOVAULT_ANILIST__TOKEN_ENCRYPTION_KEY:?set it in deploy/local.env — see deploy/local.env.example}"
    depends_on:
      migrate: { condition: service_completed_successfully }

  challenge-solver:
    deploy: { resources: { limits: { memory: 384m } } }
    healthcheck: *healthcheck
    <<: *hardening
    build:
      <<: *build
      args: { BIN: challenge-solver }
    environment:
      <<: [*telemetry, *internal-from-worker]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: challenge-solver
      TANKOVAULT_SOLVER__TRAWL_ENDPOINT: http://trawl:8191
    depends_on:
      trawl: { condition: service_healthy }

  # Optional headless-render tier (design §9); doubles as a ChallengeSolver back-end on /v1/solve.
  render:
    deploy: { resources: { limits: { memory: 2g } } }
    shm_size: 1gb
    healthcheck: *healthcheck
    # Already --no-sandbox (no user namespaces in the container). `read_only` set inline, not
    # merged from `*hardening`: this is a full Debian base, so the writable set had to be measured
    # (docker diff), not assumed like the scratch services'. uid/gid on the $HOME mount are
    # load-bearing — a root-owned mount there makes Chromium crash with a misleading
    # `chrome_crashpad_handler: --database is required` instead of a permission error.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
      - /home/nonroot:rw,nosuid,nodev,noexec,size=128m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      <<: *build
      target: runtime-browser
      args: { BIN: render }
    environment:
      <<: [*telemetry, *internal-from-worker]
      TANKOVAULT_TELEMETRY__SERVICE_NAME: render

  # ---- Frontend (Dioxus WASM SPA served by the axum `frontend` server) ---------------
  frontend:
    deploy: { resources: { limits: { memory: 256m } } }
    # Own entrypoint name, so the shared healthcheck anchor doesn't apply verbatim.
    healthcheck:
      test: ["CMD", "/usr/local/bin/tankovault-frontend", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    <<: *hardening
    build:
      <<: *build
      target: frontend
    environment:
      <<: *telemetry
      TANKOVAULT_TELEMETRY__SERVICE_NAME: frontend
      TANKOVAULT_FRONTEND__API_UPSTREAM: http://api:8080
    ports: ["3000:3000"]
    depends_on:
      # service_healthy, not service_started: don't race the frontend against a listening API.
      api: { condition: service_healthy }

volumes:
  pgdata:

networks:
  # The implicit default network, configured rather than replaced — no service names a network.
  #
  # IPv6 is on because provider origins disagree about IPv4. Four of the Keyoapp installs answer
  # an IPv4 client with a bare nginx `404` on every route, `/` included, while serving the same
  # request normally over IPv6; a `404` is not a bot-management signal, so nothing escalates it and
  # every scan of those providers failed completely. Without a v6 address on this network the
  # worker cannot reach them at all, whatever the fetch stack prefers.
  #
  # Safe on a host with no IPv6 upstream: the resolver returns both families, the connector tries
  # IPv6 first and falls back, and a blackholed v6 route costs ~250 ms per connection — measured,
  # not assumed. Docker Engine 27+ is required for `enable_ipv6` to allocate a subnet on its own.
  default:
    enable_ipv6: true
