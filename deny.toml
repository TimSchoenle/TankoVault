# cargo-deny configuration — license, advisory, and supply-chain gates run in CI. Schema v2.
#
# An exception must be **explicit, dated and justified**: a permanently red gate is one
# everyone learns to merge past, and then a genuinely new advisory looks just like the old ones.

[advisories]
version = 2
# Every entry: why no fix is possible, why it's not exploitable here, a review date. When the
# reasoning stops being true, delete the entry and let the gate go red — don't extend the date.
ignore = [
    # RUSTSEC-2023-0071 — timing sidechannel in `rsa` 0.9.x, pulled in transitively by
    # `jsonwebtoken`'s `rust_crypto` feature with no HMAC-only alternative and no fixed release.
    # Not exploitable here: `crates/auth/src/token.rs` pins `Algorithm::HS256`, test-enforced,
    # so no RSA path is ever entered. Reviewed 2026-07-29; re-review 2026-10-29 or if HS256 stops
    # being the only accepted algorithm.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2024-0436 — `paste` unmaintained; compile-time-only proc macro, no runtime
    # surface, no fix available. Reviewed 2026-07-29; re-review 2026-10-29.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2025-0111 (`rustls-pemfile`) and RUSTSEC-2025-0134 ("Tarmageddon", `tokio-tar`)
    # were here until 2026-08-03. Both arrived only through `testcontainers`/`bollard`, which
    # has since dropped them; cargo-deny reported the entries as `advisory-not-detected`, so
    # they went per this file's own rule rather than being re-dated.
]

[licenses]
version = 2
# SPDX ids permitted in the dependency graph; anything outside this set fails CI for review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # `quoted_printable` (lettre's MIME encoder): public-domain-equivalent, more permissive
    # than everything above it.
    "0BSD",
    # `webpki-roots`/`webpki-root-certs`: the Mozilla CA bundle, no copyleft or attribution.
    "CDLA-Permissive-2.0",
]

# ---------------------------------------------------------------------------------
# GPL-3.0 was here until 2026-08-01, for `wreq-util`. Do not put it back casually.
# ---------------------------------------------------------------------------------
# `wreq-util` (load-bearing browser-emulation profiles for the crawl stack) was GPL-3.0 through
# 2.x, which made publishing Docker images a source-offer obligation over the whole combined
# work. Upstream relicensed to Apache-2.0 at 3.0.0-rc.12 (requiring `wreq ^6.0.0-rc`), so an
# accidental downgrade below that is a licensing regression — caught by GPL-3.0/LGPL-3.0 being
# absent from the allow list above. Adding either back re-opens it silently.

confidence-threshold = 0.8
# Workspace members are `publish = false` with no `license` field; skip the noise of
# licence-checking our own code.
private = { ignore = true }

[bans]
# `warn` made 86 two-version crates invisible noise, so a genuinely new duplicate (or wildcard
# requirement) arrived silently inside it. `deny` plus an explicit skip list below fails on
# anything new instead.
multiple-versions = "deny"
wildcards = "deny"
# Workspace-internal path deps have no version requirement and read as a wildcard, but can't
# silently resolve to anything the way a registry dependency could.
allow-wildcard-paths = true

# Crates that must NEVER enter the graph, whoever pulls them in.
deny = [
    # The `scratch` runtime ships no OpenSSL/CA store; the crawl stack is BoringSSL-only.
    # A transitive link here would fail at exec time in production, not build time in CI.
    { crate = "openssl-sys", reason = "the scratch runtime ships no OpenSSL; use rustls, or wreq's BoringSSL" },
    { crate = "openssl", reason = "see openssl-sys" },
    # How `openssl-sys` usually arrives.
    { crate = "native-tls", reason = "pulls openssl-sys; use rustls" },
]

# Duplicate versions present as of 2026-07-30, all transitive. A record of the current state,
# not an approval — CI's `-D unnecessary-skip` fails any entry whose duplicate has resolved, so
# the PR that collapses one deletes its line here.
#
#   * `rand` at three majors is not collapsible by bumping our own pin: ours are 2 of 8
#     dependents of 0.8. Revisit when `jsonwebtoken`/`fred` move, not before.
#   * `tower-http` 0.6 is pulled by `reqwest` 0.13, nothing to fix short of dropping `reqwest`.
skip = [
    # The `rand` 0.8 → 0.9 ecosystem migration, dragging its whole cluster along.
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    { crate = "getrandom" },
    # RustCrypto trait-crate majors, split across the argon2/aes-gcm/sha2 consumers.
    { crate = "block-buffer" },
    { crate = "crypto-common" },
    { crate = "digest" },
    { crate = "hkdf" },
    { crate = "hmac" },
    { crate = "sha2" },
    # `sha1` joins them with the TOTP work: RFC 6238 is HMAC-SHA1, so `crates/auth` takes 0.11
    # alongside its `hmac` 0.13. The 0.10 copy is the same older cohort as the entries above,
    # via `crypto-glue`, `headers`, `tungstenite` and `x509-cert`.
    { crate = "sha1" },
    { crate = "cpufeatures" },
    # Long-tail utility crates where two majors coexist across the graph.
    { crate = "hashbrown" },
    { crate = "itertools" },
    { crate = "nom" },
    { crate = "shlex" },
    { crate = "socket2" },
    { crate = "syn" },
    { crate = "r-efi" },
    # TLS root stores: `webpki-roots` majors, pulled by different clients.
    { crate = "webpki-roots" },
    # `tower-http` 0.6 arrives transitively; ours is pinned at 0.7.
    { crate = "tower-http" },
    # The passkey stack (added 2026-08-01 with `webauthn-rs` 0.6): every entry below is a
    # second, older copy arriving only through `webauthn-rs-core`.
    # AEAD cluster: `crypto-glue` pins `aes-gcm 0.10`; `crates/auth` uses 0.11. Collapses when
    # `crypto-glue` bumps.
    { crate = "aead" },
    { crate = "aes" },
    { crate = "aes-gcm" },
    { crate = "cipher" },
    { crate = "ctr" },
    { crate = "ghash" },
    { crate = "inout" },
    { crate = "polyval" },
    { crate = "universal-hash" },
    # `thiserror` 1.x via `webauthn-rs-core`/`x509-parser`/`asn1-rs`/`der-parser`; we're on 2.
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    # `base64`: three copies — ours (0.23), the wide transitive middle (0.22), and
    # `webauthn-rs-core`/`-proto` (0.21). Nothing on our side pins the older two.
    { crate = "base64" },
    # `const-oid`: 0.10 via `digest` 0.11, 0.9 via the passkey stack's older RustCrypto cohort.
    # Same shape as the AEAD cluster; collapses with the same `crypto-glue` bump.
    { crate = "const-oid" },
    # The X.509 cluster (added 2026-08-22, when `x509-parser` moved to 0.18): `crates/service`
    # reads subject alternative names off a verified peer certificate with 0.18, and
    # `webauthn-rs-core` pins 0.16, which drags its own parser stack — `der-parser` 9,
    # `asn1-rs` 0.6 and `oid-registry` 0.7 — alongside ours. `webauthn-rs` is an exact `=0.6.1-dev`
    # pin, so nothing on our side can move the older copy; collapses when it takes 0.18.
    { crate = "x509-parser" },
    { crate = "der-parser" },
    { crate = "asn1-rs" },
    { crate = "asn1-rs-derive" },
    { crate = "oid-registry" },
    # The PKCS#8 cluster (added 2026-08-23, when `pkcs8` moved to 0.11 and `sec1` to 0.8):
    # `crates/service/src/tls.rs` re-encodes a mounted key with the `der` 0.8 generation, and the
    # 0.7 generation stays behind it under three roots — `crypto-glue` (the exact `=0.6.1-dev`
    # `webauthn-rs` pin), `jsonwebtoken` 11 (`rsa` 0.9, `ed25519` 2.2, `p256`/`p384`/`p521` 0.13)
    # and `nkeys` under `async-nats`. None can move today; collapses when all three take `der` 0.8.
    { crate = "der" },
    { crate = "pem-rfc7468" },
    { crate = "pkcs8" },
    { crate = "sec1" },
    { crate = "spki" },

    # Platform shims, present on any graph touching Windows or macOS bindings.
    { crate = "windows-sys" },
    # The import-library family behind `windows-sys` (added 2026-08-03). Not a new decision —
    # `windows-sys` above is already two copies, 0.52.0 under `ring` and 0.60.2 under `notify`,
    # and these are that split reaching one level down. They became visible only when `notify`
    # moved to a `windows-sys` new enough to pull `windows-targets` 0.53. Windows-only link
    # stubs: nothing here is reachable in the Linux images that ship. Collapses when `ring`
    # bumps its `windows-sys` floor, which is the only pin holding 0.52 in place.
    { crate = "windows-targets" },
    { crate = "windows_aarch64_gnullvm" },
    { crate = "windows_aarch64_msvc" },
    { crate = "windows_i686_gnu" },
    { crate = "windows_i686_gnullvm" },
    { crate = "windows_i686_msvc" },
    { crate = "windows_x86_64_gnu" },
    { crate = "windows_x86_64_gnullvm" },
    { crate = "windows_x86_64_msvc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The two git dependencies, both extracted out of this workspace and both pinned by tag in the
# root manifest: `terrace-config` (the layered config loader and reload supervisor) and
# `csp-shell` (the frontend tier's Content-Security-Policy). Listed here because
# `unknown-git = "deny"` above is what stops a *third* one arriving unnoticed — a git source is
# a dependency with no registry, no version resolution and no yank mechanism, so each one is a
# deliberate decision rather than something a transitive bump can introduce.
allow-git = [
    "https://github.com/TimSchoenle/terrace-config",
    "https://github.com/TimSchoenle/csp-shell",
]
