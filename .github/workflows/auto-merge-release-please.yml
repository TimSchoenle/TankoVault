name: Auto-Merge Release PRs

# Approves and enables auto-merge on the release-please pull request once it has sat for the
# configured time, via the shared `timed-auto-merge` action from `TimSchoenle/actions`.
#
# `branch_pattern` and `trusted_authors` are what stop an ordinary pull request being swept up by
# the schedule. The delay is the window in which a human can object to a release. Nothing here
# bypasses the required `ci` check.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  pull_request_review:
    types: [dismissed]
  workflow_dispatch:
    inputs:
      time_elapsed:
        description: 'Time elapsed since PR creation (e.g. "24h", "1d").'
        required: true
        default: '1d'

# A newer run supersedes a sweep still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-timed-auto-pr-approve
  cancel-in-progress: true

permissions: {}

jobs:
  auto-merge-releases:
    name: Auto Merge Releases
    runs-on: ubuntu-latest
    # Every call is made with the app token minted below, so this job needs nothing from the
    # ambient `GITHUB_TOKEN`.
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # The release PRs are opened by automatic-release-manager, so the review comes from the
      # maintenance app: GitHub refuses a review from a PR's own author. Narrowed to what the
      # action does (zizmor `github-app`); otherwise the token inherits the whole installation.
      - name: Generate Bot Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # to enable auto-merge
          permission-pull-requests: write # to list the PRs and approve them

      - name: Approve and Auto-merge
        uses: TimSchoenle/actions/actions/maintenance/timed-auto-merge@4bd2c684f590f4559c787287ddfca87391ba0f43 # tag=actions-maintenance-timed-auto-merge-v2.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          trusted_authors: '253958393,248313786' # actions-maintenance-bot, automatic-release-manager
          branch_pattern: 'release-please--branches--%'
          pattern_mode: 'legacy'
          # `inputs` is empty on `schedule` and `pull_request_review`, hence the fallback.
          time_elapsed: ${{ inputs.time_elapsed || '7d' }}
          # The floor a dispatch cannot go below. Deliberately not a dispatch input: lowering it has
          # to take a commit to this file.
          minimum_age: '1h'
          merge_method: 'squash'
