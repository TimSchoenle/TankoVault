# cargo-deny configuration — license, advisory, and supply-chain gates run in CI
# (design §3 "Workspace lints", §19 CI, §21 DoD). Schema v2 (cargo-deny 0.14+).

[advisories]
version = 2
# RustSec advisory DB is checked for the whole dependency graph. Add specific
# advisory IDs here (with a comment + rationale) only when a fix is unavailable.
ignore = []

[licenses]
version = 2
# SPDX ids permitted across the dependency graph. Kept deliberately permissive-but-
# explicit: any dependency introducing a license outside this set fails CI for review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are a warning (transitive drift is common on a latest-stable
# policy), not a hard failure; wildcard version requirements are discouraged.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
