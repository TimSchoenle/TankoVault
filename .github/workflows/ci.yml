name: CI

# Design §19 (CI) / §21 (Definition of Done): fmt + clippy(-D warnings) +
# cargo-deny + cargo-audit + workspace tests + the wasm frontend check + a
# docker build of every service image.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets
      # Fails if a backend DTO changed without regenerating the OpenAPI artifacts
      # (services/api/src/openapi.rs -> xtask openapi -> openapi.json + the progenitor
      # crates/api-client client, consumed by the frontend via web/frontend/src/wire.rs). A
      # local pre-commit hook (installed automatically by xtask/build.rs, see
      # xtask/hooks/pre-commit) normally keeps this from ever drifting; this is the backstop
      # for commits made without it.
      - name: OpenAPI artifacts are up to date
        run: cargo run -p xtask -- openapi --check

  frontend:
    name: frontend (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/frontend
      - name: cargo check (wasm)
        working-directory: web/frontend
        run: cargo check --target wasm32-unknown-unknown

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        bin:
          - api
          - worker
          - control-plane
          - notifier
          - sync
          - challenge-solver
          - render
          - xtask
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.bin }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: BIN=${{ matrix.bin }}
          # The render tier needs a real browser at runtime (Chromium), so it
          # selects the dedicated runtime-browser stage; everything else uses
          # the default distroless runtime.
          target: ${{ matrix.bin == 'render' && 'runtime-browser' || 'runtime' }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
