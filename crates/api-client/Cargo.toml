[package]
name = "tankovault-api-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
tankovault-domain = { workspace = true }
progenitor-client = { workspace = true }

# Both are used, heavily, and `cargo machete` cannot see it: `prettyplease` formats the
# generated absolute paths as `:: serde :: Deserialize` and `:: url :: Url`, which its
# source scan does not recognise as a crate reference. Without this the next unused-dependency
# sweep deletes two dependencies the crate does not compile without.
[package.metadata.cargo-machete]
ignored = ["serde", "url"]

# This crate is 100% generated codegen output (`src/lib.rs` is emitted by `xtask`
# and marked "DO NOT EDIT"), so the workspace's `clippy::pedantic` group is not
# actionable here. Keep the compiler lints but silence clippy for the generated code.
#
# This is the only workspace member that does not write `[lints] workspace = true`, because
# Cargo refuses a manifest that both inherits the workspace lint table and declares its own.
# The cost is that a lint added to `[workspace.lints.rust]` silently skips this crate — which
# is where a new rustc lint is most likely to fire and least likely to be read.
# `tests/workspace_lints.rs` is what closes that: it compares the block below against
# `[workspace.lints.rust]` line for line and fails when they diverge, so the copy is enforced
# rather than remembered. Keep one lint per line; the check scans text, not TOML.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
# The one recorded divergence from `[workspace.lints.rust]`, and the reason it is `allow` rather
# than absent: `missing_docs` fires 2 607 times on this file. Every one of those items is
# `progenitor` output whose only documentation `xtask openapi` could write is the OpenAPI
# `description` it already emits as `#[doc = "…"]` where the specification carries one. The
# contract those types describe is `openapi.json`, which is generated from the API's own
# `///` comments — the doc-comment standard's rule that a generated file's documentation lives
# with its source, not its output. `tests/workspace_lints.rs` records this exemption by name and
# still fails on any other divergence.
missing_docs = "allow"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
