# TankoVault frontend: serve the Dioxus SPA and reverse-proxy the API under one origin.
#
# The WASM client issues same-origin `/v1/...` requests (web/frontend/src/api.rs → API_BASE
# = ""), so proxying `/v1/*` here means the browser never makes a cross-origin call: no CORS,
# and the Server-Sent Events streams (`/v1/me/stream`, `/v1/admin/scans/stream`) work.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the `api` upstream at request time (via the $var below)
    # keeps nginx from failing to boot if `api` is briefly unresolvable, and follows the
    # container across restarts/re-IPs instead of caching a stale address at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Container healthcheck target (see docker-compose.yml).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # REST + SSE -> the api service. Using a variable in proxy_pass forces runtime DNS
    # resolution; with no URI part the original request path (/v1/...) is passed through
    # unchanged. Buffering/caching are disabled so SSE frames flush immediately and
    # long-lived streams are not held open inside nginx.
    location /v1/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;

        # Baseline hardening for the HTML/WASM/JS/CSS the SPA is built from. Scoped to this
        # block so the `/v1/` proxy responses keep the API's own headers instead of two layers
        # emitting conflicting values.
        #
        # CSP notes:
        #   - `script-src` permits `'wasm-unsafe-eval'` (the WASM client compiles its module) and
        #     `'unsafe-inline'` (index.html ships inline bootstrap scripts — theme pre-paint and
        #     the global search shortcut — and `dx build` injects its own inline module loader,
        #     whose hash changes every build, so a hash/nonce allow-list is not maintainable here).
        #   - `img-src` allows `https:`/`data:` because covers are *links* to arbitrary provider
        #     domains ("links, not content"); the app never proxies image bytes.
        #   - `connect-src 'self'` is sufficient: the client calls the same-origin `/v1/*` proxy,
        #     including the SSE streams.
        #   - `frame-ancestors 'none'` blocks clickjacking; `object-src 'none'` blocks plugins.
        # add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
}
