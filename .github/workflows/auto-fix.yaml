name: auto-fix

# Applies every mechanical fix this repository has on pull requests, and commits the result:
# clippy's machine-applicable suggestions, `cargo fmt`, and the four generated artefacts.
#
# The dividing line is *determinism*, not convenience. Everything here has exactly one correct
# output given the tree, so a bot's answer is byte-identical to a human's and there is nothing to
# review in the diff it produces. What is deliberately absent is anything where the fix is a
# choice — see the note on `repo-lint` at the bottom of this file.
#
# Four files in this repository are generated, committed, and must not be hand-edited:
# `openapi.json`, `crates/api-client/src/lib.rs`, `THIRD-PARTY-NOTICES` (ENGINEERING_GUIDE rule 6)
# and `web/frontend/assets/main.css` (Tailwind output, committed so a build without Node works).
# Three CI jobs — `openapi --check`, `notices drift` and `tailwind output is current` — fail when
# they drift, but none fixes anything, so the failure is a red gate waiting on a human to run a
# command whose output is fully determined by the tree.
#
# That gap is not hypothetical. release-please bumps `$.workspace.package.version`, which all
# three artefacts record, and nothing regenerated them: release #50 landed on `main` with
# `openapi.json` still reporting `0.4.1`, and `openapi --check` never even ran because `rustdoc`
# failed earlier in the same job. Regeneration is mechanical and the bot's output is byte-identical
# to a developer's, so a bot may do it — the same argument that justifies `auto-format.yaml`.
#
# This does **not** weaken review of API changes. `openapi breaking changes` still compares the
# regenerated document against the base branch, so a change that breaks a client is still a red
# gate; what stops being a red gate is *forgetting to run the generator*.
#
# Everything in one job on purpose, and in this order: `clippy --fix` rewrites source, `cargo fmt`
# formats what it wrote, and only then are the artefacts regenerated from the result. Split across
# workflows they would race to push, and the generators would run against pre-fix source.
#
# ---------------------------------------------------------------------------------------------
# Why `xtask repo-lint` is not here, and must not be added
# ---------------------------------------------------------------------------------------------
# Every `repo-lint` rule is of the form "two artefacts that must agree, disagree" — a CSP and the
# HTML it governs, the harness's Postgres major and production's, `deny.toml`'s advisory ignores
# and `.cargo/audit.toml`'s. None of them carries the answer to *which side is wrong*, so an
# automated fix would not be applying a known correction; it would be picking a side, and the side
# a machine picks is whichever makes the build go green.
#
# For one rule that is not merely unsound but the exact failure it exists to prevent.
# `csp-no-unsafe-eval` fires when code needs a directive the policy refuses. The green-making edit
# is to widen the CSP — which ENGINEERING_GUIDE rule 1 forbids in as many words, because the SPA's
# access token lives in memory and the policy is the ceiling on where an injected script could
# send it. A bot that resolved that rule automatically would be a supply-chain downgrade wearing
# the same commit message as a formatting fix.
#
# `too_many_lines` and the other suggestion-less clippy lints are excluded for the weaker version
# of the same reason: no machine-applicable suggestion means no determined output.

on:
  pull_request:
    # The union of `ci.yml`'s `rust`, `notices` and `frontend` filters — the inputs the four
    # artefacts are a function of. Directories, never `**/*.rs`, for the reason `ci.yml` gives:
    # `web/frontend` is a separate workspace and a glob would silently couple the two.
    paths:
      - ".github/workflows/auto-regenerate.yaml"
      - "crates/**"
      - "services/**"
      - "xtask/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "openapi.json"
      - "about.toml"
      - "THIRD-PARTY-NOTICES"
      - "web/frontend/**"

# Shared with `auto-format.yaml` and `update-lockfile.yaml`. All three push to the pull request's
# head branch, so they queue rather than race — see `update-lockfile.yaml` for the reasoning.
concurrency:
  group: pr-autocommit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

# Must stay byte-identical to `ci.yml`'s. `rust-cache` hashes the `CARGO_*`/`RUST*` environment
# into its key, so a workflow that leaves these unset looks up a different key from the one
# `ci.yml`'s `lint` group writes and compiles the workspace from cold on every pull request —
# which is what this job did while it had no `env:` block at all. The `clippy --fix` step below
# clears `RUSTFLAGS` for itself; see its comment for why that must not be done here.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fix:
    name: apply the mechanical fixes
    runs-on: ubuntu-latest
    # Generous: this job compiles the workspace under `--all-targets --all-features` for
    # `clippy --fix`, checks it again, and then builds `tankovault-api` for `xtask openapi`.
    timeout-minutes: 60
    # Forks cannot read the app secrets, and a fork PR must not be able to make this repository
    # commit on its behalf. Skipping is correct: a fork's drift is the author's to fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # A GitHub App token, not `GITHUB_TOKEN`: a push made with the default token does not trigger
      # workflows, so the regenerated artefacts would land without re-running the checks that
      # wanted them. `ACTIONS_MAINTENANCE_*` rather than `RELEASE_BOT_*` for the reason
      # `auto-format.yaml` gives — those are `release` environment secrets.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          # Narrowed to the one permission this job uses (zizmor `github-app`): it commits three
          # files to the PR branch, and `contents: write` is that and nothing else.
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      # The second reader of `rust-toolchain.toml`, after `ci.yml`'s `changes` job. The *number*
      # still has one home; what is repeated is the two-line read, which cannot drift from the
      # manifest because it is the manifest. `stable` would not do here as it does in
      # `update-lockfile.yaml`: `xtask openapi` formats the generated client with rustfmt, and
      # `cargo fmt --check` then judges it under the pinned toolchain.
      - name: resolve the toolchain from its manifest
        id: versions
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$toolchain" ]; then
            echo '::error::no channel = "…" line in rust-toolchain.toml'
            exit 1
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "::notice::toolchain $toolchain"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ steps.versions.outputs.toolchain }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # The group `ci.yml`'s `lint` job writes: this compiles the same workspace with the same
          # flags. Without naming it the lookup used a key derived from this job's own name — one
          # nothing writes, because this workflow runs on pull requests only and so never executes
          # on `main`. It restored nothing, on every run.
          shared-key: lint
          # Reads `main`'s cache, never writes one: this runs only on pull requests, and a PR
          # populating the shared cache is how an unreviewed artefact reaches every other job.
          save-if: "false"

      # `wreq` compiles BoringSSL from C/C++ source; `xtask openapi` builds `tankovault-api`, so
      # this job needs them exactly as `ci.yml`'s Rust jobs do.
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-about

      # `cargo-about` resolves licences from a fetched graph; both, because the notices document
      # covers the frontend workspace too.
      - name: fetch both dependency graphs
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo fetch --locked --manifest-path web/frontend/Cargo.toml

      # Only clippy's *machine-applicable* suggestions are applied — that is rustfix's contract,
      # not a flag. A lint with no concrete replacement (`too_many_lines`, which wants a judgement
      # about how to split a function) is left alone and stays a red `fmt + clippy`, which is the
      # correct outcome: the fixable half stops costing a round trip, the half that needs a
      # decision still gets one.
      #
      # No `-D warnings` in this job's environment, deliberately. Under it, an unfixable lint
      # would abort the run before rustfix wrote anything, so the one lint nobody can automate
      # would suppress the fixes for all the ones anybody can.
      #
      # Cleared on this step alone rather than by omitting it from the workflow `env:`, which is
      # what the cache key is computed from — see that block.
      - name: apply clippy's machine-applicable fixes
        env:
          RUSTFLAGS: ""
        run: |
          set -euo pipefail
          cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged

      # `--fix` rewrites expressions without reformatting them, so this runs second and formats
      # what it wrote. Doing it the other way round commits code that `cargo fmt --check` rejects.
      - name: format the result
        run: cargo fmt --all

      # rustfix reverts a fix that does not compile, but it judges that per-crate and this
      # workspace is 26 of them. A tree that no longer builds must not reach the commit step:
      # failing here leaves the branch exactly as the author pushed it, which is recoverable,
      # where a committed broken tree is a bot-authored regression to bisect.
      - name: the fixed tree still compiles
        run: cargo check --workspace --all-targets --all-features

      - name: regenerate the OpenAPI document and its client
        run: cargo run -p xtask -- openapi

      - name: regenerate THIRD-PARTY-NOTICES
        run: cargo run -p xtask -- notices

      # Same Node major as `ci.yml`'s `css` job, which is what judges the result.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: rebuild the Tailwind output
        working-directory: web/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run css:build

      # Scoped to source and the four artefacts rather than the whole tree. Nothing else in this
      # job is meant to change — `npm ci` can touch `package-lock.json` and `cargo` can touch a
      # lockfile — and those belong to `update-lockfile.yaml`, not here. Anything outside this
      # list that changed is a bug to see in a red gate, not to commit silently.
      - name: Commit the fixes
        uses: TimSchoenle/actions/actions/common/commit-changes@147b117c39eaa951bf8c326c5e2fa8553c8a8937 # tag=actions-common-commit-changes-v1.2.2
        with:
          commit_message: "style: apply the mechanical fixes (clippy --fix, fmt, regenerated artefacts)"
          token: ${{ steps.generate_token.outputs.token }}
          branch: ${{ github.event.pull_request.head.ref }}
          file_pattern: "crates services xtask fuzz openapi.json THIRD-PARTY-NOTICES web/frontend/src web/frontend/assets/main.css"
