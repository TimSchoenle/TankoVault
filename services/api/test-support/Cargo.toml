[package]
name = "tankovault-api-test-support"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Dev-only in-process router harness for the API service."
publish = false

# The half of the old `crates/test-support` that genuinely needs the API service (ARCH-17).
# `crates/test-support` used to hold both, which put a `services/*` dependency in the layer
# beneath services and made `cargo test -p tankovault-db` compile the whole API. The database
# harness stayed in `crates/test-support`; only this crate depends on `tankovault-api`.
#
# The resulting `api -> (dev) api-test-support -> api` cycle is permitted by Cargo precisely
# because the edge back into this crate is a dev-dependency. Nothing but `services/api`'s own
# tests may depend on it.

[dependencies]
tankovault-api = { path = ".." }
# `AppState`'s key material and the stream-ticket store both speak `secrecy` types.
secrecy = { workspace = true }
tankovault-test-support = { path = "../../../crates/test-support" }
tankovault-config = { workspace = true }
tankovault-service = { workspace = true }
tankovault-domain = { workspace = true }
# The `Sealer` the harness hands `AppState`, so TOTP enrolment is exercised for real rather
# than answering the `503` of an unconfigured deployment. Suites also use `totp::code_at_step`
# to produce a code the server will accept.
tankovault-auth = { workspace = true }
# `seed_totp`/`step_up` write second-factor rows directly, so a suite testing a *guarded* route
# does not have to drive the enrolment surface first — a failure there would surface as a
# failure in whatever the suite was actually checking.
tankovault-db = { workspace = true }
tankovault-email = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[lints]
workspace = true
