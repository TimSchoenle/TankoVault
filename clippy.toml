# Workspace clippy configuration: the three lints that take a configured list
# (`disallowed_methods`, `disallowed_macros`, `disallowed_types`). Lint levels live in
# `Cargo.toml`'s `[workspace.lints]`; `web/frontend` is a separate workspace root and does not
# inherit this file (see `web/frontend/clippy.toml`).
#
# A path clippy cannot resolve is silently ignored — no diagnostic, just a rule that never
# fires. So every entry here has been proved to fire by temporarily writing the banned call and
# watching clippy reject it; do the same for anything you add.

# Macros that must never reach a commit.
disallowed-macros = [
    { path = "std::dbg", reason = "debugging leftover: writes to stderr outside `tracing`, so it is invisible to the JSON log pipeline and never gets a request id. Use `tracing::debug!`" },
    { path = "std::todo", reason = "a `todo!()` reaching a service is a panic in production. Return an error, or do not merge the path" },
    { path = "std::unimplemented", reason = "see `todo!`. If a trait method is genuinely unreachable, say so with a documented `unreachable!`" },
]

disallowed-methods = [
    # A blocking sleep parks the whole tokio worker thread, not just the task.
    { path = "std::thread::sleep", reason = "blocks a tokio worker thread. Use `tokio::time::sleep`, or `spawn_blocking` if the surrounding work is genuinely synchronous" },

    # No timeouts, no pool bound — a hung upstream starves the whole pool. Exempt test code
    # talking to a local `wiremock` via `#[expect(clippy::disallowed_methods, reason = "…")]`.
    { path = "reqwest::Client::new", reason = "no timeouts, no pool bound. Build it with `reqwest::Client::builder()` and set `connect_timeout` + `timeout`; see `services/api/src/upstream.rs`" },
]
