# Nightly, and only here. `libfuzzer-sys` compiles the crate under test with
# `-Z sanitizer=address`, which is nightly-only.
#
# This file is what makes a plain `cargo build` *inside* this directory work, and it is where the
# requirement is written down. It is deliberately NOT how `cargo fuzz` selects its toolchain:
# `cargo fuzz` has to be invoked from the repository root (it locates `./fuzz` from there), where
# the root `rust-toolchain.toml`'s 1.94.0 wins — hence the explicit `cargo +nightly fuzz …` in
# README.md.
#
# The reason `fuzz/` is excluded from the host workspace rather than being a member is this
# channel: as a member it would drag nightly into `cargo fmt --all`, `cargo clippy --workspace`
# and the `--locked` resolution the `msrv` (1.85) and `supply-chain` jobs measure.
[toolchain]
channel = "nightly"
components = ["rust-src"]
