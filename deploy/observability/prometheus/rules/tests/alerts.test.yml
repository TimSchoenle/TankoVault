# `promtool test rules` cases for the two expressions whose label semantics are easy to get wrong
# and impossible to eyeball. Run from the repository root:
#
#   docker run --rm --entrypoint /bin/promtool \
#     -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 \
#     test rules /etc/prometheus/rules/tests/alerts.test.yml
#
# `promtool check rules` only proves the PromQL parses. These cases prove it *means* what the
# comments in the rule file claim, which is where both of the bugs found while writing this file
# lived:
#
#   1. `TankoVaultHighServerErrorRatio` has a minimum-traffic conjunct so that a single `500` on a
#      near-idle instance is not "100% of requests failing". Without it the alert is untrustworthy
#      on exactly the deployment shape this project targets.
#   2. `TankoVaultFastScanLanesStarved` uses `unless` between two series that differ only in the
#      `scan` label being compared. `unless` matches on identical label sets, so without the
#      `sum()` on both sides the right-hand side can never cancel the left and the alert fires
#      whenever any full-scan task is served.
#
# These are also the two rules a future edit is most likely to "simplify" back into being wrong.

rule_files:
  - ../tankovault-recording.rules.yml
  - ../tankovault-alerts.rules.yml

evaluation_interval: 1m

tests:
  # ---- Error ratio: real traffic, real failure rate --------------------------------------------
  # 60 requests/min succeeding and 6/min failing is a ~9% 5xx ratio at 1.1 req/s, which is over
  # both the 5% floor and the 0.05 req/s traffic gate.
  - interval: 1m
    name: a genuine 5xx ratio on real traffic fires
    input_series:
      - series: 'http_requests_total{job="api",method="GET",route="/v1/series",status="200"}'
        values: "0+60x40"
      - series: 'http_requests_total{job="api",method="GET",route="/v1/series",status="500"}'
        values: "0+6x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: TankoVaultHighServerErrorRatio
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
            exp_annotations:
              summary: "api is returning 9.091% 5xx"
              description: >-
                A server-side defect, not a client one — every client-side outcome in this API is a
                4xx. Find the route on the dashboard's "5xx by route" panel, then pull the matching
                logs: every response carries `x-request-id` and the logs are JSON, so `docker
                compose logs api | grep <request-id>` gives the full span. If the route is a
                `/v1/me/sync/*` path the failure is probably downstream in `sync`; check that job's
                own error ratio before reading api code.

  # ---- Error ratio: the low-traffic guard ------------------------------------------------------
  # One request per minute, and every one of them a `500`. The ratio is 100% but the rate is
  # 0.017 req/s, well under the 0.05 gate — so this must stay silent. A self-hosted instance with
  # one user idles here, and paging on it would train the operator to ignore the alert.
  - interval: 1m
    name: a 100% error ratio on negligible traffic stays silent
    input_series:
      - series: 'http_requests_total{job="api",method="GET",route="/v1/series",status="500"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: TankoVaultHighServerErrorRatio
        exp_alerts: []
      - eval_time: 30m
        alertname: TankoVaultServerErrorsCritical
        exp_alerts: []

  # ---- Fast-lane starvation: the case the alert exists for --------------------------------------
  # Full-scan tasks are being served, so the worker is demonstrably alive and consuming, while the
  # fast lane has served nothing. Strict priority means a fast task cannot be queued behind a full
  # backlog, so this can only be a lane that failed to open.
  - interval: 1m
    name: full tasks flowing with no fast tasks fires
    input_series:
      - series: 'scan_tasks_served_total{job="worker",instance="worker-1:9090",provider="madara",scan="full"}'
        values: "0+30x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: TankoVaultFastScanLanesStarved
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Full scan tasks are flowing but no fast scan task has been served"
              description: >-
                New chapters are not being picked up even though the worker is consuming: fast
                scans are what surface a new release, full scans only rebuild the catalogue. Strict
                priority means a fast task cannot be queued behind a full backlog, so the lanes
                themselves are the suspect. Grep the worker log for `could not open provider task
                lane`. If the lanes are open, check the control-plane is still planning fast runs
                at all — `TankoVaultServiceDown` for control-plane would have fired, but a
                scheduler wedged without dying would not.

  # ---- Fast-lane starvation: both tiers healthy -------------------------------------------------
  # The regression case. Both lanes are serving, so the alert must be silent — which it only is
  # because both sides of the `unless` are aggregated away from the `scan` label.
  - interval: 1m
    name: both scan tiers serving stays silent
    input_series:
      - series: 'scan_tasks_served_total{job="worker",instance="worker-1:9090",provider="madara",scan="full"}'
        values: "0+30x60"
      - series: 'scan_tasks_served_total{job="worker",instance="worker-1:9090",provider="madara",scan="fast"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: TankoVaultFastScanLanesStarved
        exp_alerts: []
