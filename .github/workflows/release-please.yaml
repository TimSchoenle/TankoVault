name: release-please

# Release automation, end to end: release-please opens and maintains the release pull request,
# and merging it tags the repository and publishes the service images *that changed* for that tag
# as multi-architecture manifests, signed and with an SBOM attested against the published digest.
# `helm-release` then proposes the matching bump to the chart in `TimSchoenle/helm-charts`.
#
# ---------------------------------------------------------------------------------------------
# A release publishes what changed, not everything. It did not always.
# ---------------------------------------------------------------------------------------------
# All nine images used to be rebuilt, retagged and repinned on every release, whatever the
# release contained — so a one-line fix in `notifier` rolled all nine Deployments, and a
# documentation release rolled them for nothing.
#
# The `plan` job below decides the set instead. `xtask release-plan` walks the workspace
# dependency graph, so a change to `crates/domain` still reaches every image and a change to
# `services/render` reaches one; the paths that are build inputs without belonging to a package
# live in a table in `xtask/src/release_plan.rs`, and `repo-lint` fails if a top-level path
# matches neither. Anything unrecognised counts as a change to everything: an unnecessary rebuild
# costs runner minutes, a missed one ships stale code under a version that claims otherwise.
#
# Each image is diffed from **the tag it is currently published at**, resolved from the registry,
# rather than from the previous release. That is what makes the decision self-healing: a leg that
# failed at v1.0.1 is rebuilt at v1.0.2 instead of being skipped for good.
#
# Two consequences, both deliberate. A service that did not change has no `vX.Y.Z` tag for that
# release, so its `latest` and `X.Y` stay at its last real build — the registry's tag set is the
# record of which releases changed it, and the chart is the one complete reference surface.
# And `release-please` still decides one version for the whole repository: its own job is
# untouched, because per-component release-please attributes commits by path prefix and would
# never see `crates/domain`.
#
# The escape hatch is the `RELEASE_REBUILD_ALL` repository variable, which makes `plan` select
# every image without consulting a diff.
#
# The structure-test steps sit on the publishing path, before the push, because that is the only
# place the arm64 contract is ever checked for `frontend` and the six other `scratch` services
# that `ci.yml`'s arm64 job does not cover.
#
# ---------------------------------------------------------------------------------------------
# Why `release-type: simple` in `release-please-config.json`, and not `rust`
# ---------------------------------------------------------------------------------------------
# This is the one piece of configuration a future maintainer is most likely to "fix" — JSON
# cannot carry a comment, so the reasoning lives here and in `docs/RELEASING.md`.
#
# release-please's `rust` strategy rewrites `[package] version` in the root manifest *and every
# workspace member*. This workspace has no root `[package]` — it is a virtual manifest — and all
# 26 members inherit `version.workspace = true` from `[workspace.package]`, which the Rust
# updater does not touch. So `rust` would rewrite 26 members' `version.workspace = true` into
# literal strings while leaving the actual source of truth at `0.1.0`.
#
# `simple` touches only `CHANGELOG.md` (its `version.txt` updater is `createIfMissing: false`
# and this repository has no `version.txt`, so it is a no-op), and an `extra-files` entry bumps
# `$.workspace.package.version` explicitly. One version, one place, no churn.
#
# The consequence is that `Cargo.lock` goes stale on the release PR — every member's recorded
# version changes — which would break every `--locked` build. `update-lockfile.yaml` is what
# keeps it in step; it is not optional.
#
# ---------------------------------------------------------------------------------------------
# The cache contract with `ci.yml`
# ---------------------------------------------------------------------------------------------
# Three tag families on the GHCR `buildcache` repository, all arch-qualified because a BuildKit
# cache does not cross architectures:
#
#   backend-deps-<arch>   written by `ci.yml`, off `main` only. Read here, never written.
#   frontend-deps-<arch>  the same, for the wasm half. Read by the two `frontend` legs.
#   release-deps-<arch>   written by `release-deps` below, at the release commit. Read by the legs.
#
# The third exists because this workflow and `ci.yml` both fire on the push that merges a release
# PR, so the CI tags are still at the *previous* commit when the legs start — and because two
# workflows exporting `mode=max` into one tag concurrently is a write race, not a warm cache.
#
# `SERVICE_BINS` is narrowed to the planned set, which cuts a thin-LTO link per image that is not
# being published. It is passed from one place — `plan`'s `service_bins` output — to the warm-up
# and to both `build-push-action` calls in every leg, and those three have to stay the same
# string: the value is part of the `builder` layer's cache key, so a warm-up cooked under a
# different one is a cache the legs cannot read. It also no longer matches `ci.yml`'s default,
# which costs nothing: the release commit rewrites `Cargo.toml` and `Cargo.lock`, so `builder`'s
# `COPY . .` misses against `backend-deps-<arch>` regardless. `cook` sits above the ARG and still
# hits.
#
# ---------------------------------------------------------------------------------------------
# On the `${{ }}` discipline in this file
# ---------------------------------------------------------------------------------------------
# This workflow holds `packages: write` and `id-token: write`, so an expression expanded into a
# `run:` block matters more here than anywhere else: `${{ }}` is textual substitution performed
# *before* the shell sees the script, which makes it string concatenation into a command line
# and not a variable reference. Everything a script needs arrives through `env:`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Granted per job, never here.
permissions: {}

env:
  GHCR_REGISTRY: ghcr.io
  # Docker Hub cannot represent `ghcr.io/<owner>/<repo>/<bin>` — it is a two-segment namespace,
  # so each service is its own repository under this account.
  DOCKERHUB_NAMESPACE: timschoenle
  # Kept in step with ci.yml's pin of the same tool; see the `renovate:` comment there.
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CONTAINER_STRUCTURE_TEST_VERSION: 1.22.1
  # Where the deployable chart lives. It is a separate repository on purpose: the chart releases
  # on its own cadence and its version is not this workspace's version.
  HELM_REPO: TimSchoenle/helm-charts
  CHART_PATH: charts/tankovault

jobs:
  release-please:
    name: Release Please
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create release commits and tags
      issues: write # to create release issues
      pull-requests: write # to open and maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # `tag_name` carries the `v` and `version` does not, and the two are *not* interchangeable
      # downstream: image tags are `vX.Y.Z`, a chart's `appVersion` is `X.Y.Z`.
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # A GitHub App token rather than `GITHUB_TOKEN`: pushes made with the default token do not
      # trigger workflows, so the release PR would never run CI and the required `ci` check
      # could never pass.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Narrowed to what release-please actually does (zizmor `github-app`): without these,
          # the minted token inherits every permission the app's installation holds, and this
          # job goes on to build and publish images — so the blast radius of anything reached
          # through that build was the release bot's full authority.
          #
          # `contents: write` commits the version bumps, the changelog and the tag;
          # `pull-requests: write` opens, updates and labels the release PR. Nothing else is
          # used: the token is consumed by the one step below, and the registry pushes
          # authenticate with `GITHUB_TOKEN` and the Docker Hub secrets instead.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.generate_token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Which images this release has to publish, and which are already published and stay where they
  # are. Everything downstream is a matrix over `images`.
  plan:
    name: plan the image set
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    # Required, not decorative: `DOCKERHUB_*` are `release` environment secrets, and a job that
    # omits the environment reads them as empty strings — `docker/login-action` then reports
    # "Username and password required" without naming the cause.
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out the tree and diff it against each image's published tag
    outputs:
      images: ${{ steps.plan.outputs.images }}
      service_bins: ${{ steps.plan.outputs.service_bins }}
      any: ${{ steps.plan.outputs.any }}
    env:
      # This job builds one short-lived command-line program and throws the tree away; debug info
      # and incremental artefacts are pure cost here. See the toolchain step for why there is no
      # compilation cache to make them worth keeping.
      CARGO_PROFILE_DEV_DEBUG: none
      CARGO_INCREMENTAL: 0
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # `fetch-depth: 0` for the tags and the history: the planner diffs each image from the tag
      # it is published at, which a shallow clone does not contain.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: resolve the toolchain from its manifest
        id: toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo '::error::no channel = "…" line in rust-toolchain.toml'
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # No `Swatinem/rust-cache` here, deliberately, and it is the one place in this workflow
      # where that costs something: `xtask` reaches the API crate, so building it compiles most of
      # the backend from cold on every release. A cache would fix that and would also be a
      # writable input to the job that decides what a signed release publishes — which is the
      # cache-poisoning class zizmor audits for, in the one workflow that holds `packages: write`
      # and `id-token: write`. Debug info is dropped instead, which is most of a dev-profile
      # build's cost and none of its meaning for a program that prints three lines and exits.
      - name: BoringSSL build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Docker Hub rather than GHCR because the chart pins Docker Hub, so that is the registry
      # whose tag set has to be the record of what is published.
      - name: log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # For each deployable binary, the newest release tag that actually exists in the registry.
      # Since an unchanged service is not republished, a service's tag set *is* the list of
      # releases that changed it, and its newest tag is the commit its published image was built
      # from — which is exactly the base its next diff has to start at.
      #
      # The tag this run just created is skipped: nothing has been pushed to it yet, and the
      # failed inspect would cost a round trip per image. A binary that resolves to nothing is
      # left out of the document entirely, which the planner reads as "never published, rebuild".
      - name: resolve each image's published tag
        id: bases
        if: vars.RELEASE_REBUILD_ALL != 'true'
        env:
          RELEASING: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # `--all` here is not a decision, it is how the deployable set is asked for: the planner
          # derives it from the Dockerfile's SERVICE_BINS minus the deploy blacklist, so no list
          # of the services exists in this file. `GITHUB_OUTPUT` is redirected because this call
          # is a query — only the step below may set the job's outputs.
          bins=$(GITHUB_OUTPUT=/dev/null cargo run -q -p xtask -- release-plan --all | sed -n 's/^service_bins=//p')
          # No `| head`: under `pipefail` an early-exiting reader SIGPIPEs `git tag` and turns a
          # successful read into a failed step. The probe budget below is a counter instead.
          tags=$(git tag --list 'v*' --sort=-v:refname)
          bases='{}'
          for bin in ${bins}; do
            probed=0
            for tag in ${tags}; do
              # Nothing has been pushed to the tag this run just created, so probing it would cost
              # one failed round trip per image and tell us nothing.
              if [ "$tag" = "$RELEASING" ]; then
                continue
              fi
              probed=$((probed + 1))
              if [ "$probed" -gt 25 ]; then
                echo "::warning::no published image found for ${bin} in the last ${probed} tags; it will be rebuilt"
                break
              fi
              if docker buildx imagetools inspect \
                   "docker.io/${DOCKERHUB_NAMESPACE}/tankovault-${bin}:${tag}" >/dev/null 2>&1; then
                bases=$(printf '%s' "$bases" | jq -c --arg bin "$bin" --arg tag "$tag" '. + {($bin): $tag}')
                echo "::notice::${bin} is published at ${tag}"
                break
              fi
            done
          done
          printf '%s' "$bases" > "${RUNNER_TEMP}/bases.json"
          echo "::notice::bases: ${bases}"

      # `--all` short-circuits the diff entirely, for the release where the decision cannot be
      # trusted and every image has to be rebuilt by hand.
      - name: decide which images to publish
        id: plan
        env:
          REBUILD_ALL: ${{ vars.RELEASE_REBUILD_ALL }}
        run: |
          set -euo pipefail
          if [ "$REBUILD_ALL" = "true" ]; then
            cargo run -q -p xtask -- release-plan --all
          else
            cargo run -q -p xtask -- release-plan "${RUNNER_TEMP}/bases.json"
          fi

  # The warm-up the legs below are built on, one per architecture — the same job
  # `ci.yml`'s `docker-deps` is, at the release commit, and it exists for the same reason: `cook`
  # and `builder` are the entire wall clock of an image build and `builder` takes no `ARG BIN`, so
  # one compile per architecture serves all nine images.
  #
  # Without it every leg re-ran `builder` independently. `ci.yml`'s `backend-deps-<arch>` is
  # written at the *previous* `main` commit, and the release commit changes `Cargo.toml`,
  # `Cargo.lock` and `CHANGELOG.md` — so `COPY . .` inside `builder` misses and the whole workspace
  # is compiled again. Eighteen times, in parallel, where two would do.
  #
  # `cargo chef`'s recipe masks local package versions (it rewrites them to `0.0.1`), which is why
  # importing the pre-bump `backend-deps-<arch>` is still worth doing: the `cook` layer is
  # version-invariant and hits, so this job's real work is the workspace compile alone.
  #
  # Its own tag, not `backend-deps-<arch>`: `ci.yml` fires on this same push and its `docker-deps`
  # exports to that tag concurrently. Sharing one would be the write race the `docker-deps`
  # comment describes, and a release build must not be able to poison what CI reads.
  #
  # These tags live in GHCR rather than the Actions cache; `ci.yml`'s `docker-deps` carries the
  # reasoning, and the two files have to agree because they read each other's tags.
  release-deps:
    name: warm the build cache (${{ matrix.arch }})
    needs: [release-please, plan]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.plan.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read # to check out the build context
      packages: write # to export the layer cache to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Shell-computed for the case folding the `params` step below documents.
      - name: resolve the buildkit cache repository
        id: buildcache
        run: echo "ref=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}/buildcache" >> "$GITHUB_OUTPUT"

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive SOURCE_DATE_EPOCH
        id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Build args and `platforms` must match the legs below exactly, or they look up a key this
      # never wrote — `SERVICE_BINS` included, which is why all three read the same `plan` output.
      # `BIN` is deliberately absent: no stage up to `builder` reads it, which is what makes one
      # warm-up serve every planned image.
      - name: cook dependency graph and compile the planned binaries
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SERVICE_BINS=${{ needs.plan.outputs.service_bins }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          target: builder
          push: false
          outputs: type=cacheonly
          provenance: false
          cache-from: |
            type=registry,ref=${{ steps.buildcache.outputs.ref }}:release-deps-${{ matrix.arch }}
            type=registry,ref=${{ steps.buildcache.outputs.ref }}:backend-deps-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.buildcache.outputs.ref }}:release-deps-${{ matrix.arch }},mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true

  # One leg per (image, architecture). Both architectures build **natively**: `wreq` compiles
  # BoringSSL from C/C++/assembly and an emulated build of it costs upwards of an hour per
  # image, which is why there is no QEMU here and `ci.yml` says the same thing about its own
  # arm64 job.
  #
  # Each leg pushes *by digest only* — no tag — to both registries. The tags
  # are applied once, by the `manifest` job below, to a manifest list referencing both digests.
  # That is what makes `:v1.2.3` a single multi-architecture reference rather than whichever
  # architecture happened to push last.
  #
  # The matrix is `plan`'s output rather than a literal: that is what holds the published set to
  # the Dockerfile's `SERVICE_BINS` minus the deploy blacklist
  # (`[workspace.metadata.deploy.exclude]`, root `Cargo.toml`), which is where `xtask` is excluded.
  # `repo-lint` fails if this file names its images literally again, because a literal would
  # publish a hand-maintained list while every other gate stayed green.
  build:
    name: ${{ matrix.bin }} (${{ matrix.arch }})
    needs: [release-please, plan, release-deps]
    # `!cancelled() && !failure()` rather than the bare output test: an explicit `if:` replaces the
    # implicit `success()`, so the bare form would publish images from a run whose warm-up failed.
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release_created == 'true' && needs.plan.outputs.any == 'true' }}
    environment:
      name: release
      deployment: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read # to check out the build context
      packages: write # to push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        bin: ${{ fromJSON(needs.plan.outputs.images) }}
        arch: [amd64, arm64]
        # `include` entries that name only `arch` are merged into every combination with that
        # arch, which is how the runner label is attached without enumerating every leg.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The build target and structure-test contract are derived from the binary name in one
      # `case`, deliberately, rather than as inline `${{ a == b && x || y }}` expressions
      # repeated at each use site — which is exactly how the three got out of step before.
      - name: resolve image parameters
        id: params
        env:
          BIN: ${{ matrix.bin }}
        run: |
          case "$BIN" in
            render)   target=runtime-browser; cst=render ;;
            frontend) target=frontend;        cst=frontend ;;
            *)        target=runtime;         cst=service ;;
          esac
          {
            echo "target=${target}"
            echo "cst=${cst}"
            echo "dockerhub=${DOCKERHUB_NAMESPACE}/tankovault-${BIN}"
            echo "ghcr=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}/${BIN}"
            echo "buildcache=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}/buildcache"
          } >> "$GITHUB_OUTPUT"
        # `,,` folds the case: GHCR rejects an uppercase path and `GITHUB_REPOSITORY` carries the
        # account's own casing (`TimSchoenle/TankoVault`). Workflow expressions have no lowercase
        # function, which is why every GHCR reference in this file reads a shell-computed output
        # rather than `${{ github.repository }}` directly.

      # Clamps image layer mtimes to the commit timestamp so a rebuild of the same commit is
      # byte-identical. A step output rather than `$GITHUB_ENV`, which is a mutable channel
      # between steps and the thing zizmor's `github-env` audit is about.
      - name: derive SOURCE_DATE_EPOCH
        id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built and contract-checked *before* it is pushed, in two `build-push-action` calls rather
      # than one. The second call is a cache hit against the same buildkit instance — it re-exports
      # and uploads, it does not recompile — so the cost of the split is an upload, and what it
      # buys is that nothing reaches a registry until `container-structure-test` has passed
      # against the exact artefact.
      #
      # This is not redundant with `ci.yml`, which is the reason it survives here: `ci.yml`'s
      # arm64 job covers `api` and `render` only, so these legs are the only place the other
      # seven images have their arm64 contract checked.
      #
      # `load` is possible only because both legs are native — there is no cross-architecture
      # image to hand to the local daemon.
      - name: build ${{ matrix.bin }} (${{ matrix.arch }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ steps.params.outputs.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BIN=${{ matrix.bin }}
            SERVICE_BINS=${{ needs.plan.outputs.service_bins }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          push: false
          load: true
          tags: tankovault-${{ matrix.bin }}:release-${{ matrix.arch }}
          provenance: false
          # `release-deps-<arch>` first: it is this commit's `builder`, so the leg's remaining work
          # is the `COPY`s onto `scratch`. `backend-deps-<arch>` stays as the fallback for the
          # layers the warm-up itself imported rather than rebuilt.
          cache-from: |
            type=registry,ref=${{ steps.params.outputs.buildcache }}:release-deps-${{ matrix.arch }}
            type=registry,ref=${{ steps.params.outputs.buildcache }}:backend-deps-${{ matrix.arch }}
            ${{ matrix.bin == 'frontend' && format('type=registry,ref={0}:frontend-deps-{1}', steps.params.outputs.buildcache, matrix.arch) || '' }}

      - name: install container-structure-test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CONTAINER_STRUCTURE_TEST_VERSION}"
          asset="container-structure-test-linux-${ARCH}"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${asset}" -O "${base}/checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum -c -
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/container-structure-test

      # Two configs: the image's own contract plus the musl loader assertion, whose path is the
      # one part of the contract that differs by architecture.
      - name: structure-test ${{ matrix.bin }} (${{ matrix.arch }})
        env:
          IMAGE: tankovault-${{ matrix.bin }}:release-${{ matrix.arch }}
          CST_CONFIG: deploy/docker/cst/${{ steps.params.outputs.cst }}.yaml
          LOADER_CONFIG: deploy/docker/cst/loader-${{ matrix.arch }}.yaml
        run: |
          container-structure-test test \
            --image "$IMAGE" \
            --config "$CST_CONFIG" \
            --config "$LOADER_CONFIG"

      # Two `type=image` exporters in one build, so the layers are uploaded to both registries
      # from one pass. The manifest digest is content-addressed, so it is the *same* digest in
      # both — which is why the `manifest` job can use one digest file to assemble the list in
      # either registry.
      - name: push ${{ matrix.bin }} (${{ matrix.arch }}) by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ steps.params.outputs.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BIN=${{ matrix.bin }}
            SERVICE_BINS=${{ needs.plan.outputs.service_bins }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          outputs: |
            type=image,name=docker.io/${{ steps.params.outputs.dockerhub }},push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ steps.params.outputs.ghcr }},push-by-digest=true,name-canonical=true,push=true
          # `provenance: false` matches ci.yml and is a deliberate reproducibility trade: an
          # attestation layer carries build timestamps, which breaks byte-identical rebuilds.
          # The SBOM attested in the `manifest` job compensates.
          provenance: false
          # Read only, and the same three tags as the step above — this is a hit against the
          # local buildkit instance, so it re-exports and uploads rather than recompiling. Nine
          # legs exporting `mode=max` would each re-upload the whole imported layer chain into a
          # tag CI also reads, and a release build is the one build that must not poison that.
          cache-from: |
            type=registry,ref=${{ steps.params.outputs.buildcache }}:release-deps-${{ matrix.arch }}
            type=registry,ref=${{ steps.params.outputs.buildcache }}:backend-deps-${{ matrix.arch }}
            ${{ matrix.bin == 'frontend' && format('type=registry,ref={0}:frontend-deps-{1}', steps.params.outputs.buildcache, matrix.arch) || '' }}

      # The digest is what the `manifest` job assembles the list from. Written as an empty file
      # *named* for the digest, which is the conventional shape: artifact merging then yields one
      # directory whose filenames are exactly the digests to reference.
      - name: export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.bin }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One job per image: assemble the two per-architecture digests into a manifest list in each
  # registry, then sign and attest what was actually published.
  manifest:
    name: publish ${{ matrix.bin }}
    needs: [release-please, plan, build]
    # Same reason as `build`: a bare output test replaces the implicit `success()`, so with
    # `fail-fast: false` above a single failed leg still reached this job — and `imagetools create`
    # over whichever digests *did* upload publishes `:vX.Y.Z` as a single-architecture manifest
    # list. Tagging a half-built release is worse than not tagging one.
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release_created == 'true' && needs.plan.outputs.any == 'true' }}
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to check out (the SBOM step reads the repository)
      packages: write # to push the manifest list to ghcr.io
      id-token: write # cosign keyless (Fulcio/Rekor via the OIDC token)
    strategy:
      fail-fast: false
      matrix:
        bin: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: download this image's digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.bin }}-*
          merge-multiple: true

      # Both names resolved once, for the same reason the `build` job resolves them in a shell
      # step: the GHCR path has to be case-folded and no expression function can do it.
      - name: resolve image names
        id: names
        env:
          BIN: ${{ matrix.bin }}
        run: |
          {
            echo "dockerhub=${DOCKERHUB_NAMESPACE}/tankovault-${BIN}"
            echo "ghcr=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}/${BIN}"
          } >> "$GITHUB_OUTPUT"

      - name: image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.names.outputs.dockerhub }}
            ${{ steps.names.outputs.ghcr }}
          # release-please already decided the version; `type=raw` off its tag is the single
          # source of truth. `latest` follows it because every release-please release is a real
          # semver release on the default branch.
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}

      # `imagetools create` takes the tag set and the source digests and writes one manifest
      # list per tag. `metadata-action` emits every tag for both registries, and each
      # `--tag` is applied to the list built from the same two digests — the digests are
      # content-addressed and therefore identical in both registries.
      - name: create the manifest lists
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            sources=""
            for d in *; do
              sources="${sources} ${image}@sha256:${d}"
            done
            tag_args=""
            for tag in ${TAGS}; do
              case "$tag" in
                "${image}:"*) tag_args="${tag_args} --tag ${tag}" ;;
              esac
            done
            # shellcheck disable=SC2086 -- word splitting is how the accumulated
            # strings become separate arguments; none of the values contain whitespace.
            docker buildx imagetools create ${tag_args} ${sources}
          done

      # Resolve the manifest **list** digest after creation. This is what gets signed: signing a
      # per-architecture digest would leave the tag most people actually pull unverifiable.
      - name: resolve the manifest list digests
        id: digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          dockerhub=$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${TAG}" --format '{{println .Manifest.Digest}}' | head -n1)
          ghcr=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}" --format '{{println .Manifest.Digest}}' | head -n1)
          {
            echo "dockerhub=${dockerhub}"
            echo "ghcr=${ghcr}"
          } >> "$GITHUB_OUTPUT"

      # Handed to `helm-release` as an artifact, not a job output: this is a matrix of nine and
      # `outputs` on a matrix job is last-writer-wins, so nine legs would deliver one digest.
      #
      # The Docker Hub digest is the one exported, because the chart's `repository` values name
      # Docker Hub (`timschoenle/tankovault-<bin>`). Both registries hold the same list digest —
      # a manifest list is content-addressed and both were assembled from the same two
      # per-architecture digests — but a chart must pin the registry it actually pulls from.
      - name: export the manifest list digest
        env:
          BIN: ${{ matrix.bin }}
          DIGEST: ${{ steps.digests.outputs.dockerhub }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/list-digests
          printf '%s' "$DIGEST" > "/tmp/list-digests/${BIN}"

      - name: upload the manifest list digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: list-digest-${{ matrix.bin }}
          path: /tmp/list-digests/*
          if-no-files-found: error
          retention-days: 1

      # A `scratch` image defeats every package-manager-based scanner: there is no apt/apk
      # database, so a running container cannot be mapped back to its dependency set at all.
      # Syft reads the Rust binary's own metadata instead, which is the only way these images
      # become scannable after the fact.
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.names.outputs.ghcr }}:${{ needs.release-please.outputs.tag_name }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.bin }}.spdx.json
          output-file: sbom-${{ matrix.bin }}.spdx.json

      - name: attach the SBOM to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.bin }}
          path: sbom-${{ matrix.bin }}.spdx.json
          retention-days: 90

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the identity is this workflow's OIDC token, recorded in Rekor. No private key
      # to store, rotate or leak — and verification names the workflow that produced the image
      # rather than "whoever held the key". `--recursive` also signs the per-architecture images
      # the list references, not only the list itself.
      - name: sign the published digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB_DIGEST: ${{ steps.digests.outputs.dockerhub }}
          GHCR_DIGEST: ${{ steps.digests.outputs.ghcr }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}"
          cosign sign --yes --recursive "${GHCR_IMAGE}@${GHCR_DIGEST}"

      - name: attest the SBOM against the published digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.names.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB_DIGEST: ${{ steps.digests.outputs.dockerhub }}
          GHCR_DIGEST: ${{ steps.digests.outputs.ghcr }}
          SBOM: sbom-${{ matrix.bin }}.spdx.json
        run: |
          set -euo pipefail
          cosign attest --yes --predicate "$SBOM" --type spdxjson "${DOCKERHUB_IMAGE}@${DOCKERHUB_DIGEST}"
          cosign attest --yes --predicate "$SBOM" --type spdxjson "${GHCR_IMAGE}@${GHCR_DIGEST}"

  # The hand-off to the deployable chart: pin the services this run published in
  # `TimSchoenle/helm-charts` to their new digests, and open a pull request there. It is a pull
  # request and not a push because the chart repository gates its own releases — this job
  # proposes, that repository decides.
  #
  # It runs after `manifest` and not after `build` deliberately: what a chart pins must be a
  # digest that is signed and SBOM-attested, and `manifest` is where both happen.
  #
  # Only the published services appear in `images`. The action updates the keys it is given and
  # leaves the rest of `values.yaml` untouched, so a service that did not change keeps the exact
  # `tag@digest` string it already had — which is what keeps its Deployment from rolling. The
  # chart therefore carries a mix of versions on purpose; every entry is digest-pinned, so the
  # mix is a record of when each service last changed rather than a drift.
  helm-release:
    name: Helm Release
    needs: [release-please, plan, manifest]
    # Same guard as `build` and `manifest`. With `fail-fast: false` on `manifest`, a bare output
    # test would let one failed leg through and this job would then propose a chart bump that
    # claims a release which is missing one of its services. The digest count is checked against
    # the plan below for the same reason, since `!failure()` alone no longer implies a full set.
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release_created == 'true' && needs.plan.outputs.any == 'true' }}
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing here uses `GITHUB_TOKEN`: the artifacts belong to this same run, which the runner's
    # own token covers, and the chart pull request is made with a token the action mints for the
    # *charts* repository from the release bot's credentials.
    permissions: {}
    outputs:
      pr_url: ${{ steps.chart.outputs.pr-url }}
      chart_version: ${{ steps.chart.outputs.chart-version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: download every published manifest list digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/list-digests
          pattern: list-digest-*
          merge-multiple: true

      # The values key is *derived* from the binary name rather than read from a table, so that
      # adding a service does not also require editing a mapping here that nothing checks. The
      # image set itself comes from `plan`, which reads the Dockerfile and the deploy blacklist;
      # a hand-maintained list of the services here would sit outside everything that keeps them
      # in step.
      #
      # The chart nests the long-running services under `services.` and camel-cases their names;
      # `bootstrap` is a one-shot job and sits at the top level. A key that does not already exist
      # in `values.yaml` is an error in the action, so a naming drift fails loudly there.
      - name: map each published digest onto its chart values key
        id: images
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          PLANNED: ${{ needs.plan.outputs.images }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/list-digests/*)
          expected=$(printf '%s' "$PLANNED" | jq 'length')
          # The plan is what says how many services this release publishes, so it is what the
          # digest set has to match. Fewer means a `manifest` leg produced nothing and the chart
          # would be bumped to a version whose image set is incomplete; more means the artifact
          # pattern is picking up something this run did not plan.
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::planned ${expected} image(s) but downloaded ${#files[@]} digest(s); a chart bump from a partial publish would claim a release that was never built"
            exit 1
          fi
          images=$(
            for file in "${files[@]}"; do
              bin=$(basename "$file")
              digest=$(cat "$file")
              case "$digest" in
                sha256:*) ;;
                *) echo "::error::'${bin}' exported '${digest}', which is not a digest" >&2; exit 1 ;;
              esac
              case "$bin" in
                bootstrap) key="bootstrap.image.tag" ;;
                *) key="services.$(printf '%s' "$bin" | sed -E 's/-(.)/\U\1/g').image.tag" ;;
              esac
              jq -n --arg key "$key" --arg tag "$TAG" --arg digest "$digest" \
                '{($key): {tag: $tag, digest: $digest}}'
            done | jq -sc 'add'
          )
          echo "json=${images}" >> "$GITHUB_OUTPUT"

      - name: open the chart update pull request
        id: chart
        uses: TimSchoenle/actions/actions/helm/update-chart-version@a9b52e270a60b696cb1c90f996f01977bf27a7c1 # tag=actions-helm-update-chart-version-v1.6.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.HELM_REPO }}
          chart-path: ${{ env.CHART_PATH }}
          images: ${{ steps.images.outputs.json }}
          # `Chart.yaml` records `appVersion` without the `v` its image tags carry, so this is the
          # one place `version` is correct and `tag_name` is not.
          app-version: ${{ needs.release-please.outputs.version }}
          # Explicit rather than left to the action's default: an application release does not
          # change the chart's templates, so it is a patch of the chart regardless of whether the
          # application bumped a major. A chart change is the chart repository's own release.
          version-bump: patch
          # The action sanitizes this — mentions and issue-closing keywords are neutralized — so
          # the release notes can be carried across repositories without the chart pull request
          # cross-linking or closing anything in this one.
          changelog: ${{ needs.release-please.outputs.body }}

  # `always()`, so a release that tagged but failed to publish still gets a summary — which is the
  # reason the text below branches on `manifest`'s result rather than asserting the images
  # shipped. It ran on `always()` and claimed a full publish unconditionally, so every way the
  # build path can fail produced a green-sounding summary under a tag with nothing behind it.
  #
  # It also names which images were *not* published. With a narrowed release that is the only
  # place the decision is visible: a reader has to be able to tell "notifier was unchanged" from
  # "notifier was supposed to be built and silently was not".
  summary:
    name: release summary
    needs: [release-please, plan, release-deps, build, manifest, helm-release]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: write the summary
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          DOCKERHUB_NS: ${{ env.DOCKERHUB_NAMESPACE }}
          PLANNED: ${{ needs.plan.outputs.images }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PUBLISHED: ${{ needs.manifest.result }}
          CHART: ${{ needs.helm-release.result }}
          CHART_PR: ${{ needs.helm-release.outputs.pr_url }}
          CHART_VERSION: ${{ needs.helm-release.outputs.chart_version }}
        run: |
          # Case-folded to match what was actually pushed; see the `build` job's `params` step.
          GHCR_PREFIX="${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}"
          count=$(printf '%s' "${PLANNED:-[]}" | jq 'length' 2>/dev/null || echo 0)
          names=$(printf '%s' "${PLANNED:-[]}" | jq -r 'join(", ")' 2>/dev/null || echo '')
          {
            echo "## Release ${TAG}"
            echo
            if [ "$PLAN_RESULT" != "success" ]; then
              echo "Planning reported \`${PLAN_RESULT}\` — **nothing was published for this tag**."
              echo "Read the \`plan\` job before re-running."
            elif [ "$count" -eq 0 ]; then
              echo "**No image changed in this release.** Nothing was rebuilt, nothing was"
              echo "republished, and no chart update was opened: every service stays on the digest"
              echo "it was already deployed at, and the tag records the changelog alone."
            elif [ "$PUBLISHED" != "success" ]; then
              echo "The tag exists, but publishing reported \`${PUBLISHED}\` — **the ${count} planned"
              echo "image(s) were not all published**. Read the failed jobs in this run before"
              echo "re-running; a partially pushed digest set is not a release."
            else
              echo "${count} image(s) **published** as \`linux/amd64\` + \`linux/arm64\` manifest lists:"
              echo
              echo "\`${names}\`"
              echo
              echo "to \`docker.io/${DOCKERHUB_NS}/tankovault-*\` and \`${GHCR_PREFIX}/*\`."
              echo
              echo "Every other service was unchanged, so it was not rebuilt and carries no"
              echo "\`${TAG}\` tag — its published digest, and the chart entry pinning it, are"
              echo "unchanged and its Deployment will not roll."
              echo
              echo "Each published image was structure-tested before it was pushed, signed with"
              echo "cosign (keyless) and SBOM-attested against the published digest."
              echo
              echo "Licensed under PolyForm Noncommercial 1.0.0 — the terms ship inside every image"
              echo "at \`/LICENSE\`. Commercial use needs a separate licence from the copyright holder."
              echo
              echo "SBOMs are attached to this run as artifacts (one per published image, SPDX JSON)."
            fi
            echo
            # Reported separately from the publish: the chart bump can fail on its own — a rejected
            # token, a values key the chart renamed — and that leaves published images with nothing
            # deploying them, which is invisible from this repository otherwise.
            case "$CHART" in
              success) echo "Chart bump to \`${CHART_VERSION}\` proposed: ${CHART_PR}" ;;
              skipped) echo "No chart bump was attempted (nothing was published, or publishing did not complete)." ;;
              *)       echo "The chart bump reported \`${CHART}\` — **the images are published but"
                       echo "no chart update was opened**. Re-run this job, or bump the chart by hand." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
