[package]
name = "tankovault-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "SQLx repositories and migrations for TankoVault."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[dependencies]
# `sqlx` feature: derives `sqlx::Type` on the domain enums so the checked query
# macros can bind/decode them as their native Postgres enum types.
tankovault-domain = { workspace = true, features = ["sqlx"] }
tankovault-config = { workspace = true }
tankovault-matcher = { workspace = true }
sqlx = { workspace = true }
# For `try_join!` only, so the browse page and its match count overlap on the hottest public
# route instead of costing two serial round trips. `sqlx`'s `runtime-tokio` feature already
# puts tokio in the graph; this is a direct edge for the macro, not a new dependency.
tokio = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Opt-in: the DB-backed repo tests need Docker (an ephemeral Postgres via the harness). Off by
# default so `cargo test -p tankovault-db` stays fast and DB-free for contributors without it.
integration = []

[dev-dependencies]
tankovault-test-support = { path = "../test-support" }
tokio = { workspace = true }
# Integration tests do not inherit the crate's own dependencies. The privacy suite reads the
# live schema out of `information_schema` and seeds fixtures directly, so it needs these.
sqlx = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
