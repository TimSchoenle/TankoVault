# Derived series over the metrics the services emit, named `level:metric:operations`
# (Prometheus convention): `job` is the aggregation level since metrics carry no service label.
#
# Buckets, not quantiles: `http_request_duration_seconds` uses explicit bucket boundaries so these
# rules can `sum by (job, le)` across replicas before taking the quantile — quantiles can't be
# averaged, buckets can. Keep `sum by (..., le)` inside every `histogram_quantile` below.
#
# Ratio rules divide two rates and are NaN while the denominator is zero, so an idle service
# records a gap rather than a fabricated 0 — every comparison against NaN is false, so an idle
# service cannot trip a threshold alert.

groups:
  - name: tankovault-http-recording
    interval: 30s
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (job) (rate(http_requests_total[5m]))

      - record: job_route:http_requests:rate5m
        expr: sum by (job, route) (rate(http_requests_total[5m]))

      # `status` is the exact numeric code, not a class, so the class split happens here.
      - record: job:http_requests_server_errors:rate5m
        expr: sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))

      - record: job:http_requests_client_errors:rate5m
        expr: sum by (job) (rate(http_requests_total{status=~"4.."}[5m]))

      - record: job:http_requests_server_errors:ratio_rate5m
        expr: job:http_requests_server_errors:rate5m / job:http_requests:rate5m

      - record: job_route:http_requests_server_errors:rate5m
        expr: sum by (job, route) (rate(http_requests_total{status=~"5.."}[5m]))

      # 429 (rate limiter) and 404 (feature gate) are policy answers, not defects; kept as their
      # own series so the client-error panel doesn't read a switched-off feature as a broken client.
      - record: job:http_requests_throttled:rate5m
        expr: sum by (job) (rate(http_requests_total{status="429"}[5m]))

      - record: job:http_request_duration_seconds:p50_5m
        expr: >-
          histogram_quantile(0.50,
            sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

      - record: job:http_request_duration_seconds:p95_5m
        expr: >-
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

      - record: job:http_request_duration_seconds:p99_5m
        expr: >-
          histogram_quantile(0.99,
            sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))

      # /v1/me/stream excluded: a server-closed SSE stream (api restart, NATS loss) records a
      # multi-minute duration in the +Inf bucket and poisons every quantile for the api job.
      - record: job_route:http_request_duration_seconds:p95_5m
        expr: >-
          histogram_quantile(0.95,
            sum by (job, route, le) (
              rate(http_request_duration_seconds_bucket{route!="/v1/me/stream"}[5m])))

      # Not alerted on: an open SSE stream is one request in flight for its whole life, so this
      # tracks "browsers with the app open" as much as load (see docs/OBSERVABILITY.md).
      - record: job:http_requests_in_flight:avg
        expr: avg by (job) (http_requests_in_flight)

  - name: tankovault-edge-policy-recording
    interval: 30s
    rules:
      - record: job_class:http_rate_limited:rate5m
        expr: sum by (job, class) (rate(http_rate_limited_total[5m]))

      # The Redis limiter backend fails open by design: while this is non-zero, configured limits
      # are not being enforced at all.
      - record: job_backend:rate_limit_store_errors:rate5m
        expr: sum by (job, backend) (rate(rate_limit_store_errors_total[5m]))

      - record: job_feature:http_feature_disabled:rate15m
        expr: sum by (job, feature) (rate(http_feature_disabled_total[15m]))

  # scan_tasks_served_total{provider,scan} counts tasks handed out, so a redelivered task counts
  # again — see the retry caveat in docs/OBSERVABILITY.md.
  - name: tankovault-scan-recording
    interval: 30s
    rules:
      - record: provider_scan:scan_tasks_served:rate5m
        expr: sum by (provider, scan) (rate(scan_tasks_served_total[5m]))

      - record: scan:scan_tasks_served:rate15m
        expr: sum by (scan) (rate(scan_tasks_served_total[15m]))

      - record: provider:scan_tasks_served:increase1h
        expr: sum by (provider) (increase(scan_tasks_served_total[1h]))

      # jetstream_consumer_num_pending is a durable consumer's undelivered backlog; the relabelling
      # in prometheus.yml splits it into provider/scan to sit next to the throughput series above.
      - record: provider_scan:scan_queue_depth:current
        expr: >-
          sum by (provider, scan) (
            jetstream_consumer_num_pending{stream_name="TANKOVAULT_TASKS", scan!=""})

      - record: scan:scan_queue_depth:sum
        expr: sum by (scan) (provider_scan:scan_queue_depth:current)

      # MAX_TASK_DELIVERIES is 3, so a lane holding redelivered messages continuously is failing,
      # not hiccupping. Closest available signal to broker-side retry-versus-settle.
      - record: provider_scan:scan_tasks_redelivered:current
        expr: >-
          sum by (provider, scan) (
            jetstream_consumer_num_redelivered{stream_name="TANKOVAULT_TASKS", scan!=""})

      # The notifier acks only after fan-out, so a hanging channel shows up here as a queue that
      # stops draining.
      - record: consumer:events_queue_depth:current
        expr: >-
          sum by (consumer_name) (
            jetstream_consumer_num_pending{stream_name="TANKOVAULT_EVENTS"})

      # Round-robin fairness (OPERATIONS.md §7) predicts this tracks the number of providers with
      # work; one lane climbing alone is the signature of lanes that failed to open.
      - record: scan:active_provider_lanes:count30m
        expr: count by (scan) (sum by (provider, scan) (increase(scan_tasks_served_total[30m])) > 0)

  # solve_attempts_total is emitted by the shared handler (crates/solver/src/http.rs) that both
  # challenge-solver and render mount — hence the job dimension on every rule here.
  - name: tankovault-fetch-tier-recording
    interval: 30s
    rules:
      - record: job_result:solve_attempts:rate5m
        expr: sum by (job, result) (rate(solve_attempts_total[5m]))

      - record: job:solve_attempts_errors:ratio_rate15m
        expr: >-
          sum by (job) (rate(solve_attempts_total{result="error"}[15m]))
            / sum by (job) (rate(solve_attempts_total[15m]))

      - record: job_result:render_requests:rate5m
        expr: sum by (job, result) (rate(render_requests_total[5m]))

      - record: job:render_requests_errors:ratio_rate15m
        expr: >-
          sum by (job) (rate(render_requests_total{result="error"}[15m]))
            / sum by (job) (rate(render_requests_total[15m]))

      # Kept as two series, not one summed: render mounts both handlers, but challenge-solver
      # emits only the first, so any or/+ combination would drop one side.
      - record: job:solve_targets_refused:increase15m
        expr: sum by (job) (increase(solve_attempts_total{result="rejected"}[15m]))

      - record: job:render_targets_refused:increase15m
        expr: sum by (job) (increase(render_requests_total{result="rejected"}[15m]))

  - name: tankovault-fleet-recording
    interval: 30s
    rules:
      # worker is the only tier expected to exceed 1 (docker-compose.yml declares replicas: 2).
      - record: job:replicas:count
        expr: count by (job) (up{job!~"prometheus|readiness|blackbox-exporter"} == 1)

      - record: service:ready:min
        expr: min by (service) (probe_success{job="readiness"})
