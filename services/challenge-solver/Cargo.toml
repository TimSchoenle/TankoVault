[package]
name = "tankovault-challenge-solver"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Bot-management bypass tier: HTTP front over a pluggable ChallengeSolver."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[[bin]]
name = "challenge-solver"
path = "src/main.rs"

[dependencies]
tankovault-config = { workspace = true }
tankovault-service = { workspace = true }
# For the SSRF address policy only — see the note in services/render/Cargo.toml.
tankovault-domain = { workspace = true }
tokio-util = { workspace = true }
tankovault-solver = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }

[lints]
workspace = true
