# Created by openapi-to-rust init.
[generator]
spec_path = "openapi.json"
output_dir = "crates/api-client/src"
module_name = "generated"

[generator.builders]
enabled = true
threshold = 0

[features]
enable_async_client = true

[http_client]
base_url = "http://localhost/v1"

[http_client.auth]
type = "Bearer"
header_name = "Authorization"

[http_client.tracing]
enabled = false
