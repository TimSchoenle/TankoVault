# `cargo-audit` configuration, read by the `cargo-audit` CI job and by anyone running
# `cargo audit` locally.
#
# This file exists because `deny.toml` cannot do the job alone. `cargo deny check advisories`
# and `cargo audit` consult the same RustSec database but read *different* configuration:
# cargo-deny takes `[advisories] ignore` from `deny.toml`, cargo-audit takes it from here and
# never sees that file. Without this copy the reviewed exceptions would apply to one gate and not
# the other, leaving `cargo-audit` permanently red on advisories `cargo-deny` already accepts,
# which is the state in which a genuinely new advisory looks like the old ones.
#
# The list below must stay identical to `deny.toml`'s. That is not a convention: `xtask
# repo-lint` fails if the two diverge, in either direction. Add, date and justify an exception
# in both files or in neither.

[advisories]
ignore = [
    # RUSTSEC-2023-0071: Marvin timing sidechannel in `rsa` private-key operations, fixed in
    # 0.10.0. Two copies match: 0.9.10 from `jsonwebtoken`'s `rust_crypto` feature (no HMAC-only
    # alternative, no 0.10 release) and 0.10.0-rc.19 from `webauthn-rs-core` via `crypto-glue`
    # (a pre-release, so semver-below the fix). Not exploitable here: the server holds no RSA
    # private key. `crates/auth/src/token.rs` pins `Algorithm::HS256`, test-enforced, and WebAuthn
    # only verifies signatures against stored public keys. Reviewed 2026-11-23; re-review
    # 2027-02-23, or if HS256 stops being the only accepted algorithm or the server ever
    # decrypts or signs with an RSA key.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0387: timing variability in `crypto-bigint` 0.5.5, reached only through
    # `elliptic-curve` 0.13 (`p256`/`p384` 0.13 under `jsonwebtoken`'s `rust_crypto` feature).
    # `webauthn-rs-core` 0.6.2 is on `elliptic-curve` 0.14 and `crypto-bigint` 0.7.11, which is
    # patched. The fix is 0.7.6, which the 0.13 curve crates cannot take, so no compatible release
    # exists. Not exploitable here: JWTs are HS256-only (see RUSTSEC-2023-0071), so no secret
    # scalar ever passes through it. Reviewed 2026-11-23; re-review 2027-02-23, when
    # `elliptic-curve` 0.14 reaches `jsonwebtoken`, or if the server ever signs with an EC key.
    "RUSTSEC-2026-0387",

    # RUSTSEC-2026-0391, -0398, -0403: `zstd` 0.13 / `zstd-safe` 7, held there by `wreq-util`
    # 3.0.0-rc.14 (`^0.13.3`); the fixes are 0.14.3 / 8.2.0 only. Its sole use is decompressing
    # TLS certificates through `zstd::stream::read::Decoder::new`, which none of the three reach:
    # -0391 is only `with_context`, -0398 only the `seekable` feature (not enabled), and -0403 is
    # the write-side decoder, its advisory exempting `read::Decoder` by name. Reviewed
    # 2026-10-26; re-review 2027-01-26, when `wreq-util` moves to `zstd` 0.14, or if anything
    # else in the graph starts depending on `zstd` 0.13.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    # RUSTSEC-2026-0440: `astral-tokio-tar` is unmaintained; reached only through `testcontainers` in
    # the test-support crates. See `deny.toml` for the review.
    "RUSTSEC-2026-0440",
    # RUSTSEC-2026-0459: `libsqlite3-sys` is recorded in `Cargo.lock` through `sqlx`'s weak features
    # but never compiled; no crate enables `sqlite`. See `deny.toml` for the review.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2026-0543: `chrono` is unmaintained; recorded in `Cargo.lock` through `serde_with`'s
    # optional feature but never compiled. See `deny.toml` for the review.
    "RUSTSEC-2026-0543",
]
