name: auto-fix

# The **one** workflow that fixes a pull request mechanically and commits the result: both
# lockfiles, clippy's machine-applicable suggestions, `cargo fmt`, the four generated artefacts
# — in one job, in one commit — and `README.md`, rendered from its template in a job of its own.
#
# The dividing line for what belongs here is *determinism*, not convenience. Everything below has
# exactly one correct output given the tree, so a bot's answer is byte-identical to a human's and
# there is nothing to review in the diff it produces. What is deliberately absent is anything where
# the fix is a choice — see the note on `repo-lint` at the bottom of this file.
#
# ---------------------------------------------------------------------------------------------
# Why one workflow, and why it must stay one
# ---------------------------------------------------------------------------------------------
# This was three workflows — `auto-fix`, `auto-format` and `update-lockfile` — and the split was
# the bug. GitHub keeps at most *one* pending run per `concurrency.group`: a run arriving at a
# group that already has one running and one pending does not queue behind them, it cancels the
# pending one. Workflows that commit to the same branch must share a group or they race, so the
# split forced a choice between racing pushes and silently dropped runs.
#
# Both halves of that choice were paid for. All three shared `pr-autocommit-<pr>` until
# 2026-08-04, and on release 1.2.1 the lockfile sync was the run that got dropped: both
# `Cargo.lock` files and `openapi.json` merged to `main` still recording 1.2.0 against a 1.2.1
# manifest, and every `--locked` build failed, release images included. Moving `update-lockfile`
# to its own group left two members, which is no better in kind — release 1.3.0 (#76)
# force-pushed twice in 33 seconds, `auto-fix` was cancelled on both events, `auto-format` took
# the surviving slot, and `test (workspace)` failed with `openapi.json is out of date` on a
# branch whose author had no command to run.
#
# Which of the two survived was decided by run-creation order: nothing a reader of these files
# can see, and nothing that reports a failure — a dropped run is `cancelled`, exactly like one
# superseded on purpose. One workflow in the group removes the choice rather than tuning it, and
# `repo-lint`'s `concurrency-groups-hold-one-workflow` fails if a second one ever joins.
#
# The cost is real and accepted: `auto-format` finished in about a minute where this job compiles
# the workspace for `clippy --fix`, so a pull request whose only problem is formatting waits for
# the whole run. A slower fix that always happens beats a fast one that a sibling can cancel.
#
# Accepted is not the same as unmeasured. That cost was twenty-odd minutes until 2026-08-05, and
# almost none of it was work: the `clippy --fix` step's flags disagreed with the cache the job
# restores, so it rebuilt the entire dependency graph every run — see that step for the numbers.
#
# ---------------------------------------------------------------------------------------------
# What it fixes, and why a bot may
# ---------------------------------------------------------------------------------------------
# Five things here are generated, committed, and must not be hand-edited: `openapi.json`,
# `crates/api-client/src/lib.rs`, `THIRD-PARTY-NOTICES` (ENGINEERING_GUIDE rule 6),
# `web/frontend/assets/main.css` (Tailwind output, committed so a build without Node works) and
# `docs/contracts/*.json` (the configuration contract each image publishes). Four CI jobs —
# `openapi --check`, `notices drift`, `config contract drift` and `tailwind output is current` —
# fail when they drift, but none fixes anything, so the failure is a red gate waiting on a human
# to run a command whose output is fully determined by the tree.
#
# The contracts have one half this job deliberately does *not* fix: the three-line `LABEL` regions
# in `deploy/docker/Dockerfile`. `just contract-json` writes the documents alone; `just regenerate`
# would also rewrite those regions, and a bot editing a Dockerfile is a change nobody reviewed —
# and a mismatch there means the loader's prefix moved, which is a decision, not a formatting slip.
# `xtask config-contract` reports it in the gate, which is the whole fix.
#
# That gap is not hypothetical. release-please bumps `$.workspace.package.version`, which all
# three artefacts record, and nothing regenerated them: release #50 landed on `main` with
# `openapi.json` still reporting `0.4.1`, and `openapi --check` never even ran because `rustdoc`
# failed earlier in the same job.
#
# `README.md` is the fifth, and the reason the `readme` job below is a job rather than a step: it
# is rendered from `.github/templates/README.md.hbs` with the numbers
# `.github/scripts/readme-variables.sh` reads out of `Cargo.toml`, `rust-toolchain.toml` and the
# compose file, and it needs neither a toolchain nor a cache to do it. Its inputs are a different
# set of paths from everything above — a Postgres bump in the compose file changes the README and
# nothing else here — so putting it in `fix` would spend a workspace compile on a two-line diff.
#
# The lockfile sync is load-bearing for the same reason and is **not optional**.
# `release-please-config.json` bumps `$.workspace.package.version`, which every one of the 26
# workspace members inherits via `version.workspace = true`, changing each member's recorded
# version in `Cargo.lock` — and release-please does not update lockfiles for the `simple` strategy
# (see the reasoning block in `release-please.yaml` for why `simple` and not `rust`). Left alone,
# the release pull request carries a lockfile that disagrees with the manifests and every
# `--locked` build in the repository fails: `xtask ci`, the `msrv` and `supply-chain` jobs, and the
# Dockerfile's `cargo auditable build --release --locked`. The release PR could then never go
# green, which is a deadlock rather than a flaky failure.
#
# **Both** lockfiles, because `web/frontend` is a separate workspace that inherits nothing and is
# therefore easy to forget. It depends on `crates/api-client` and `crates/domain` by path, so those
# two carry the bumped version into `web/frontend/Cargo.lock` as surely as into the host one — and
# only the host lockfile was synced until 2026-08-03. Release #50 shipped a frontend lockfile still
# recording 0.4.1, which failed `cargo fetch --locked` and took `lockfile integrity` and
# `third-party notices` down with it, on `main`, after merge.
#
# The same version bump reaches open pull requests by a second route, which is why this job merges
# the base branch in before it fixes anything. `ci.yml` judges the *merge* of a branch with its
# base, not the branch itself, so a release on `main` stales artefacts inside a branch whose own
# tree is perfectly self-consistent: regenerating on the head alone finds nothing to fix, and the
# pull request stays red with `openapi.json is out of date` and no command its author can run.
# Release 1.1.0 did exactly that to #62. Merging first makes the tree this job fixes the tree CI
# actually checks — the two were reading different trees, which is the whole bug.
#
# This does **not** weaken review of API changes. `openapi breaking changes` still compares the
# regenerated document against the base branch, so a change that breaks a client is still a red
# gate; what stops being a red gate is *forgetting to run the generator*.
#
# Step order is load-bearing and is the reverse of the dependency arrows. The lockfiles are synced
# first because `cargo fetch --locked` and every `--locked` build below fail against a lockfile that
# disagrees with the manifests — which is precisely the state a release pull request arrives in.
# Then `clippy --fix` rewrites source, `cargo fmt` formats what it wrote, and only then are the
# artefacts regenerated from the result.
#
# ---------------------------------------------------------------------------------------------
# Why `xtask repo-lint` is not here, and must not be added
# ---------------------------------------------------------------------------------------------
# Every `repo-lint` rule is of the form "two artefacts that must agree, disagree" — a CSP and the
# HTML it governs, the harness's Postgres major and production's, `deny.toml`'s advisory ignores
# and `.cargo/audit.toml`'s. None of them carries the answer to *which side is wrong*, so an
# automated fix would not be applying a known correction; it would be picking a side, and the side
# a machine picks is whichever makes the build go green.
#
# For one rule that is not merely unsound but the exact failure it exists to prevent.
# `csp-no-unsafe-eval` fires when code needs a directive the policy refuses. The green-making edit
# is to widen the CSP — which ENGINEERING_GUIDE rule 1 forbids in as many words, because the SPA's
# access token lives in memory and the policy is the ceiling on where an injected script could
# send it. A bot that resolved that rule automatically would be a supply-chain downgrade wearing
# the same commit message as a formatting fix.
#
# `too_many_lines` and the other suggestion-less clippy lints are excluded for the weaker version
# of the same reason: no machine-applicable suggestion means no determined output.

# **Unfiltered on purpose, and it must stay that way while this workflow reports a required
# check.** The path filter that used to live here was a `paths:` on this trigger, and a trigger
# GitHub declines to fire creates no run and therefore no check run — so `apply the mechanical
# fixes` sat at "Expected — waiting for status to be reported" forever on any pull request that
# touched no Rust. Not a slow check: an unreportable one, on a branch with nothing to fix.
#
# `ci.yml` says the same thing about its own gate and avoids it the same way: filter *inside* the
# workflow, never at the trigger. `changes` below decides what this run has to do, and the gate at
# the bottom reports the verdict whether or not anything ran.
on:
  pull_request:

# One workflow, one group — see the block above for what the two- and three-member versions of
# this group cost. `cancel-in-progress: false` because this job writes: a run cancelled mid-push
# is worse than one that waits, and with a single member the pending slot can no longer be taken
# by a sibling, so the newest head always gets a run.
concurrency:
  group: pr-autocommit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

# Must stay byte-identical to `ci.yml`'s, and no step below may override it. `rust-cache` hashes
# the `CARGO_*`/`RUST*` environment into its key, so a workflow that leaves these unset looks up a
# different key from the one `ci.yml`'s `lint` group writes and compiles the workspace from cold on
# every pull request — which is what this job did while it had no `env:` block at all. Cargo then
# hashes `RUSTFLAGS` into every *unit* fingerprint on top of that, so a step that clears it
# discards the restored cache just as thoroughly; see the `clippy --fix` step for what that cost.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Whether this pull request contains anything the job below can act on. This is the filter that
  # used to be a `paths:` on the trigger — see the note there for why it moved rather than went
  # away. Cheap enough to run on every pull request, which is the point: it always reports.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to check out the tree and diff it against the base
    outputs:
      relevant: ${{ steps.filter.outputs.fixable }}
      readme: ${{ steps.filter.outputs.readme }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # `fetch-depth: 0` because `persist-credentials: false` leaves `dorny/paths-filter` no token
      # to fetch the base with; a full clone means it never needs one. Same reasoning as `ci.yml`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The union of `ci.yml`'s `rust`, `notices` and `frontend` filters — the inputs the two
      # lockfiles and the four artefacts are a function of. Directories, never `**/*.rs`, for the
      # reason `ci.yml` gives: `web/frontend` is a separate workspace and a glob would silently
      # couple the two.
      #
      # A pull request touching none of these has no lockfile to move and no Rust to format, so
      # the twenty-minute compile below is skipped rather than run to discover it has nothing to
      # do. That saving is what the old trigger filter bought, and it is kept here — what changed
      # is only that the run still happens, and still reports.
      - name: path filters
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            fixable:
              - '.github/workflows/auto-fix.yaml'
              - '.github/actions/**'
              - 'crates/**'
              - 'services/**'
              - 'xtask/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'openapi.json'
              - 'about.toml'
              - 'THIRD-PARTY-NOTICES'
              # The published configuration contracts, and the `justfile` that writes them. The
              # Dockerfile whose `LABEL` regions are checked against them is deliberately *not*
              # here any more: nothing in this job rewrites it, and naming that mismatch is
              # `ci.yml`'s `test` job, whose `rust` filter now lists the Dockerfile for exactly
              # this reason.
              - 'docs/contracts/**'
              - 'justfile'
              - 'web/frontend/**'
            # Everything `README.md` is a function of: the template, the script that collects the
            # variables, the three files those variables are read out of, and the rendered file
            # itself — so that a hand-edit of a generated document is undone by the job that
            # would have overwritten it rather than surviving until the next unrelated render.
            readme:
              - '.github/workflows/auto-fix.yaml'
              - '.github/templates/README.md.hbs'
              - '.github/scripts/readme-variables.sh'
              - 'README.md'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'deploy/docker-compose.yml'

  fix:
    name: mechanical fixes
    runs-on: ubuntu-latest
    needs: [changes]
    # Generous: this job compiles the workspace under `--all-targets` for `clippy --fix`, checks it
    # again, and then builds `tankovault-api` for `xtask openapi`. Generous is not a budget to
    # spend — a run approaching it means something is rebuilding what the cache already holds.
    timeout-minutes: 60
    # Forks cannot read the app secrets, and a fork PR must not be able to make this repository
    # commit on its behalf. Skipping is correct: a fork's drift is the author's to fix.
    if: ${{ needs.changes.outputs.relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # A GitHub App token, not `GITHUB_TOKEN`: a push made with the default token does not trigger
      # workflows, so the fixes would land without re-running the checks that wanted them —
      # leaving the pull request red on a problem that has already been solved.
      #
      # `ACTIONS_MAINTENANCE_*` rather than `RELEASE_BOT_*`: those are `release` *environment*
      # secrets, and this job runs on every pull request. Naming that environment here would put a
      # secret scope that exists for publishing behind a job any pull request can start.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          # Narrowed to the one permission this job uses (zizmor `github-app`). By default the
          # minted token inherits *every* permission the app's installation holds, so a
          # compromised step here — a malicious build script reached through a dependency, say —
          # would hold the bot's full authority for the life of the token. It commits files to the
          # PR branch, and `contents: write` is that and nothing else.
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          # Full history: the step below merges the base branch, and a shallow clone has no
          # merge base to do it against.
          fetch-depth: 0

      # See the note at the top of this file: everything below regenerates artefacts that record
      # the workspace version, and `ci.yml` judges them on the merge with the base — so this job
      # has to stand on that same tree or it regenerates a version CI never sees.
      #
      # The remote is re-pointed at an authenticated URL rather than checking out with
      # `persist-credentials: true`: this way the credential in `.git/config` is the *narrowed*
      # app token above (`contents: write`, nothing else) rather than the job's `GITHUB_TOKEN`,
      # and it is the same token the commit step pushes with.
      #
      # A conflicting merge is a human's call, and aborting leaves the branch exactly as its
      # author pushed it — which is recoverable, where a bot-resolved conflict is not.
      - name: merge the base branch, which is the tree CI judges
        id: base
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$BASE_REF"
          # Recorded before the merge and before the early exit below, because the step after this
          # one diffs against it and both paths out of here have to leave it set.
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "::notice::already contains $BASE_REF"
            exit 0
          fi
          if ! git merge --no-edit FETCH_HEAD; then
            git merge --abort
            echo "::error::this branch conflicts with $BASE_REF and cannot be brought up to \
            date automatically; merge or rebase it by hand, then push"
            exit 1
          fi

      # `clippy --fix` rewrites `.rs` files and nothing else, and what it would rewrite is a
      # function of the sources, `clippy.toml` and the compiler — so a branch that touches none of
      # those has nothing for it to find, and compiling the workspace to prove that is the most
      # expensive thing this job does.
      #
      # That is the release pull request's case exactly. release-please changes
      # `$.workspace.package.version`, a CHANGELOG and a manifest; a version bump cannot introduce
      # or silence a lint, yet #83 spent 7m22s in `clippy --fix` finding the nothing it was always
      # going to find. Both lockfiles and the four generated artefacts *do* record that version,
      # so every other step still runs: this skips the compile, not the fix.
      #
      # Manifests are deliberately absent from the list. A feature added in a `Cargo.toml` can in
      # principle expose `cfg`-gated code carrying a lint, and this job will then not fix it — a
      # red `fmt + clippy` and one command for the author, which is already what happens for every
      # lint with no machine-applicable suggestion. Including manifests would put the release pull
      # request, the case this exists for, straight back on the slow path.
      #
      # `rustfmt.toml` is absent for a different reason: `cargo fmt` below is unconditional, so a
      # change to it is already acted on.
      - name: decide whether clippy has anything to look at
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "${BASE_SHA}...HEAD")
          if printf '%s\n' "$changed" | grep -qE '\.rs$' \
            || printf '%s\n' "$changed" | grep -qE '(^|/)(clippy|rust-toolchain)\.toml$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust sources changed on this branch; clippy --fix will run"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Rust sources changed on this branch; skipping clippy --fix"
          fi

      # The second reader of `rust-toolchain.toml`, after `ci.yml`'s `changes` job. The *number*
      # still has one home; what is repeated is the two-line read, which cannot drift from the
      # manifest because it is the manifest. `stable` would not do here — as it did in the old
      # `update-lockfile.yaml`, which compiled nothing: `xtask openapi` formats the generated
      # client with rustfmt, and `cargo fmt --check` then judges it under the pinned toolchain.
      - name: resolve the toolchain from its manifest
        id: versions
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$toolchain" ]; then
            echo '::error::no channel = "…" line in rust-toolchain.toml'
            exit 1
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "::notice::toolchain $toolchain"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ steps.versions.outputs.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The group `ci.yml`'s `lint` job writes: this compiles the same workspace with the same
          # flags. Without naming it the lookup used a key derived from this job's own name — one
          # nothing writes, because this workflow runs on pull requests only and so never executes
          # on `main`. It restored nothing, on every run.
          shared-key: lint
          # Reads `main`'s cache, never writes one: this runs only on pull requests, and a PR
          # populating the shared cache is how an unreviewed artefact reaches every other job.
          save-if: "false"

      # First, and before anything that passes `--locked`. A release pull request arrives with
      # manifests the lockfiles disagree with, so a `cargo fetch --locked` ahead of this step
      # fails and takes every fix in this job down with it — the deadlock described at the top.
      #
      # `cargo update --workspace` rather than `cargo fetch`: it rewrites only the workspace
      # members' entries and leaves every third-party pin alone. A release must not silently move
      # dependency versions — that is what `supply-chain` and `deny` gate, and this runs before
      # them. No BoringSSL toolchain is needed yet either; `cargo update` resolves and rewrites
      # without compiling anything.
      - name: sync both lockfiles with the manifests
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo update --workspace --manifest-path web/frontend/Cargo.toml
          if git diff --quiet -- Cargo.lock web/frontend/Cargo.lock; then
            echo "Both lockfiles already in step with the manifests."
          else
            git diff --stat -- Cargo.lock web/frontend/Cargo.lock
          fi

      # `wreq` compiles BoringSSL from C/C++ source; `xtask openapi` builds `tankovault-api`, so
      # this job needs them exactly as `ci.yml`'s Rust jobs do — and via the same action, which
      # exists because this job is where an unbounded `apt-get` stalled for 20m47s.
      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-about

      # `cargo-about` resolves licences from a fetched graph; both, because the notices document
      # covers the frontend workspace too. `--locked` is safe here only because the step above
      # has already brought both lockfiles into step with the manifests.
      #
      # **Every target the `about.toml` files name**, and this list must stay identical to the
      # one in `ci.yml`'s `notices` job — the two regenerate the same artefact, so a target
      # missing from either produces a document the other rejects. `cargo fetch` resolves for the
      # host unless told, and cargo-about silently omits any crate whose source it cannot find:
      # this workflow on Linux and a developer on Windows were each dropping the other's
      # target-specific crates and rewriting the file back and forth for ever.
      - name: fetch every dependency graph, for every target the notices cover
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo fetch --locked --manifest-path web/frontend/Cargo.toml

      # Only clippy's *machine-applicable* suggestions are applied — that is rustfix's contract,
      # not a flag. A lint with no concrete replacement (`too_many_lines`, which wants a judgement
      # about how to split a function) is left alone and stays a red `fmt + clippy`, which is the
      # correct outcome: the fixable half stops costing a round trip, the half that needs a
      # decision still gets one.
      #
      # An unfixable lint must not abort the run before rustfix has written anything, or the one
      # lint nobody can automate suppresses the fixes for all the ones anybody can. `--cap-lints`
      # is what buys that. It is emphatically **not** `RUSTFLAGS: ""`, which is what this step set
      # until 2026-08-05: cargo hashes `RUSTFLAGS` into the fingerprint of every unit it builds,
      # dependencies included, so clearing it meant the `lint` cache this job restores matched
      # nothing and the step rebuilt the whole graph — BoringSSL from C source among it — on every
      # run, while `save-if: false` means it never writes a cache of its own to warm the next one.
      # Measured on one commit, one runner, one cache: `ci.yml`'s `fmt + clippy` step took 35s,
      # this one 7m45s. A `--` argument reaches the workspace crates only, and `rust-cache`
      # discards workspace artefacts anyway, so the ceiling is free where the env variable was not.
      #
      # `--all-features` went for the same reason. It resolves a wider graph than the `lint` cache
      # holds — which is why `ci.yml`'s `features` job has a key of its own — and the gate this
      # step exists to satisfy is `cargo clippy --workspace --all-targets`. Rewriting code no
      # clippy gate judges is not worth a cold build of everything.
      - name: apply clippy's machine-applicable fixes
        if: steps.scope.outputs.rust == 'true'
        run: |
          set -euo pipefail
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged \
            -- --cap-lints=warn

      # `--fix` rewrites expressions without reformatting them, so this runs second and formats
      # what it wrote. Doing it the other way round commits code that `cargo fmt --check` rejects.
      #
      # The host workspace only, matching the gate: `cargo fmt --all` stops at the workspace
      # boundary and `web/frontend` is a separate one, which `ci.yml` does not format-check
      # either. Widening this would start enforcing a rule no gate states.
      - name: format the result
        run: cargo fmt --all

      # rustfix reverts a fix that does not compile, but it judges that per-crate and this
      # workspace is 26 of them. A tree that no longer builds must not reach the commit step:
      # failing here leaves the branch exactly as the author pushed it, which is recoverable,
      # where a committed broken tree is a bot-authored regression to bisect.
      #
      # Same shape as the step above, for the same cache reason: it verifies what rustfix actually
      # rewrote, and rustfix no longer looks at feature-gated code the `lint` cache does not cover.
      # `ci.yml`'s `features` job is what compiles the workspace under `--all-features`.
      #
      # Skipped with the step it guards. This checks rustfix's output, so with rustfix skipped
      # there is nothing here that `xtask openapi` below does not already compile — and `cargo fmt`
      # cannot produce a tree that stops building.
      - name: the fixed tree still compiles
        if: steps.scope.outputs.rust == 'true'
        run: cargo check --workspace --all-targets

      - name: regenerate the OpenAPI document and its client
        run: cargo run -p xtask -- openapi

      - name: regenerate THIRD-PARTY-NOTICES
        run: cargo run -p xtask -- notices

      # The same recipe a developer runs, rather than a second spelling of it in YAML.
      - name: Install just
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: just

      # The nine committed contracts, and only those. `just regenerate` would also rewrite the
      # Dockerfile's `LABEL` regions, and three lines a human pasted are not something a bot
      # should edit unreviewed — `deploy/docker/Dockerfile` is deliberately not in the
      # `file_pattern` below either. `xtask config-contract` names that diff in the gate, and
      # naming it is the whole fix.
      - name: regenerate the configuration contracts
        run: just contract-json

      # Same Node major as `ci.yml`'s `css` job, which is what judges the result.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: rebuild the Tailwind output
        working-directory: web/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run css:build

      # One commit for every fix above, which is the point of this workflow existing once rather
      # than three times: a reviewer sees a single bot commit, and there is no second push to lose
      # a race with.
      #
      # The shared action writes through the GraphQL commit API, so the commit is *verified* — a
      # bot commit that `git log --show-signature` can attribute, which a locally-signed push from
      # a runner cannot be without a key on the runner. It reads the branch head immediately before
      # writing and passes it as `expectedHeadOid`, so a push that lands in between fails this step
      # loudly instead of being silently overwritten. Losing that race is self-healing: the push
      # that won it is itself a `synchronize` event, so this workflow runs again on the head that
      # now exists.
      #
      # `file_pattern` is scoped to source, the two lockfiles and the generated artefacts rather
      # than the whole tree. `docs/contracts` is nine of them — one per published image — and it
      # is the one entry that is a *directory of* artefacts, so a service added to
      # `crates/config-contract` is carried back without touching this line. Nothing else in this job is meant to change — `npm ci` can touch
      # `package-lock.json` — and anything outside this list that changed is a bug to see in a red
      # gate, not to commit silently.
      #
      # No `if:` guard: the action detects an unchanged tree itself and commits nothing.
      - name: Commit the fixes
        uses: TimSchoenle/actions/actions/common/commit-changes@57e5492e68be560bddac3c6fc9ba0a944cfee961 # tag=actions-common-commit-changes-v1.3.3
        with:
          commit_message: "style: apply the mechanical fixes (lockfiles, clippy --fix, fmt, regenerated artefacts)"
          token: ${{ steps.generate_token.outputs.token }}
          branch: ${{ github.event.pull_request.head.ref }}
          file_pattern: "Cargo.lock web/frontend/Cargo.lock crates services xtask fuzz openapi.json THIRD-PARTY-NOTICES docs/contracts web/frontend/src web/frontend/assets/main.css"

  # `README.md`, rendered from its template and committed back to the branch.
  #
  # `needs: [changes, fix]` is **ordering, not a dependency**. Both jobs commit to the pull
  # request's branch, and the shared action passes the head it read as `expectedHeadOid`, so two
  # of them writing at once means one fails on a moved parent — a red gate whose cause is a race
  # nobody can see in the diff. Running them in series costs a minute on the pull requests where
  # both have something to do, and there is nothing to reason about afterwards. It is also why
  # this is a second *job* rather than a second workflow: `repo-lint`'s
  # `concurrency-groups-hold-one-workflow` would refuse the second workflow, and the note at the
  # top of this file says what the three-workflow version of this cost.
  #
  # `!failure()` rather than `success()`: `fix` skips on a pull request with no Rust in it, and
  # a README that changed on such a branch is exactly the branch this job is for. A *failed*
  # `fix` is different — it may have left the tree half-fixed, and rendering on top of that
  # commits a README nobody asked for.
  readme:
    name: render the README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, fix]
    # Forks get no app secrets, so there would be no token to commit with. `ci.yml`'s `readme`
    # job is what covers them: it renders in check mode and fails on a stale file.
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.readme == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read # the write happens with the App token below, not with GITHUB_TOKEN
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # An App installation token for the same two reasons `fix` uses one: the commit is
      # verified, and — unlike one made with `GITHUB_TOKEN` — it re-triggers the checks on the
      # branch it lands on. Narrowed to the one permission this job uses.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write

      # The head of the branch, not the merge commit: the render has to read the `Cargo.toml`
      # the pull request proposes, and the commit has to land on top of what is there now —
      # including whatever `fix` just committed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      # Invoked through `bash` rather than executed: this repository is authored on Windows,
      # where git does not record the executable bit.
      - name: collect the README variables
        id: variables
        run: echo "json=$(bash .github/scripts/readme-variables.sh)" >> "$GITHUB_OUTPUT"

      # Commits only when the render actually changed the file, so an unrelated pull request
      # that merely touched `Cargo.toml` makes no commit and no API call.
      - name: render README.md and commit it
        id: render
        uses: TimSchoenle/actions/actions/common/render-template-and-commit@15d83f02081c9dc8a844646199c63792dcccdfa8 # tag=actions-common-render-template-and-commit-v1.1.3
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.json }}
          token: ${{ steps.generate_token.outputs.token }}
          branch: ${{ github.event.pull_request.head.ref }}
          commit_message: "docs: render README.md from its template"

      - name: summarise
        env:
          COMMITTED: ${{ steps.render.outputs.changes_detected }}
          COMMIT_URL: ${{ steps.render.outputs.commit_url }}
        run: |
          set -euo pipefail
          if [ "${COMMITTED}" = "true" ]; then
            echo "README.md re-rendered: ${COMMIT_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "README.md already matched its template." >> "$GITHUB_STEP_SUMMARY"
          fi

  # **The name branch protection points at — point it here and nowhere else.** This job carries the
  # required check because it is the only one that always runs: `fix` skips on a pull request with
  # no Rust in it and on every fork, and a skipped job is a weaker promise to a ruleset than a job
  # that ran and said so.
  #
  # `if: always()` rather than `success()`, which would inherit the skips. It fails only on a real
  # `failure` or `cancelled`; a skipped `fix` or `readme` is a pull request with nothing to fix,
  # which is a pass. Same shape, and the same reasoning, as `ci.yml`'s `ci` gate.
  auto-fix:
    name: apply the mechanical fixes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, fix, readme]
    permissions: {}
    steps:
      - name: verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "::error::a required job reported '$r'"
                exit 1
                ;;
            esac
          done
          echo "All required jobs passed or were skipped as unaffected."
