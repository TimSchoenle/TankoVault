[package]
name = "tankovault-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "AniList external sync (OAuth push/pull). Phase 5."
# Not published: this is a workspace-internal crate. Also what lets `cargo deny`
# skip license-checking our own code.
publish = false

[[bin]]
name = "sync"
path = "src/main.rs"

[dependencies]
tankovault-config = { workspace = true }
tankovault-service = { workspace = true, features = ["db"] }
tokio-util = { workspace = true }
tankovault-db = { workspace = true }
tankovault-contracts = { workspace = true }
tankovault-domain = { workspace = true }
tankovault-auth = { workspace = true }
tankovault-matcher = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
# Percent-encodes the OAuth consent URL's query, replacing a hand-rolled encoder (ARCH-7).
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
# The service's HTTP error contract (`error.rs`) is a typed enum, not a substring match.
thiserror = { workspace = true }
# Decodes the token-encryption key at boot to reject the published all-zero placeholder.
base64 = { workspace = true }
tracing = { workspace = true }

[features]
# Opt-in: the reconciliation suite needs Docker (an ephemeral Postgres via the harness). Off by
# default so `cargo test -p tankovault-sync` stays fast and DB-free.
integration = []

[dev-dependencies]
tankovault-test-support = { path = "../../crates/test-support" }
# A scriptable `AniList`. F-06 fakes the provider at the *trait* boundary, so until this
# everything below it — the `OAuth` token exchange, the pacer, the `429` retry — was untested
# (TEST F-09).
wiremock = { workspace = true }

[lints]
workspace = true
