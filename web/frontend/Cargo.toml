[package]
# Not `tankovault-frontend`: `services/frontend` already owns that name in the host workspace,
# and two packages sharing one name made `cargo <cmd> -p tankovault-frontend` resolve to
# whichever workspace the cwd happened to be in (OPS-1.6). Legal, because this crate is excluded
# from the host workspace — but a silent, cwd-dependent target is not something to rely on.
name = "tankovault-web"
version = "0.1.0"
edition = "2021"
authors = ["TankoVault contributors"]
publish = false
description = "TankoVault reader-facing web frontend — Dioxus (WASM SPA) + the Inkstone design system (design §17)."

# The web bundle's output filenames (`<bin>_bg.wasm`, `<bin>.js`, referenced from the
# generated index.html) follow this binary target's name, not the package name. Pin it to a
# generic, project-agnostic `app` so renaming the crate never churns the served asset paths.
[[bin]]
name = "app"
path = "src/main.rs"

# This crate is intentionally excluded from the host workspace (see the root
# Cargo.toml `exclude`) because it targets `wasm32-unknown-unknown` via the `dx`
# CLI. Dependency versions are therefore pinned here rather than inherited.
#
# The empty `[workspace]` table below is load-bearing, not decoration. Without it, cargo walks
# *up* looking for a workspace root and finds the host one — so `cargo fmt --all` run from this
# directory silently formats the entire backend, and `cargo clippy --all-targets` reaches
# crates this one has nothing to do with. Declaring this crate its own workspace root stops the
# walk and keeps every command scoped to the frontend, which is what anyone running it here
# intends.

[workspace]

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.7", features = ["http", "json", "eventsource"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
progenitor-client = "0.14"
tankovault-api-client = { path = "../../crates/api-client" }
tankovault-domain = { path = "../../crates/domain" }
# Console dashboard auto-refresh loop (wasm-friendly async sleep).
gloo-timers = { version = "0.4", features = ["futures"] }
futures-util = "0.3"
base64 = "0.23"
# Live notification stream: read `MessageEvent.data()` from the SSE subscription.
# `Window`/`Location` let the API client resolve the served page's absolute origin — reqwest
# (unlike the browser's own fetch) rejects the relative `/v1/...` paths with a "builder error".
# `Blob`/`Url`/`HtmlAnchorElement` back the personal-data export download: the endpoint is
# bearer-authenticated, so a plain anchor navigation cannot reach it and the document has to be
# handed to the browser from memory (see `util::save_text_file`).
# `Storage`/`HtmlInputElement` back `src/browser.rs`, which replaced every `document::eval`
# call in the app: Dioxus implements web `eval` as `new Function(...)`, and the served CSP
# does not (and must not) carry `'unsafe-eval'`.
#
# `Credential`/`CredentialsContainer` back `src/webauthn.rs`: passkey registration and sign-in
# are `navigator.credentials.create()` / `.get()`, and there is no other way to reach them —
# the ceremony is a browser API by construction, not an HTTP call the API client could make.
web-sys = { version = "0.3", features = [
    "MessageEvent", "Window", "Location", "Navigator",
    "Blob", "BlobPropertyBag", "Url", "Document", "Element", "HtmlAnchorElement",
    "Storage", "HtmlElement", "HtmlInputElement",
    "Credential", "CredentialsContainer", "CredentialCreationOptions",
    "CredentialRequestOptions", "PublicKeyCredential", "DomException",
] }
wasm-bindgen = "0.2"
# `navigator.credentials.*` returns a `Promise`; this is what awaits it. Nothing else in the app
# needed it, because every other async path goes through `reqwest`/`gloo-net`, which own their
# own bridge.
wasm-bindgen-futures = "0.4"
# The WebAuthn wire types, and — the reason this dependency exists rather than a hand-written
# conversion — the four `From` impls between them and `web_sys` that its `wasm` feature carries.
#
# This is the same crate the API's `webauthn-rs` is built on, at the same pinned version, which
# is the whole point. `PublicKeyCredentialCreationOptions` is a deep, base64url-in-JSON structure
# whose byte fields have to become `ArrayBuffer`s before the browser will look at them; writing
# that translation by hand on this side would be a second, unverified copy of a specification the
# server already implements, and it would drift exactly the way the hand-mirrored sync DTOs did
# (see `crates/contracts`). Instead the API sends these types' own serialisation as opaque JSON
# and both ends parse it with this crate. `openapi.json` deliberately does not model them.
#
# `=` pins it for the reason the host workspace pins `webauthn-rs`: a `-dev` pre-release, and
# these two must never disagree about the format on the wire.
webauthn-rs-proto = { version = "=0.6.1-dev", features = ["wasm"] }
# Relative-time formatting on the console uses the browser's own ISO-8601 date parser.
js-sys = "0.3"
# Typed ids in the generated wire types (the progenitor `tankovault-api-client` maps
# `format: uuid` back to the domain newtypes, which wrap this). The frontend never mints ids
# itself, but `uuid`'s `v7` feature is switched on transitively (the shared
# `tankovault-domain` newtypes mint v7 ids), and as of uuid 1.24 `v7` on
# `wasm32-unknown-unknown` demands an explicit randomness source. `js` supplies the
# self-contained WebCrypto backend (via `wasm-bindgen`/`js-sys`, already deps) — no
# `getrandom` wasm cfg required.
uuid = { version = "1", features = ["serde", "js"] }
# Message catalogues + the language switch (`src/i18n.rs`). `dio` is the Dioxus binding; the
# `dio-ssr`/`server` features are fullstack-only and would drag `http` and server functions into
# a bundle that is a pure client-side SPA.
i18nrs = { version = "0.1.9", default-features = false, features = ["dio"] }

[features]
default = ["web"]
web = []

# This crate sits outside the workspace, so it cannot inherit `[workspace.lints]`. The set
# below mirrors it, minus the lints that fight idiomatic Dioxus: component functions are
# PascalCase by convention, and `rsx!` expands to code that trips several pedantic lints it
# has no way to satisfy.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A suppression must be `#[expect(..., reason = "...")]`, never a bare `#[allow(...)]`, so that
# one which stops being necessary warns instead of living on silently. Matches the host
# workspace; see the note in the root `Cargo.toml`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `crate::models` is this crate's DTO namespace: a screen that renders a payload needs most
# of it, and spelling out fifteen imports per view obscures more than it documents.
wildcard_imports = "allow"
# `rsx!` bodies are long by nature — they are markup, and splitting a screen's tree purely to
# satisfy a line count would hurt readability rather than help it.
too_many_lines = "allow"
# Screen-local helpers are deliberately declared next to the handler that uses them rather
# than hoisted above the hooks, which would separate them from their only caller.
items_after_statements = "allow"

# Release builds are CDN-bound, so size wins over speed.
#
# `opt-level = "z"` was measured against `"s"` here and produced a byte-identical bundle:
# `dx` runs `wasm-opt -Oz` over the output, and that pass dominates whatever rustc emitted.
# `"s"` is kept because it compiles faster for the same result.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# A panic in a WASM SPA cannot be caught or recovered from — the runtime just traps — so the
# unwinding machinery and its landing pads are pure weight.
panic = "abort"
strip = "symbols"

# `dx serve` rebuilds constantly, so keep the debug profile fast to compile but still cheap
# enough to ship over the dev server.
[profile.dev]
opt-level = 1
debug = false
