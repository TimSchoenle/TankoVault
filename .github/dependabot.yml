# Dependency updates.
#
# `cargo-deny` and `cargo-audit` already *detect* vulnerable dependencies in CI, but nothing
# fixed them: an advisory landed as a red gate on an unrelated pull request and stayed red
# until someone bumped by hand. Detection without a remediation path is how an unfixable
# advisory ends up permanently ignored, which is precisely the state the audit found.
#
# Grouped so a routine week is one reviewable pull request rather than fifteen.

version: 2

updates:
  # The host workspace. `web/frontend` keeps its own lockfile outside it, so it is listed
  # separately below — Dependabot does not follow a `[workspace] exclude`.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps of things already in the tree: individually uninteresting,
      # collectively the bulk of the noise.
      rust-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: "/web/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "rust", "frontend"]
    commit-message:
      prefix: "chore(deps)"

  # The Tailwind CLI and the font packages. Dev-only — none of this ships in the WASM bundle
  # — but the CLI's output is committed as `assets/main.css`, so a bump is a visible diff and
  # the `css` CI job will catch a stale rebuild.
  - package-ecosystem: npm
    directory: "/web/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      css-tooling:
        patterns: ["*"]
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"

  # Pinned action SHAs and majors go stale silently and are a supply-chain surface in their
  # own right.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  # The base images in deploy/docker/*. `flaresolverr` is pinned in compose rather than in a
  # Dockerfile, so it is not covered here — bump it by hand when the adapters are retested
  # against it.
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
