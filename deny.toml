# cargo-deny configuration: the license, advisory and supply-chain gates CI runs. Schema v2.
#
# An exception must be **explicit, dated and justified**: a permanently red gate is one
# everyone learns to merge past, and then a genuinely new advisory looks just like the old ones.

[advisories]
version = 2
# Every entry: why no fix is possible, why it's not exploitable here, a review date. When the
# reasoning stops being true, delete the entry and let the gate go red; do not extend the date.
ignore = [
    # RUSTSEC-2023-0071: Marvin timing sidechannel in `rsa` private-key operations, fixed in
    # 0.10.0. Two copies match: 0.9.10 from `jsonwebtoken`'s `rust_crypto` feature (no HMAC-only
    # alternative, no 0.10 release) and 0.10.0-rc.19 from `webauthn-rs-core` via `crypto-glue`
    # (a pre-release, so semver-below the fix). Not exploitable here: the server holds no RSA
    # private key. `crates/auth/src/token.rs` pins `Algorithm::HS256`, test-enforced, and WebAuthn
    # only verifies signatures against stored public keys. Reviewed 2026-11-23; re-review
    # 2027-02-23, or if HS256 stops being the only accepted algorithm or the server ever
    # decrypts or signs with an RSA key.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0387: timing variability in `crypto-bigint` 0.5.5, reached only through
    # `elliptic-curve` 0.13 (`p256`/`p384` 0.13 under `jsonwebtoken`'s `rust_crypto` feature).
    # `webauthn-rs-core` 0.6.2 is on `elliptic-curve` 0.14 and `crypto-bigint` 0.7.11, which is
    # patched. The fix is 0.7.6, which the 0.13 curve crates cannot take, so no compatible release
    # exists. Not exploitable here: JWTs are HS256-only (see RUSTSEC-2023-0071), so no secret
    # scalar ever passes through it. Reviewed 2026-11-23; re-review 2027-02-23, when
    # `elliptic-curve` 0.14 reaches `jsonwebtoken`, or if the server ever signs with an EC key.
    "RUSTSEC-2026-0387",

    # RUSTSEC-2026-0391, -0398, -0403: `zstd` 0.13 / `zstd-safe` 7, held there by `wreq-util`
    # 3.0.0-rc.14 (`^0.13.3`); the fixes are 0.14.3 / 8.2.0 only. Its sole use is decompressing
    # TLS certificates through `zstd::stream::read::Decoder::new`, which none of the three reach:
    # -0391 is only `with_context`, -0398 only the `seekable` feature (not enabled), and -0403 is
    # the write-side decoder, its advisory exempting `read::Decoder` by name. Reviewed
    # 2026-10-26; re-review 2027-01-26, when `wreq-util` moves to `zstd` 0.14, or if anything
    # else in the graph starts depending on `zstd` 0.13.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",

    # RUSTSEC-2026-0440: `astral-tokio-tar` is unmaintained, no fixed release. Reached only through
    # `testcontainers`, a dev-dependency of the Docker-gated test-support crates; no service binary
    # or image links it. Reviewed 2026-11-10; re-review when `testcontainers` replaces it.
    "RUSTSEC-2026-0440",

    # RUSTSEC-2026-0459: the C SQLite bundled by `libsqlite3-sys` 0.37. It is in `Cargo.lock` only
    # because `sqlx`'s weak `sqlx-sqlite?/…` features make `cargo` record it; the workspace never
    # enables `sqlite`, so no build compiles or links it (`cargo tree -i sqlx-sqlite` is empty), and
    # cargo-deny, which resolves features, does not report it. Listed so `.cargo/audit.toml`, whose
    # lockfile scan does report it, agrees with this file. Reviewed 2026-11-10; re-review if any
    # crate enables a `sqlx` `sqlite` feature.
    "RUSTSEC-2026-0459",

    # RUSTSEC-2026-0543: `chrono` is unmaintained, with no fixed release. It is in `Cargo.lock`
    # only as an optional dependency of `serde_with`, whose `chrono` feature nothing enables, so no
    # build compiles it (`cargo tree -i chrono --workspace --all-features --target all` prints
    # nothing). Reviewed 2026-11-23; re-review if anything starts enabling it.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
# SPDX ids permitted in the dependency graph; anything outside this set fails CI for review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # `quoted_printable` (lettre's MIME encoder): public-domain-equivalent, more permissive
    # than everything above it.
    "0BSD",
    # `webpki-roots`/`webpki-root-certs`: the Mozilla CA bundle, no copyleft or attribution.
    "CDLA-Permissive-2.0",
    # `borrow-or-share` (progenitor-impl 0.17 → typify → jsonschema → fluent-uri, xtask only):
    # MIT without the attribution clause, more permissive than MIT itself.
    "MIT-0",
]

# ---------------------------------------------------------------------------------
# GPL-3.0 and LGPL-3.0 stay out of the allow list above. Do not add either casually.
# ---------------------------------------------------------------------------------
# `wreq-util` (load-bearing browser-emulation profiles for the crawl stack) is GPL-3.0 through
# 2.x, which makes publishing Docker images a source-offer obligation over the whole combined
# work. 3.0.0-rc.12 is Apache-2.0 (requiring `wreq ^6.0.0-rc`), so an accidental downgrade below
# that is a licensing regression, caught by GPL-3.0/LGPL-3.0 being absent from the allow list.
# Adding either back re-opens it silently.

confidence-threshold = 0.8
# Workspace members are `publish = false` with no `license` field; skip the noise of
# licence-checking our own code.
private = { ignore = true }

[bans]
# `warn` made 86 two-version crates invisible noise, so a genuinely new duplicate (or wildcard
# requirement) arrived silently inside it. `deny` plus an explicit skip list below fails on
# anything new instead.
multiple-versions = "deny"
wildcards = "deny"
# Workspace-internal path deps have no version requirement and read as a wildcard, but can't
# silently resolve to anything the way a registry dependency could.
allow-wildcard-paths = true

# Crates that must NEVER enter the graph, whoever pulls them in.
deny = [
    # The `scratch` runtime ships no OpenSSL/CA store; the crawl stack is BoringSSL-only.
    # A transitive link here would fail at exec time in production, not build time in CI.
    { crate = "openssl-sys", reason = "the scratch runtime ships no OpenSSL; use rustls, or wreq's BoringSSL" },
    { crate = "openssl", reason = "see openssl-sys" },
    # How `openssl-sys` usually arrives.
    { crate = "native-tls", reason = "pulls openssl-sys; use rustls" },
]

# Duplicate versions, all transitive. A record of the current state, not an approval: CI's
# `-D unnecessary-skip` fails any entry whose duplicate has resolved, so the PR that collapses
# one deletes its line here.
#
#   * `rand` at three majors is not collapsible by bumping our own pin: ours are 2 of 8
#     dependents of 0.8. Revisit when `jsonwebtoken`/`fred` move, not before.
#   * `tower-http` 0.6 is pulled by `reqwest` 0.13, nothing to fix short of dropping `reqwest`.
skip = [
    # The `rand` 0.8 → 0.9 ecosystem migration, dragging its whole cluster along.
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    { crate = "getrandom" },
    # RustCrypto trait-crate majors, split across the argon2/aes-gcm/sha2 consumers.
    { crate = "block-buffer" },
    { crate = "crypto-common" },
    { crate = "digest" },
    { crate = "hkdf" },
    { crate = "hmac" },
    { crate = "sha2" },
    # `sha1` joins them with the TOTP work: RFC 6238 is HMAC-SHA1, so `crates/auth` takes 0.11
    # alongside its `hmac` 0.13. The 0.10 copy is the same older cohort as the entries above,
    # via `crypto-glue`, `headers`, `tungstenite` and `x509-cert`.
    { crate = "sha1" },
    { crate = "cpufeatures" },
    # Long-tail utility crates where two majors coexist across the graph.
    { crate = "hashbrown" },
    { crate = "itertools" },
    { crate = "nom" },
    { crate = "shlex" },
    { crate = "socket2" },
    { crate = "syn" },
    { crate = "r-efi" },
    # `tower-http` 0.6 arrives transitively; ours is pinned at 0.7.
    { crate = "tower-http" },
    # The TOML parser stack: `figment` 0.10's `toml` 0.8 (under `terrace-config` and
    # `crates/config`) holds `toml_edit` 0.22/`toml_datetime` 0.6/`winnow` 0.7, and progenitor-impl
    # 0.17's typify stack (xtask only) brings the 1.x generation. Collapses when figment moves.
    { crate = "toml_datetime" },
    { crate = "toml_edit" },
    { crate = "winnow" },
    # Compression backends split by the lock refreshes: the newer copies arrive through
    # `async-compression`'s `compression-codecs`, and the older ones are all `wreq-util`
    # 3.0.0-rc.14's, already its latest release: `zstd` 0.13/`zstd-safe` 7 beside 0.14/8, and
    # `brotli` 8 (with `brotli-decompressor` 5, `alloc-stdlib` 0.2, `alloc-no-stdlib` 2) beside
    # `brotli` 9's 6/0.3/3. Collapses when `wreq-util` releases.
    { crate = "zstd" },
    { crate = "zstd-safe" },
    { crate = "brotli" },
    { crate = "brotli-decompressor" },
    { crate = "alloc-stdlib" },
    { crate = "alloc-no-stdlib" },
    # `synstructure` 0.14 via the ICU stack's `zerofrom-derive` 0.1.8; 0.13 via `asn1-rs-derive`
    # under both X.509 cohorts below, whose newest release (0.7) still requires 0.13.
    { crate = "synstructure" },
    # The passkey stack (added 2026-08-01 with `webauthn-rs` 0.6): every entry below is a
    # second copy arriving only through `webauthn-rs-core`.
    # Password-hashing cluster: `crypto-glue` pins `argon2 0.5`; `crates/auth` uses 0.6.
    # Collapses when `crypto-glue` bumps.
    { crate = "argon2" },
    { crate = "blake2" },
    { crate = "password-hash" },
    # `thiserror` 1.x via `webauthn-rs-core`; we're on 2.
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    # `base64`: three copies: ours (0.23), the wide transitive middle (0.22), and
    # `webauthn-rs-core`/`-proto` (0.21). Nothing on our side pins the older two.
    { crate = "base64" },
    # The signature cluster, the reverse of the others: `webauthn-rs` 0.6.2's `crypto-glue` 0.2.2
    # is on the *newer* curve generation (`elliptic-curve` 0.14, `rsa` 0.10, `signature` 3), and
    # `jsonwebtoken` 11 (`p256`/`p384` 0.13, `rsa` 0.9, `ed25519-dalek` 2) and `nkeys` under
    # `async-nats` hold the older one. Collapses when both move to `elliptic-curve` 0.14.
    { crate = "base16ct" },
    { crate = "crypto-bigint" },
    { crate = "ecdsa" },
    { crate = "elliptic-curve" },
    { crate = "ff" },
    { crate = "fiat-crypto" },
    { crate = "group" },
    { crate = "p256" },
    { crate = "p384" },
    { crate = "pkcs1" },
    { crate = "primeorder" },
    { crate = "rfc6979" },
    { crate = "rsa" },
    { crate = "signature" },
    # `const-oid`: 0.10 via `digest` 0.11, 0.9 via `der` 0.7 under the PKCS#8 cluster below.
    { crate = "const-oid" },
    # The PKCS#8 cluster: `crates/service/src/tls.rs` re-encodes a mounted key with the `der` 0.8
    # generation (`pkcs8` 0.11, `sec1` 0.8), and the 0.7 generation stays behind it under two
    # roots: `jsonwebtoken` 11 (`rsa` 0.9, `ed25519` 2.2, `p256`/`p384`/`p521` 0.13) and `nkeys`
    # under `async-nats`. Neither can move yet; collapses when both take `der` 0.8.
    { crate = "der" },
    { crate = "pem-rfc7468" },
    { crate = "pkcs8" },
    { crate = "sec1" },
    { crate = "spki" },

    # Platform shims, present on any graph touching Windows or macOS bindings.
    { crate = "windows-sys" },
    # The import-library family behind `windows-sys`. Not a new decision: `windows-sys` above is
    # already two copies, 0.52.0 under `ring` and 0.60.2 under `notify`, and these are that split
    # reaching one level down (`windows-targets` 0.53 under the newer `windows-sys`). Windows-only
    # link stubs: nothing here is reachable in the Linux images that ship. Collapses when `ring`
    # bumps its `windows-sys` floor, which is the only pin holding 0.52 in place.
    { crate = "windows-targets" },
    { crate = "windows_aarch64_gnullvm" },
    { crate = "windows_aarch64_msvc" },
    { crate = "windows_i686_gnu" },
    { crate = "windows_i686_gnullvm" },
    { crate = "windows_i686_msvc" },
    { crate = "windows_x86_64_gnu" },
    { crate = "windows_x86_64_gnullvm" },
    { crate = "windows_x86_64_msvc" },
    # The `windows-core` support crates, split the same way: `generator` 0.8.12 (under `loom`,
    # via `metrics-exporter-prometheus`) is on the 0.100 generation, while `chromiumoxide`'s
    # `windows-registry` 0.6 and `backtrace` hold the 0.2/0.4/0.5 one. Windows-only, unreachable
    # in the Linux images. Collapses when `chromiumoxide` and `backtrace` move to 0.100.
    { crate = "windows-link" },
    { crate = "windows-result" },
    { crate = "windows-strings" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The three git dependencies, all pinned by tag in the root manifest: `terrace-config` (the
# layered config loader and reload supervisor), `csp-shell` (the frontend tier's
# Content-Security-Policy) and `terrace-legal` (the legal documents, whose Dioxus crates
# `web/frontend` also uses). Listed here because `unknown-git = "deny"` above is what stops a
# *fourth* one arriving unnoticed: a git source is a dependency with no registry, no version
# resolution and no yank mechanism, so each one is a deliberate decision, not something a
# transitive bump can introduce.
allow-git = [
    "https://github.com/TimSchoenle/terrace-config",
    "https://github.com/TimSchoenle/csp-shell",
    "https://github.com/TimSchoenle/terrace-legal",
]
