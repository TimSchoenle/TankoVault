[package]
name = "tankovault-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "SQLx repositories and migrations for TankoVault."

[dependencies]
# `sqlx` feature: derives `sqlx::Type` on the domain enums so the checked query
# macros can bind/decode them as their native Postgres enum types.
tankovault-domain = { workspace = true, features = ["sqlx"] }
tankovault-matcher = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
utoipa = { workspace = true }

[lints]
workspace = true
