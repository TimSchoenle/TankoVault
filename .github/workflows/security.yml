name: Security

# Static analysis of the workflows themselves: the one body of code with write access to the
# repository that nothing else reads. Catches unpinned actions, over-broad `permissions`,
# credentials persisted into `.git/config`, and `${{ }}` interpolated into a `run:` block, which is
# a shell injection, not a template.
#
# jactionlint keeps every check of actionlint and has a rule for every zizmor audit. It runs
# online, so it also asks GitHub about the actions in use (impostor commits, vulnerable versions,
# moved tags, archived repositories); strict-exit fails it on findings of every level. It uploads
# its SARIF to code scanning under the category `jactionlint`. `pedantic` on purpose: a narrower
# profile reports only what is provably exploitable today, pedantic reports the shape that becomes
# exploitable after one careless edit. `.github/jactionlint.yaml` turns off the rules this
# repository does not want and records the accepted findings.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, alongside CI's full run: advisories published since the last change are reported.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Nothing granted at the workflow level; every job asks for what it needs and no more.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-lint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out the workflows
      security-events: write # to upload the SARIF findings to code scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: TimSchoenle/actions/actions/security/jactionlint@1d886b5eba61b249cb506ac35e8b6ab460a0ed2a # tag=actions-security-jactionlint-v1.1.2
        with:
          online: 'true'
          strict-exit: 'true'
