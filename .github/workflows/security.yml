name: Security

# Static analysis of the workflows themselves.
#
# Everything else in this repository has a gate that reads it — clippy reads the Rust, promtool
# reads the alert rules, `xtask repo-lint` reads the CSP and the compose file. The workflows were
# the one body of code with write access to the repository that nothing analysed. zizmor is that
# reader: unpinned actions, over-broad `permissions`, credentials persisted into `.git/config` by
# `actions/checkout`, and `${{ }}` interpolated straight into a `run:` block (which is a shell
# injection, not a template).
#
# The `pedantic` persona is deliberate. The default persona reports only what it can prove is
# exploitable today; pedantic reports the shape that becomes exploitable after one careless edit,
# which is the standard the rest of this repository's lint configuration already holds.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, alongside CI's full run. zizmor's audit set grows between releases, so a workflow
    # that passed on the day it was written is not a workflow that passes today.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Nothing is granted at the workflow level; every job asks for what it needs and no more.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the workflows
      actions: read # to resolve the actions they reference
      security-events: write # to upload the SARIF findings to code scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          persona: pedantic
