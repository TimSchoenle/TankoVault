name: CI

# fmt, clippy (-D warnings), cargo-deny, cargo-audit, workspace tests, the wasm frontend check,
# and a docker build of every service image.
#
# Path filters scope *when* a gate runs, never whether it runs. Four rules keep that honest:
#   1. This file is an input to every filter, so editing it re-runs everything.
#   2. The weekly `schedule` run ignores the filters — `cargo-audit` and `cargo-deny`'s advisory
#      check need it, because a new advisory lands against code that did not change.
#   3. Filters name directories, never `**/*.rs`: `web/frontend` is a separate workspace the host
#      jobs do not build, and a glob would silently couple the two.
#   4. `ci` at the bottom is the single required check. It fails if any job failed and passes when
#      jobs were skipped, so branch protection needs one entry that cannot silently stop existing.
#
# The toolchain and MSRV are read from `rust-toolchain.toml` and `Cargo.toml` by the `changes`
# job and never repeated inline; seven inline copies drifted from the manifest once already.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full run: every job, every filter ignored.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Run every job, ignoring the path filters"
        type: boolean
        default: false

# Nothing granted by default: each job requests only the scopes it needs, so a compromised action
# in one job cannot reach another's APIs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

  # **A constant, and it has to stay one.** buildx propagates `SOURCE_DATE_EPOCH` from its own
  # environment into the solve as `build-arg:SOURCE_DATE_EPOCH`, so its value is part of every
  # BuildKit cache key in this repository — there is no channel that reaches the exporter without
  # also reaching the build. Two attempts to make it the commit timestamp have now failed for the
  # same reason: the value then differs between the run that *writes* a cache tag and the run that
  # *reads* it, and every `cache-from` in both workflows is a total miss. Declared at workflow
  # level rather than per step so a new `docker/build-push-action` cannot silently opt out;
  # `xtask repo-lint` holds this file and release-please.yaml to the same value.
  #
  # Zero is the documented "no meaningful build time" value, and it is what makes rebuilding a tag
  # byte-identical *across* commits rather than only within one. The cost is that the image config
  # records `created: 1970-01-01`; nothing reads it, and the tag is what identifies a release.
  SOURCE_DATE_EPOCH: "0"
  # Resolve sqlx's query macros from the committed `.sqlx/` cache instead of a live database; the
  # `sqlx` job below is what verifies that cache against the real schema.
  SQLX_OFFLINE: "true"

  # Tool versions pinned in `run:` blocks rather than a manifest. The `renovate:` comments are the
  # only thing that makes them visible to Renovate — without one, a pin is never updated.
  #
  # Fetch this one from the GitHub release, which is the source this pin tracks. The
  # `storage.googleapis.com/container-structure-test` mirror the install steps used to read stopped
  # being published after v1.16.0, so every version Renovate can propose 404s there.
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CONTAINER_STRUCTURE_TEST_VERSION: 1.22.1
  # Must match the `sqlx` in `Cargo.lock`: a CLI from a different minor writes a query cache the
  # workspace then rejects.
  SQLX_CLI_VERSION: 0.9.0

jobs:
  # Which gates this diff can affect, plus the toolchain and MSRV read from their manifests.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to check out the tree and diff it against the base
    outputs:
      full: ${{ steps.decide.outputs.full }}
      images: ${{ steps.decide.outputs.images }}
      arches: ${{ steps.depsscope.outputs.arches }}
      arm64: ${{ steps.depsscope.outputs.arm64 }}
      toolchain: ${{ steps.versions.outputs.toolchain }}
      msrv: ${{ steps.versions.outputs.msrv }}
      buildcache: ${{ steps.buildcache.outputs.ref }}
      deps_scope: ${{ steps.depsscope.outputs.scope }}
      # Each is `true` on a full run, so a downstream job only tests its own filter. A skipped
      # filter step yields `''`, which is not `'true'`.
      rust: ${{ steps.decide.outputs.full == 'true' || steps.filter.outputs.rust == 'true' }}
      frontend: ${{ steps.decide.outputs.full == 'true' || steps.filter.outputs.frontend == 'true' }}
      docker: ${{ steps.decide.outputs.full == 'true' || steps.filter.outputs.docker == 'true' }}
      notices: ${{ steps.decide.outputs.full == 'true' || steps.filter.outputs.notices == 'true' }}
      compose: ${{ steps.decide.outputs.full == 'true' || steps.filter.outputs.compose == 'true' }}
      readme: ${{ steps.decide.outputs.full == 'true' || steps.filter.outputs.readme == 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # `fetch-depth: 0` because `persist-credentials: false` leaves `dorny/paths-filter` no token
      # to fetch the base with; a full clone means it never needs one.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: decide scope
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.full }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ] || [ "$FORCE" = "true" ]; then
            full=true
          else
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "::notice::full run: $full (event: $EVENT)"

          # Narrowed on pull requests: seven of the eight images are the same Dockerfile path
          # with a different `BIN`, and `render` is the only one with its own runtime stage. All
          # eight build on `main` and on the weekly run, so nothing ships unbuilt. `xtask` is not
          # among them: the deploy blacklist (`[workspace.metadata.deploy.exclude]`, root
          # `Cargo.toml`) keeps it out of every registry, and `repo-lint` fails if it appears
          # here. The install steps a deployment runs are in `bootstrap`, which does ship.
          if [ "$EVENT" = "pull_request" ] && [ "$full" != "true" ]; then
            echo 'images=["api","render"]' >> "$GITHUB_OUTPUT"
          else
            echo 'images=["api","bootstrap","worker","control-plane","notifier","sync","challenge-solver","render"]' >> "$GITHUB_OUTPUT"
          fi

      # The only place that reads these manifests. It fails loudly rather than defaulting: a silent
      # fallback would install "whatever stable is today".
      - name: resolve the toolchain and the MSRV from their manifests
        id: versions
        run: |
          set -euo pipefail
          # No `| head -n1`: under `pipefail` an early-exiting `head` SIGPIPEs the writer and turns
          # a successful read into a failed step. The emptiness checks below catch a rename.
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$toolchain" ]; then
            echo '::error::no channel = "…" line in rust-toolchain.toml'
            exit 1
          fi
          if [ -z "$msrv" ]; then
            echo '::error::no rust-version = "…" line in Cargo.toml'
            exit 1
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "::notice::toolchain $toolchain, MSRV $msrv"

      # Derived, never hard-coded, so a repository rename cannot leave the warm-ups writing one
      # reference and the consumers reading another. Lowercased because a registry reference must
      # be and `github.repository` keeps the owner's capitalisation.
      - name: resolve the buildkit cache repository
        id: buildcache
        run: |
          set -euo pipefail
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/buildcache" >> "$GITHUB_OUTPUT"

      # Which cache tag `docker-deps` may export to, or empty for "export nothing". Read that
      # job's comment for why a pull request must not write `backend-deps-<arch>`.
      #
      # `release-pr-deps-<arch>` is the one pull-request export, and it is what stops a release
      # compiling a tree this workflow has already compiled. The release PR's *build context* is
      # byte-identical to the merge commit's — `.dockerignore` drops `CHANGELOG.md`, `.github/`
      # and the release-please manifest, which leaves the `Cargo.toml` version bump and the
      # synced `Cargo.lock`, and merging changes neither — so `release-please.yaml`'s warm-up
      # imports this instead of recompiling all 26 workspace crates on both architectures while
      # this workflow compiles the same thing beside it. A stale or absent tag is a slow release,
      # not a broken one: the warm-up rebuilds and the legs read what it exports.
      #
      # Safe only because of *which* branch, and both halves of that are load-bearing.
      #
      # The `Release Please Branches: Trusted Bots Only` ruleset restricts creation, update,
      # deletion and non-fast-forward on `refs/heads/release-please--**` to two bypass Apps and
      # requires signed commits, so no human push can reach this tag.
      #
      # That ruleset governs refs in *this* repository only. `github.head_ref` is the pull
      # request's head **branch name**, which for a fork is a name its author chose freely — a
      # fork branch called `release-please--branches--main` matches the prefix and is governed by
      # nothing. So the head repository is checked as well, and the prefix test only means
      # anything after it. A fork's `GITHUB_TOKEN` is read-only and its export would 403 anyway,
      # but that is a consequence of how Actions issues tokens, not a rule this file states, and
      # the tag is an input to the workflow that publishes signed images.
      # This step also decides the architecture set, because the answer is the same predicate.
      #
      # arm64 is native-only — no QEMU, since BoringSSL under emulation costs upwards of an hour
      # an image — so warming it is a second full compile of the workspace: 30 minutes beside the
      # amd64 leg, on a runner nothing else in the graph waits for. Ordinary pull requests no
      # longer pay it. What that gives up is narrower than the warning on `docker-arm64`, which is
      # about arm64 breaking at a *tag*: `main` still builds both architectures, and no tag is cut
      # from a commit `main` has not built, so a bad arm64 merge surfaces minutes after the merge
      # rather than at release. A pull request stops catching it before the merge.
      #
      # **A pull request exports too, to a tag of its own, and that is what stops the same build
      # running four times.** Until it did, `deps_scope` was empty on an ordinary pull request, so
      # this warm-up compiled for 37 minutes and published nothing — and each of `docker`,
      # `docker-frontend` and `docker-arm64`, which wait on it, then rebuilt the identical chain
      # because `backend-deps-<arch>` off `main` is keyed on `main`'s Dockerfile and misses the
      # moment this branch touches it. Measured on one such run: warm-up 37m, then api 38m,
      # render 40m and frontend 40m, all after it. 78 minutes of wall clock for 37 minutes of
      # work done four times.
      #
      # `pr-<number>-deps` rather than one shared pull-request tag: two `mode=max` exporters
      # writing one tag is the write race this file warns about elsewhere, and concurrent pull
      # requests would be exactly that. One tag per pull request per architecture is bounded by
      # the number of open pull requests, and each is rewritten rather than added to on a push.
      # Nothing prunes them yet, which is a housekeeping debt, not a correctness one.
      #
      # The fork check governs the export for the reason spelled out above this step, and it now
      # governs three tag families rather than one.
      - name: decide the deps cache scope and architecture set
        id: depsscope
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ steps.decide.outputs.full }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          scope=''
          release_pr=false
          if [ "$EVENT" = "pull_request" ]; then
            if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
              case "$HEAD_REF" in
                release-please--*) scope='release-pr-deps'; release_pr=true ;;
                *) scope="pr-${PR_NUMBER}-deps" ;;
              esac
            fi
          else
            scope='backend-deps'
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "::notice::deps cache export scope: ${scope:-none}"

          # arm64 no longer follows `scope`, because `scope` is now set on ordinary pull requests
          # too. It follows what a *later* run reads: `backend-deps-arm64` off `main` and
          # `release-pr-deps-arm64` off the release pull request, which `release-please.yaml`
          # imports instead of recompiling the identical tree. An ordinary pull request's arm64
          # leg is read by nothing after the run ends.
          amd64='{"arch":"amd64","runner":"ubuntu-latest"}'
          arm64='{"arch":"arm64","runner":"ubuntu-24.04-arm"}'
          if [ "$EVENT" != "pull_request" ] || [ "$FULL" = "true" ] || [ "$release_pr" = "true" ]; then
            echo "arm64=true" >> "$GITHUB_OUTPUT"
            echo "arches=[${amd64},${arm64}]" >> "$GITHUB_OUTPUT"
          else
            echo "arm64=false" >> "$GITHUB_OUTPUT"
            echo "arches=[${amd64}]" >> "$GITHUB_OUTPUT"
          fi

      # Skipped on `schedule` and `workflow_dispatch`: those runs are already `full`, so every
      # consumer reads `true` regardless.
      - name: path filters
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Anchors, not repetition: `workflows` is an input to everything (rule 1 above) and
          # `rust` is an input to `docker`, so both are declared once and aliased.
          filters: |
            workflows: &workflows
              - '.github/workflows/ci.yml'
              # The composite actions the jobs below call are an input exactly as the workflow
              # body is: a change to one changes what every Rust job installs.
              - '.github/actions/**'
            rust: &rust
              - *workflows
              - 'crates/**'
              - 'services/**'
              - 'xtask/**'
              - 'fuzz/**'
              - 'migrations/**'
              - '.sqlx/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'deny.toml'
              - 'openapi.json'
              # The published configuration contracts, listed for the reason `openapi.json` is:
              # a hand-edit of a generated document is caught by the gate that would otherwise
              # only notice it the next time one of its inputs moved.
              - 'docs/contracts/**'
              # The Dockerfile, for the `LABEL` regions in it, and the `justfile`, which is what
              # writes them. `xtask config-contract` in the `test` job is the only cheap thing
              # that names a mismatch in either: `auto-fix.yaml` writes the documents and
              # deliberately does not touch a Dockerfile, and the `docker` jobs catch it on the
              # built image twenty minutes later. A branch that edits the block and nothing else
              # is exactly the branch that should hear about it first.
              - 'deploy/docker/Dockerfile'
              - 'justfile'
              - '.github/coverage-floor.txt'
            frontend:
              - *workflows
              - 'web/frontend/**'
              - 'crates/api-client/**'
              - 'openapi.json'
            # Everything `THIRD-PARTY-NOTICES` is a function of. Both lockfiles, because the
            # document covers both dependency graphs, and the artefact itself, so a hand-edit of
            # generated licence text is caught by the job that would have overwritten it.
            notices:
              - *workflows
              - 'about.toml'
              - 'web/frontend/about.toml'
              - 'Cargo.lock'
              - 'web/frontend/Cargo.lock'
              - 'THIRD-PARTY-NOTICES'
              - 'xtask/**'
            docker:
              - *rust
              - 'deploy/docker/**'
              - 'web/frontend/**'
            compose:
              - *workflows
              - 'deploy/docker-compose.yml'
            # Everything the rendered `README.md` is a function of: the template, the script that
            # collects the variables, and the three files it reads them out of. The artefact
            # itself is listed too, so a hand-edit of a generated document fails the gate that
            # would otherwise only notice it the next time an input moved.
            readme:
              - *workflows
              - '.github/templates/README.md.hbs'
              - '.github/scripts/readme-variables.sh'
              - 'README.md'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'deploy/docker-compose.yml'

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from `rust-toolchain.toml` via the `changes` job; naming it here is how the
      # two drift apart.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
          components: rustfmt, clippy
      # Saver for the `lint` group. `rust-cache` keys on `github.job` unless told otherwise, so
      # every job here used to keep a private copy of one identical dependency graph: eleven
      # caches of the same ~600 crates, none of which fit alongside the others. Jobs are grouped
      # by the artefact cargo actually fingerprints instead — this group is metadata-only
      # (`clippy`/`check`, `RUSTFLAGS=-D warnings`), `test` is codegen, and `features`, `msrv`,
      # `coverage` and the frontend workspace each fingerprint differently enough to need their
      # own. Sharing is only ever worth a cache where the members compile the same graph: the
      # grouping below is what the measured job times supported, not what the shapes suggested.
      #
      # Exactly one job per group writes. With several savers behind one key the content is
      # whichever leg finished first — a check-only leg winning the race leaves the group's cache
      # without the artefacts its other members came for. The rest carry `save-if: false`, which
      # still restores.
      #
      # **A group is named for the job that saves it**, never for its shape. A `shared-key` becomes
      # the key segment `rust-cache` otherwise fills from `github.job`, so naming a group after its
      # saver means the key is the one that job already wrote — the existing cache is inherited
      # rather than orphaned. Naming this group `check` and the one below `build` cost 2.5 GB of
      # current, already-populated cache that nothing could reach again until `main` rebuilt it.
      #
      # `cache-on-failure` because a job that compiled the whole graph and then failed a lint has
      # produced exactly the artefacts the next run wants; throwing them away made a red `main`
      # cost every later run a cold build.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # `wreq` compiles BoringSSL from C/C++ source. Eight jobs here need the same three packages
      # and each used to carry its own `apt-get` line; the action owns the retry and the timeout
      # that none of the copies had — see it for the 20-minute stall that bought them.
      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      # Unconditional: seconds long, and a formatting slip can arrive in any commit.
      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The invariants no compiler sees — a CSP and the HTML it governs, a secret published in the
      # compose file and the code that refuses it. Unconditional, unlike clippy: it reads HTML,
      # YAML and compose files, so the Rust filter would skip it on the diffs it exists to catch.
      - name: repository invariants
        run: cargo run -p xtask -- repo-lint

  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
      # Saver for the `test` group — the widest codegen build in the workflow, so what it stores
      # covers `integration` and `mutants` too. See `lint` for why the groups exist.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      - name: cargo test
        run: cargo test --workspace --all-targets

      # `--all-targets` silently EXCLUDES doc tests; this is the run that compiles them.
      - name: doc tests
        run: cargo test --workspace --doc

      # And this resolves the *links*: `cargo test --doc` never looks at a `[`Foo`]`, so a broken
      # intra-doc link renders as literal bracket text and nothing notices. `crates/api-client` is
      # exempt by construction — it declares its own `[lints]` table and inherits nothing.
      - name: rustdoc (intra-doc links)
        run: cargo doc --workspace --no-deps --all-features

      # Fails if a backend DTO changed without regenerating `openapi.json` and `crates/api-client`.
      # The pre-commit hook normally catches this; this is the backstop for commits made without it.
      - name: OpenAPI artifacts are up to date
        run: cargo run -p xtask -- openapi --check

      # The nine documents each published image carries, plus the `LABEL` regions the Dockerfile
      # writes by hand. This is the *source* half — the built-image half lives in the `docker`
      # jobs, and only that one is evidence — but it is the half that names a renamed key in the
      # pull request that renamed it, one step before a build is spent finding out.
      # `auto-fix.yaml` regenerates the documents and commits them back; the `LABEL` regions it
      # reports rather than rewrites.
      #
      # No `--check` any more, because there is no other mode: `just regenerate` is the writer.
      # Two commands rather than one flag is what stops the gate from carrying its own copy of
      # the rendering it is judging.
      - name: the published configuration contracts are up to date
        run: cargo run -p xtask -- config-contract
      # `docs/CONFIGURATION.md` is gated too, but by `xtask::config_docs` under `cargo test` above —
      # it is prose, so there is nothing to regenerate. `xtask -- config-docs` prints the surface.

  # Every other job compiles the one feature set the services happen to select, so a
  # `#[cfg(feature = ...)]` that stops compiling with a feature off — or a crate that only builds
  # because a sibling unified a feature onto it — would be caught nowhere.
  #
  # No Windows or macOS leg, deliberately: every artifact is a musl binary in a `scratch` or Debian
  # image, and the Windows hazards this project actually hits are tooling ones no CI leg detects.
  features:
    name: feature combinations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
      # Its own group, measured rather than assumed: `--all-features` resolves a wider dependency
      # graph than any other job compiles, so sharing `lint` left this one rebuilding the
      # difference and it went from 1m13s to 3m27s — the slowest of the seven and the run's new
      # critical path. Consolidation is worth a cache only where the members' graphs match.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: features
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      # Libraries only: the service binaries require their features, so a workspace-wide
      # `--no-default-features` would fail for reasons that are not bugs.
      # `xtask` is here for a different reason than the rest: `release-please.yaml` runs
      # `release-plan` with `--no-default-features` to keep the job that decides what a signed
      # release publishes off a 654-crate build, so this configuration has to keep compiling or
      # the next release is the first thing to notice.
      - name: crates with no default features
        run: |
          cargo check --no-default-features \
            -p tankovault-domain -p tankovault-service -p tankovault-config \
            -p tankovault-contracts -p tankovault-fetch -p tankovault-solver \
            -p tankovault-matcher -p tankovault-auth -p tankovault-email \
            -p xtask

      - name: workspace with all features
        run: cargo check --workspace --all-targets --all-features

  # Recompiles every `query!` macro against a real migrated Postgres and fails if `.sqlx/` is
  # stale. Every other job only consumes the cache offline, so this is what keeps the SQL verified.
  # Gated on the whole `rust` filter: the macros are used from five crates, so anything narrower
  # would be a claim about where SQL lives that is not true.
  sqlx:
    name: sqlx offline cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read # to check out the code
    services:
      postgres:
        # Digest-pinned: a floating tag is an unreviewed change to the database the `.sqlx` cache
        # is verified against, and the verification only means something against a known one.
        # Renovate moves the digest; `renovate.json` holds major bumps for a human.
        #
        # `pgvector/pgvector`, not stock `postgres`: this job re-derives the cache by applying
        # every migration, and `0027_recsys_signals` runs `CREATE EXTENSION vector`. Stock
        # Postgres cannot, so the job fails at schema setup having verified nothing. Same image
        # as `deploy/docker-compose.yml` and the integration harness — `xtask repo-lint` holds all
        # three to each other.
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tankovault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Overrides the workflow-wide offline default: the point is to re-derive from the database.
      SQLX_OFFLINE: "false"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tankovault
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
      # `SQLX_OFFLINE=false` re-derives the workspace crates against the live database, but that is
      # a workspace-crate fingerprint and `rust-cache` discards those anyway — the dependency
      # graph this restores is the same one `check` stores.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          save-if: false

      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      # Version-pinned: the CLI writes the cache this workspace has to read back.
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked --version "$SQLX_CLI_VERSION"

      - name: apply migrations
        run: sqlx migrate run --source migrations

      - name: offline query cache is up to date
        run: cargo sqlx prepare --workspace --check

  # Stands up an ephemeral Postgres via testcontainers and drives the real Axum router in-process,
  # so authorization regressions fail here. Gated behind each crate's `integration` feature, which
  # is why the offline `test` job above never touches Docker.
  integration:
    name: integration (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, lint, test]
    # `!cancelled() && !failure()` rather than the default: it still refuses to run when `lint`
    # or `test` failed, but does not inherit their *skip*. Written this way everywhere a job has
    # more than one `needs`.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.rust == 'true' }}
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false

      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      # Inherited SQLX_OFFLINE resolves the macros from the cache at compile time; the container
      # supplies the live database at runtime.
      - name: repo + HTTP access-control + sync-reconciliation integration suites
        run: cargo test -p tankovault-db -p tankovault-api -p tankovault-sync --features integration

  # `openapi --check` only proves the artifacts match the code: removing an endpoint or making an
  # optional field required passes it cleanly once regenerated. The SPA ships as its own image, so
  # a skew window always exists and a breaking change lands as a deserialization failure in
  # somebody's browser. Pull requests only — a push to `main` has no base spec to compare against.
  openapi-breaking:
    name: openapi breaking changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    permissions:
      contents: read # to check out both revisions of the spec
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch's `openapi.json` must be reachable; a shallow clone's single commit
          # is not.
          fetch-depth: 0
          persist-credentials: false

      # `github.base_ref` goes through the environment, never `${{ }}` inside the script: a branch
      # name is attacker-controlled text on a fork pull request, and interpolating it into a shell
      # command is how it becomes one.
      #
      # Written into the workspace and passed as a *relative* path, exactly like `revision` below.
      # The step after this is a Docker container action, and a host path does not survive the
      # boundary: the runner does mount `RUNNER_TEMP`, but at `/github/runner_temp`, so a
      # `${RUNNER_TEMP}/…` path resolves to nothing inside the container while the step that
      # wrote it reports success. Being mounted is not the same as being at the same path. The
      # workspace is the container's working directory, so a relative path needs no translation.
      - name: the base branch's spec
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git show "origin/${BASE_REF}:openapi.json" > base-openapi.json

      # Pinned by digest: an action on a mutable ref is an unreviewed code change on every run.
      # Renovate moves the pin, and `renovate.json` keeps oasdiff explicitly enabled because its
      # 0.x versioning would otherwise park every minor on the dashboard.
      - uses: oasdiff/oasdiff-action/breaking@2649ebe137aeb72a95707671204e829f86e091fc # v0.1.13
        with:
          base: base-openapi.json
          revision: openapi.json
          # `ERR` only: gating on oasdiff's warning level would fail every PR that adds a field.
          fail-on: ERR
          # Deliberate breaks, each with its reason. A *relative* path for the same reason as
          # `base` above: this is a Docker container action, and a host path does not survive
          # the boundary. The file explains what may go in it — the short version is that an
          # entry claims `web/frontend` is the only consumer of that operation.
          err-ignore: .github/oasdiff-ignore.txt

  # `web/frontend` is outside the host workspace, so no job above touches it. Its tests and its
  # own `clippy::pedantic` set run here or nowhere.
  #
  # It builds two ways from one source tree — `web` (the wasm32 SPA, the default) and `desktop`
  # (a wry webview, shipped as installers by `release-please.yaml`) — and both are gated here.
  # Without the desktop legs, a `#[cfg(feature = "web")]` that stops compiling on the other side
  # is first noticed by a release, which is the worst place to find it.
  frontend:
    name: frontend (fmt + test + clippy + wasm32 + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own group: a separate workspace with a separate lockfile, so it shares no
          # dependency artefact with the host groups. Saves itself for the same reason.
          workspaces: web/frontend
          shared-key: frontend
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # The `lint` job's `cargo fmt --all --check` runs in the host workspace, which this crate is
      # not a member of — so without this line nothing formats it, and three files had already
      # drifted by the time anyone looked.
      - name: rustfmt
        working-directory: web/frontend
        run: cargo fmt --check

      # Host target: these are pure logic tests with no DOM dependency. Anything needing a DOM
      # would need wasm-bindgen-test.
      - name: cargo test (host)
        working-directory: web/frontend
        run: cargo test

      - name: clippy (pedantic, as declared by the crate)
        working-directory: web/frontend
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check (wasm)
        working-directory: web/frontend
        run: cargo check --target wasm32-unknown-unknown

      # The desktop build links `wry`, which on Linux is `WebKitGTK`. These are the same packages
      # the release job installs and the `.deb`'s `depends` names at runtime.
      - name: desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev libayatana-appindicator3-dev

      # `--no-default-features`: `web` is the default and the two are mutually exclusive, which
      # `src/platform/mod.rs` states to the compiler.
      - name: cargo test (desktop)
        working-directory: web/frontend
        run: cargo test --no-default-features --features desktop

      - name: clippy (desktop)
        working-directory: web/frontend
        run: cargo clippy --no-default-features --features desktop --all-targets -- -D warnings

  # `assets/main.css` is Tailwind output committed so a build without Node works. Unchecked, a
  # class used in `rsx!` can silently have no style behind it.
  css:
    name: tailwind output is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: install the Tailwind CLI
        working-directory: web/frontend
        run: npm ci

      - name: rebuild and compare
        working-directory: web/frontend
        run: |
          npm run css:build
          if ! git diff --quiet -- assets/main.css; then
            echo "::error::assets/main.css is stale. Run 'npm run css:build' in web/frontend and commit the result."
            git diff --stat -- assets/main.css
            exit 1
          fi

  # Catches an accidentally committed credential at the pull request, the only point where the fix
  # is cheap. Unconditional by design: a path filter here would be a list of the places nobody
  # leaks credentials. `.gitignore` matching `*.env` by suffix is the other half.
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the full history
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in the tip commit is still a leaked secret.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds with the *minimum* toolchain, overriding `rust-toolchain.toml` on purpose. The number
  # comes from `Cargo.toml` via the `changes` job, so the claim and its check cannot disagree.
  msrv:
    name: MSRV (${{ needs.changes.outputs.msrv }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.msrv }}
      # Its own group, and it must stay that way: this leg builds on the MSRV compiler with
      # `RUSTFLAGS` cleared, so every fingerprint below differs from the `lint` group's. Sharing
      # the key would hand it a cache it can only discard.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      # `--locked` measures this lockfile's dependency set, not whatever a resolver picks today.
      # `RUSTFLAGS` is cleared: `-D warnings` would fail on lints an older compiler happens to
      # emit, which is not what MSRV means.
      - name: cargo check
        env:
          RUSTFLAGS: ""
          RUSTUP_TOOLCHAIN: ${{ needs.changes.outputs.msrv }}
        run: cargo check --workspace --locked

  # A ratchet, not a target: a percentage target invites tests written to move a number, while a
  # floor answers "did this change make it worse". The floor is `.github/coverage-floor.txt`, which
  # is in the `rust` filter so editing it re-runs the measurement it describes. No
  # `continue-on-error` — a gate that cannot fail is a knob nobody should believe in. The
  # measurement excludes `--features integration`, matching every other fast job, which is why
  # `coverage-integration` below exists and carries a separate floor.
  coverage:
    name: coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
          components: llvm-tools-preview
      # Its own group. `cargo llvm-cov` injects `-C instrument-coverage`, which changes every
      # dependency's fingerprint, so nothing the `test` group stores is reusable here and
      # nothing this stores is reusable there.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov

      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      - name: cargo llvm-cov
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --all-targets --summary-only
          cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/coverage.json

      # Tee'd into the run summary so the "consider raising it" suggestion lands on the run page
      # rather than only in a log nobody opens when the job is green — the floor file's own
      # maintenance rule depends on somebody reading that line. `pipefail` is load-bearing: the
      # default shell is `bash -e`, where `tee` supplies the pipeline's exit status and a
      # regressed ratchet would report success.
      - name: compare against the committed floor
        run: |
          set -euo pipefail
          status=0
          cargo run -p xtask -- coverage-ratchet | tee "$RUNNER_TEMP/ratchet.txt" || status=$?
          {
            echo '### Coverage ratchet — offline suite'
            echo '```'
            cat "$RUNNER_TEMP/ratchet.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The other half of the ratchet. `coverage` above builds without `--features integration`, so
  # the 118 `crates/db`, 86 `services/api` and 55 `services/sync` tests never run there and code
  # only they reach is not counted as covered by anything — a regression in it moves no number in
  # CI at all. This job measures the same workspace with those suites on, against its own floor in
  # `.github/coverage-floor-integration.txt`. Two files, never one: the values cover different
  # test sets, so either substituted for the other is a gate that can never pass or never fail.
  #
  # Gated on `full` like `mutants`, and for its reason: Docker, the migrations and an instrumented
  # build of the whole workspace is not a per-pull-request budget. Unlike `mutants` it is **not**
  # `continue-on-error` — the outcome is a comparison against a committed number, not a function of
  # how long the run got. The floor ships as the `unset` sentinel, so the first run reports what it
  # measured and passes; committing that value is what arms the gate.
  coverage-integration:
    name: coverage ratchet (integration)
    runs-on: ubuntu-latest
    # Longer than the 45 of `coverage` and of `integration`: this leg is both of them at once, and
    # `-C instrument-coverage` is paid on every dependency as well as on the suites it runs.
    timeout-minutes: 90
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
          components: llvm-tools-preview
      # Its own group, distinct from `coverage`: instrumented *and* built with a feature the other
      # measurement does not enable, so every fingerprint differs from that group's. Nothing else
      # reads this key, and the weekly `schedule` run is on `main`, so it is the writer as well as
      # the reader.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: coverage-integration
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov

      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      # Same scope as `coverage` so the two are about the same code, plus the feature. The suites
      # stand their own Postgres up via testcontainers against the runner's Docker, exactly as the
      # `integration` job does; inherited `SQLX_OFFLINE` still resolves the macros at compile time.
      - name: cargo llvm-cov (integration)
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --all-targets --features integration --summary-only
          cargo llvm-cov report --json --summary-only \
            --output-path target/llvm-cov/coverage-integration.json

      # Reports on the summary either way — while the floor is `unset` that report *is* the
      # deliverable, since it carries the number to commit. See the `coverage` job for why
      # `pipefail` is not optional here.
      - name: compare against the committed integration floor
        run: |
          set -euo pipefail
          status=0
          cargo run -p xtask -- coverage-ratchet --integration \
            | tee "$RUNNER_TEMP/ratchet.txt" || status=$?
          {
            echo '### Coverage ratchet — integration suite'
            echo '```'
            cat "$RUNNER_TEMP/ratchet.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # What coverage cannot answer: a line executing is not a line anything asserted on. `cargo
  # mutants` rewrites one function body at a time and re-runs the tests; a surviving mutant is a
  # behaviour change nothing checked. Scoped to the four pure decision cores by
  # `.cargo/mutants.toml` — the rest of the workspace is I/O-shaped, where mutants mostly time out.
  #
  # Advisory and scheduled-only: an outcome that depends on how long the run got should not block a
  # merge, and a survivor is triage work done on a report you go and read. Force one with
  # `workflow_dispatch` + `full`.
  mutants:
    name: mutation testing (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    continue-on-error: true
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
      # Reads the `test` group and writes nothing: mutants rebuilds the same test binaries, and
      # it is scheduled-only, so letting it save would hand the group a cache written once a week
      # from a run nobody gates on.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-mutants

      - name: BoringSSL build dependencies
        uses: ./.github/actions/boringssl-deps

      - name: cargo mutants
        run: cargo mutants --in-place --no-shuffle

      # Uploaded either way: `outcomes.json` feeds the next triage, `missed.txt` is what to read.
      - name: mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 14

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # `rust` covers `deny.toml` and both lockfiles. The advisory half is time-dependent, which is
    # what the weekly `schedule` run is for — `rust` is `true` there by construction.
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # `-D unnecessary-skip` makes the duplicate-version budget shrink visibly: without it a
          # skip outlives the duplicate it records, so the list only ever grows.
          command: check advisories licenses sources bans
          # `command-arguments`, not `arguments`: the action composes
          # `[arguments] [command] [command-arguments]`, and cargo-deny only accepts `-D` after
          # the subcommand.
          command-arguments: -D unnecessary-skip

  # `cargo-deny` above decides which licences may enter the graph. This decides whether their
  # terms actually ship: `THIRD-PARTY-NOTICES` is committed, copied into every image beside
  # `/LICENSE`, and served to readers at `/third-party-notices` — so a lockfile change that adds
  # a crate and leaves the document behind publishes a binary distribution whose notices are
  # incomplete, and nothing else would say so.
  #
  # Not part of `xtask ci`: that gate is deliberately cargo-and-rustfmt-only, and folding this in
  # would make `cargo-about` a prerequisite for every developer running it.
  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.notices == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}
      # Its own group, and small: this job compiles `xtask` and nothing else, so what it is really
      # caching is the two extracted dependency graphs `cargo fetch` unpacks below. It answers to
      # the `notices` filter, which the other groups' savers do not, so it cannot borrow one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: notices
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-about

      # Generation runs `--frozen`, which is what makes the artefact reproducible — but offline
      # means the licence *files* have to already be on disk, and they live in the extracted
      # crate sources. `cargo fetch` unpacks them; without this the run would harvest nothing and
      # report drift that does not exist. Both graphs, because `web/frontend` is its own
      # workspace with its own lockfile.
      #
      # **Every target the `about.toml` files name, explicitly.** `cargo fetch` resolves for the
      # *host* unless told otherwise, so a Linux runner never unpacks a Windows-only crate and
      # cargo-about silently omits it — while a developer regenerating on Windows omits the
      # Linux-only ones instead. The two then overwrite each other for ever, each "fixing" drift
      # the other introduced, and the committed document is incomplete on both. It only became
      # visible when `web/frontend` grew target-specific dependencies (`rfd` pulls `ashpd` on
      # Linux; the passkey backend is Windows-only); before that its graph was wasm alone.
      - name: fetch every dependency graph, for every target the notices cover
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path web/frontend/Cargo.toml

      - name: notices drift
        run: cargo run -p xtask -- notices --check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read # to check out the code
      checks: write # the action reports advisories as a check run
      issues: write # and opens an issue instead, on the scheduled run
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `stable`, overriding `rust-toolchain.toml` for this step: `cargo-audit` is built from
      # source and tracks current stable, so under the project's pin `cargo install` refuses and
      # the job fails without ever reading an advisory. Auditing reads `Cargo.lock`, not the
      # workspace, so the result is unaffected.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # `cargo-deny` and `cargo-audit` catch *vulnerable* dependencies; neither notices a dependency
  # set that quietly changed. A PR bumping a version range without regenerating the lockfile passes
  # every other gate, then builds an image from a different resolution than the one reviewed.
  supply-chain:
    name: lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read # to check out the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: ${{ needs.changes.outputs.toolchain }}

      # `--locked` makes cargo refuse to touch `Cargo.lock`; resolving metadata forces it to notice
      # the lockfile does not satisfy the manifests.
      #
      # Deliberately no `--offline`: resolving metadata reads each dependency's manifest from the
      # extracted `.crate`, and this job has no cache step, so `--offline` failed on the first
      # crates.io dependency rather than on any real drift — a gate that fails whatever the
      # lockfile says.
      - name: Cargo.lock satisfies every manifest
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Same guarantee for `web/frontend`, which has its own lockfile no job above covers — and is
      # why this job also answers to the `frontend` filter.
      - name: web/frontend Cargo.lock satisfies its manifest
        working-directory: web/frontend
        run: cargo metadata --locked --format-version 1 > /dev/null

  # The Prometheus rules, dashboards and their promtool tests were here until 2026-08-03. They now
  # live in `TimSchoenle/helm-charts` (`charts/tankovault`), which is what actually deploys them,
  # and are gated by that repository's own chart tests. What survives is the check that the
  # deployable compose file still parses — that file did not move.
  compose:
    name: compose file is valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.compose == 'true'
    permissions:
      contents: read # to check out the config
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches an unresolvable anchor, a duplicated key, a colliding service.
      #
      # One entry per `${VAR:?…}` in the compose file, and the list is exhaustive on purpose:
      # `config` stops at the *first* unset required variable, so a missing entry here fails this
      # job with a message about a secret rather than about the file it exists to check.
      # To check: `grep -oE '\$\{[A-Z_]+:\?' deploy/docker-compose.yml`.
      - name: compose file parses
        env:
          TANKOVAULT_AUTH__JWT_SECRET: ci-validation-only
          TANKOVAULT_SEED_ADMIN_PASSWORD: ci-validation-only
          TANKOVAULT_ANILIST__TOKEN_ENCRYPTION_KEY: ci-validation-only
          TANKOVAULT_INTERNAL_TOKEN_API: ci-validation-only
          TANKOVAULT_INTERNAL_TOKEN_WORKER: ci-validation-only
        run: docker compose -f deploy/docker-compose.yml config --quiet

  # `README.md` is generated from `.github/templates/README.md.hbs` (ENGINEERING_GUIDE rule 6).
  # This is the half of that claim which holds on the branches nothing can commit to: a push to
  # `main`, and a pull request from a fork. `auto-fix.yaml`'s `readme` job renders and commits
  # everywhere else.
  #
  # Without it, editing `README.md` directly would appear to work right up until the next pull
  # request silently reverted it — and the numbers the document quotes would be back to being
  # maintained by hand, which is how the tech-stack line came to advertise a Postgres and a Redis
  # major behind the ones the compose file has been running for months.
  #
  # `check: true` writes nothing and reports the first differing line, so the log says whether it
  # is a real change or a stray newline.
  readme:
    name: README is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.readme == 'true'
    permissions:
      contents: read # to check out the template and the document it renders to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Invoked through `bash` rather than executed: this repository is authored on Windows,
      # where git does not record the executable bit.
      - name: collect the README variables
        id: variables
        run: echo "json=$(bash .github/scripts/readme-variables.sh)" >> "$GITHUB_OUTPUT"

      - name: README.md matches its template
        uses: TimSchoenle/actions/actions/common/render-template@3b7d152374ee63e720e7c16bed8b088b40554911 # tag=actions-common-render-template-v1.1.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.json }}
          check: true

  # The one compile every image below is built on. `cook` and `builder` are the entire wall clock
  # of an image build; everything above them is a `COPY` onto `scratch`.
  #
  # Built once per architecture under its own cache scope, which every consumer imports read-only.
  # Run inside the image matrix instead, every leg cooked the identical graph and all of them
  # exported into the same unscoped GHA cache concurrently — the writes raced, and the matrix kept
  # missing a cache it had just populated. `builder` takes no `ARG BIN`, so every leg's key for it
  # is identical and each leg is a cache hit plus a `COPY`. `cacheonly` because only the layers are
  # wanted.
  #
  # The tag is **arch-qualified** because a BuildKit cache is not portable across architectures:
  # the `chef` base resolves to a different digest per platform, so every key downstream of it
  # differs and an amd64 export is a guaranteed miss on an arm64 build. `release-please.yaml`
  # builds all nine images for both architectures and imports these tags; while the tag was
  # unqualified its nine arm64 legs silently got nothing and cooked ~600 crates each.
  #
  # `platforms` is stated rather than left to default to the host, here and at every consumer, so
  # the key a warm-up writes and the key a consumer looks up are visibly the same thing.
  #
  # **`type=registry`, not `type=gha`.** These exports are the largest thing this repository
  # caches — `mode=max` on both architectures held ~9.5 GB of a 10 GB Actions budget — and the
  # budget is per repository and LRU, so they were evicting the Rust caches every other job here
  # depends on and then being evicted in turn. GHCR is unmetered for public packages, is not
  # LRU-evicted, and one tag is readable from pull requests, from `main` and from
  # `release-please.yaml` without the ref scoping the Actions cache imposes. `image-manifest` and
  # `oci-mediatypes` are both required: GHCR rejects the cache manifest BuildKit writes without
  # them.
  #
  # `cache-to` only off `main`, because a registry tag has no ref scoping to protect it: a pull
  # request exporting here would publish unreviewed layers into the tag every branch and every
  # release then builds on. Pull requests keep *importing* — including forks, whose read-only
  # token still pulls a public package, and whose miss is a slow build rather than a failure
  # since BuildKit treats an unreadable `cache-from` as a warning.
  #
  # The single exception is the release-please branch, which exports to `release-pr-deps-<arch>`
  # instead — a different tag, so it can never overwrite what `main` wrote. The `changes` job's
  # `decide the deps cache scope` step holds that rule and the branch protection it depends on.
  #
  # Deliberately **not** `needs: lint`. A warm-up is not a gate: nothing it produces reaches a
  # registry, and `docker`, `docker-arm64` and `docker-frontend` all still wait on `lint`. Gating
  # the warm-up too only severed the cache lineage — `main` went red on a three-file `cargo fmt`
  # diff, this job was skipped on every push after it, and `backend-deps-<arch>` was never written
  # at all, so the next release warm-up cooked ~600 crates cold. One wasted deps build on a red
  # `main` is cheaper than a cold cache that compounds across every later run.
  docker-deps:
    name: docker build (deps, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: [changes]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read # to check out the build context
      packages: write # to export the layer cache to ghcr.io
    strategy:
      fail-fast: false
      # amd64 always; arm64 off pull requests. `changes` owns the rule and says why.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.arches) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `SOURCE_DATE_EPOCH` arrives from this file's workflow-level `env:` and is part of the key
      # this step writes — which is precisely why it is a constant there. This build exports no
      # image, so the value clamps nothing here; it is set anyway so the tag stays readable by the
      # publishing legs in release-please.yaml, which do export one.
      # `build-cache`, so one export carries the musl chain *and* the wasm one under one tag. That
      # is what keeps every consumer on a single lineage — see the stage's comment in
      # `deploy/docker/Dockerfile` for the 43 minutes the second lineage cost `docker-frontend`
      # on every run. `builder` and `wasm-builder` share no edge, so this stays one solve's worth
      # of wall clock rather than two, and it replaces the `docker-wasm-deps` job that used to run
      # beside it.
      - name: cook both dependency graphs and compile every binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          target: build-cache
          push: false
          outputs: type=cacheonly
          provenance: false
          # `release-pr-deps-<arch>` is imported here as well as by `release-please.yaml`, and it
          # matters most on the one push where this job is otherwise at its worst: merging a
          # release PR changes `Cargo.toml` and `Cargo.lock`, every workspace crate's metadata
          # hash with them, so `builder` misses `backend-deps-<arch>` and recompiles all 26 —
          # 43 minutes, beside `release-please.yaml` compiling the identical tree. The PR run
          # already did that work under a key this push can read.
          cache-from: |
            type=registry,ref=${{ needs.changes.outputs.buildcache }}:backend-deps-${{ matrix.arch }}
            type=registry,ref=${{ needs.changes.outputs.buildcache }}:release-pr-deps-${{ matrix.arch }}
          # The tag comes from `changes`, which is where the rule for choosing it lives.
          cache-to: ${{ needs.changes.outputs.deps_scope != '' && format('type=registry,ref={0}:{1}-{2},mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true', needs.changes.outputs.buildcache, needs.changes.outputs.deps_scope, matrix.arch) || '' }}

  docker:
    name: docker build (${{ matrix.bin }})
    runs-on: ubuntu-latest
    # 60 for the same reason `docker-frontend` carries 90: with no cache to import these legs
    # build the whole `builder` chain themselves. `render` came in at 38m against the old 45.
    timeout-minutes: 60
    needs: [changes, lint, docker-deps]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read # to check out the build context
      packages: read # to import the layer cache from ghcr.io
    strategy:
      fail-fast: false
      matrix:
        # Two images on a pull request, all eight on `main` and on the weekly run. The `changes`
        # job decides and says why.
        bin: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.bin }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            BIN=${{ matrix.bin }}
          # The render tier needs a real browser at runtime (Chromium), so it selects the
          # dedicated runtime-browser stage; every other binary is a musl build that ships on
          # the default `scratch` runtime.
          target: ${{ matrix.bin == 'render' && 'runtime-browser' || 'runtime' }}
          push: false
          # Loaded into the local daemon so container-structure-test can inspect it by tag.
          load: true
          tags: tankovault-${{ matrix.bin }}:ci
          # No attestation/provenance layer. Nothing here is published — the image is built to be
          # structure-tested and thrown away. It still inherits the workflow-level
          # `SOURCE_DATE_EPOCH`, because that value is part of the key it looks up.
          provenance: false
          # Import only — this job deliberately writes no cache. `backend-deps-amd64` is published
          # by `docker-deps` in this same run at this same commit, which is what makes `COPY . .`
          # inside `builder` a hit; this leg's remaining work is one `COPY` onto `scratch`.
          #
          # Do not add `cache-to`: `mode=max` re-exports imported layers too, so each leg would
          # upload its own copy of the multi-gigabyte `cook` layer. On the Actions cache that
          # evicted `backend-deps` itself; on GHCR it instead makes every later import pull a
          # duplicate chain, which is a slower gate for no benefit either way.
          # `deps_scope` first: it is what `docker-deps` exported *in this run, at this commit*,
          # so on a pull request it is the only tag that can hit once this branch touches the
          # Dockerfile. `backend-deps-amd64` stays as the fallback for the runs that write it.
          cache-from: |
            ${{ needs.changes.outputs.deps_scope != '' && format('type=registry,ref={0}:{1}-amd64', needs.changes.outputs.buildcache, needs.changes.outputs.deps_scope) || '' }}
            type=registry,ref=${{ needs.changes.outputs.buildcache }}:backend-deps-amd64

      # The generated documents, on the host: `--target contract` is a `scratch` stage holding
      # nothing but them, so this is a cache hit against the build above plus a layer export. The
      # `.labels` file it writes is what the step below holds the built *image* to.
      - name: export the generated contracts
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          target: contract
          outputs: type=local,dest=${{ runner.temp }}/contract-out
          provenance: false
          cache-from: |
            ${{ needs.changes.outputs.deps_scope != '' && format('type=registry,ref={0}:{1}-amd64', needs.changes.outputs.buildcache, needs.changes.outputs.deps_scope) || '' }}
            type=registry,ref=${{ needs.changes.outputs.buildcache }}:backend-deps-amd64

      # The checkpoint the labels exist for. See the script for why it reads the image rather than
      # the Dockerfile, and why the embedded document is compared as well.
      - name: the image publishes the contract it was built to publish
        env:
          BIN: ${{ matrix.bin }}
          TAG: ci
        run: |
          bash .github/scripts/verify-config-contract.sh \
            "tankovault-${BIN}:${TAG}" \
            "${RUNNER_TEMP}/contract-out/${BIN}.labels" \
            "${RUNNER_TEMP}/contract-out/${BIN}.json"

      # Enforces the image contract: non-root 1001:1001, the entrypoint, the baked-in binary and CA
      # trust store, and for the render tier the absence of root plus the presence of Chromium.
      - name: install container-structure-test
        run: |
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CONTAINER_STRUCTURE_TEST_VERSION}"
          asset="container-structure-test-linux-amd64"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${asset}" -O "${base}/checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum -c -
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/container-structure-test

      - name: structure-test ${{ matrix.bin }} image
        env:
          BIN: ${{ matrix.bin }}
        run: |
          config="deploy/docker/cst/service.yaml"
          if [ "$BIN" = "render" ]; then
            config="deploy/docker/cst/render.yaml"
          fi
          # Two configs: the image's own contract, plus the musl loader assertion, whose path is
          # the one thing in the contract that differs by architecture. See
          # `deploy/docker/cst/loader-amd64.yaml`.
          container-structure-test test \
            --image "tankovault-${BIN}:ci" \
            --config "$config" \
            --config deploy/docker/cst/loader-amd64.yaml

  # Cross-architecture build. Native, not QEMU: `wreq` compiles BoringSSL from C/C++/assembly and
  # an emulated build costs upwards of an hour.
  #
  # This ran behind an `ENABLE_ARM64_CI` repository variable until releases began publishing, on
  # the grounds that `ubuntu-24.04-arm` runners bill on private repositories. It is unconditional
  # now because every release publishes `linux/arm64` for all nine images: with it off, a release
  # was the first time that path ran. That is how five hard-coded `ld-musl-x86_64.so.1` paths
  # survived unnoticed — the loader is `ld-musl-aarch64.so.1` on arm64, so every runtime stage
  # would have failed at `COPY`. The libraries now stage into `/sysroot*` trees from `uname -m`,
  # and the structure tests carry the same split. Do not put the gate back without also accepting
  # that a tag is where arm64 breakage would surface.
  #
  # Scoped to the two images whose content differs by architecture: a `scratch` service and the
  # Debian-based `render` tier.
  #
  # These legs used to cook their own dependency graph into a per-image scope
  # (`arm64-api`, `arm64-render`), which held two full duplicates of one arm64 `builder` chain in a
  # 10 GB LRU budget and was readable by nothing else — least of all the release, which builds
  # nine arm64 images. They now import the shared `backend-deps-arm64` and write nothing, exactly
  # as the amd64 `docker` legs treat `backend-deps-amd64`.
  docker-arm64:
    name: docker build (arm64, ${{ matrix.bin }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: [changes, lint, docker-deps]
    # `arm64` is false on pull requests, where `docker-deps` builds no arm64 leg and there is no
    # `backend-deps-arm64` at this commit for these legs to import. Without the second test they
    # would not skip — they would cook their own arm64 dependency graph, which is the 30 minutes
    # dropping the warm-up was meant to save.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.docker == 'true' && needs.changes.outputs.arm64 == 'true' }}
    permissions:
      contents: read # to check out the build context
      packages: read # to import the layer cache from ghcr.io
    strategy:
      fail-fast: false
      matrix:
        bin: [api, render]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.bin }} image (linux/arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          build-args: |
            BIN=${{ matrix.bin }}
          target: ${{ matrix.bin == 'render' && 'runtime-browser' || 'runtime' }}
          push: false
          load: true
          tags: tankovault-${{ matrix.bin }}:ci-arm64
          provenance: false
          # Same ordering as the amd64 leg: this run's own export first, `main`'s as the fallback.
          cache-from: |
            ${{ needs.changes.outputs.deps_scope != '' && format('type=registry,ref={0}:{1}-arm64', needs.changes.outputs.buildcache, needs.changes.outputs.deps_scope) || '' }}
            type=registry,ref=${{ needs.changes.outputs.buildcache }}:backend-deps-arm64

      # The generated documents, on the host: `--target contract` is a `scratch` stage holding
      # nothing but them, so this is a cache hit against the build above plus a layer export. The
      # `.labels` file it writes is what the step below holds the built *image* to.
      - name: export the generated contracts
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          target: contract
          outputs: type=local,dest=${{ runner.temp }}/contract-out
          provenance: false
          cache-from: |
            ${{ needs.changes.outputs.deps_scope != '' && format('type=registry,ref={0}:{1}-arm64', needs.changes.outputs.buildcache, needs.changes.outputs.deps_scope) || '' }}
            type=registry,ref=${{ needs.changes.outputs.buildcache }}:backend-deps-arm64

      # The checkpoint the labels exist for. See the script for why it reads the image rather than
      # the Dockerfile, and why the embedded document is compared as well.
      - name: the image publishes the contract it was built to publish
        env:
          BIN: ${{ matrix.bin }}
          TAG: ci-arm64
        run: |
          bash .github/scripts/verify-config-contract.sh \
            "tankovault-${BIN}:${TAG}" \
            "${RUNNER_TEMP}/contract-out/${BIN}.labels" \
            "${RUNNER_TEMP}/contract-out/${BIN}.json"

      # The same image contract as the amd64 leg. `container-structure-test` ships a separate
      # arm64 binary; the config files are architecture-independent.
      - name: install container-structure-test
        run: |
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CONTAINER_STRUCTURE_TEST_VERSION}"
          asset="container-structure-test-linux-arm64"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${asset}" -O "${base}/checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum -c -
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/container-structure-test

      - name: structure-test ${{ matrix.bin }} image
        env:
          BIN: ${{ matrix.bin }}
        run: |
          config="deploy/docker/cst/service.yaml"
          if [ "$BIN" = "render" ]; then
            config="deploy/docker/cst/render.yaml"
          fi
          container-structure-test test \
            --image "tankovault-${BIN}:ci-arm64" \
            --config "$config" \
            --config deploy/docker/cst/loader-arm64.yaml

  docker-frontend:
    name: docker build (frontend)
    runs-on: ubuntu-latest
    # 90, matching `docker-deps`, because this leg still has the workflow's longest cold path: it
    # assembles both compile chains, so with nothing to import it builds `builder` *and*
    # `wasm-builder`. That happens whenever the Dockerfile itself changes, since a pull request
    # exports no cache and `main`'s tag is then keyed on the old file — this job timed out at
    # exactly 45m00s on the change that fixed the toolchain mismatch, having built correctly.
    timeout-minutes: 90
    needs: [changes, lint, docker-deps]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read # to check out the build context
      packages: read # to import the layer cache from ghcr.io
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          target: frontend
          push: false
          # Loaded into the local daemon so container-structure-test can inspect it by tag.
          load: true
          tags: tankovault-frontend:ci
          provenance: false
          # The same two tags every other leg reads, in the same order, and **no third**: both are
          # written from `build-cache`, so they describe one lineage covering both compile chains.
          # Adding a second lineage back — which is what `frontend-deps-amd64` was — makes BuildKit
          # resolve one and drop the other, and this leg then recompiles `cook` and `builder` from
          # cold: 43 minutes here against under a minute for its nine siblings, on every run. The
          # stage comment in `deploy/docker/Dockerfile` carries the measurement.
          #
          # Import only, write neither: a `mode=max` export here re-uploads imported layers too, so
          # it would publish a second copy of the whole chain under this image's own tag and every
          # later import would pull it twice.
          cache-from: |
            ${{ needs.changes.outputs.deps_scope != '' && format('type=registry,ref={0}:{1}-amd64', needs.changes.outputs.buildcache, needs.changes.outputs.deps_scope) || '' }}
            type=registry,ref=${{ needs.changes.outputs.buildcache }}:backend-deps-amd64

      # The generated documents, on the host: `--target contract` is a `scratch` stage holding
      # nothing but them, so this is a cache hit against the build above plus a layer export. The
      # `.labels` file it writes is what the step below holds the built *image* to.
      - name: export the generated contracts
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          target: contract
          outputs: type=local,dest=${{ runner.temp }}/contract-out
          provenance: false
          cache-from: |
            ${{ needs.changes.outputs.deps_scope != '' && format('type=registry,ref={0}:{1}-amd64', needs.changes.outputs.buildcache, needs.changes.outputs.deps_scope) || '' }}
            type=registry,ref=${{ needs.changes.outputs.buildcache }}:backend-deps-amd64

      # The checkpoint the labels exist for. See the script for why it reads the image rather than
      # the Dockerfile, and why the embedded document is compared as well.
      - name: the image publishes the contract it was built to publish
        run: |
          bash .github/scripts/verify-config-contract.sh \
            "tankovault-frontend:ci" \
            "${RUNNER_TEMP}/contract-out/frontend.labels" \
            "${RUNNER_TEMP}/contract-out/frontend.json"

      # Enforces the frontend image contract: non-root 1001:1001, the unprivileged 3000 port, the
      # entrypoint, the static-dir env var, and the server binary plus built SPA bundle.
      - name: install container-structure-test
        run: |
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${CONTAINER_STRUCTURE_TEST_VERSION}"
          asset="container-structure-test-linux-amd64"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "${base}/${asset}" -O "${base}/checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum -c -
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/container-structure-test

      - name: structure-test frontend image
        run: |
          container-structure-test test \
            --image "tankovault-frontend:ci" \
            --config deploy/docker/cst/frontend.yaml \
            --config deploy/docker/cst/loader-amd64.yaml

  # The one required status check — point branch protection here and nowhere else. Naming the
  # individual jobs does not survive path filtering: GitHub treats a check that never reports as
  # pending forever, so every skipped job would block its own pull request.
  #
  # Not `if: success()`, which would inherit the skips. It always runs and fails only on a real
  # `failure` or `cancelled`; a skipped job is one whose inputs did not change, which is a pass.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - lint
      - test
      - features
      - sqlx
      - integration
      - openapi-breaking
      - frontend
      - css
      - secrets
      - msrv
      - coverage
      - coverage-integration
      - mutants
      - deny
      - notices
      - audit
      - supply-chain
      - compose
      - readme
      - docker-deps
      - docker
      - docker-arm64
      - docker-frontend
    permissions: {}
    steps:
      - name: verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "::error::a required job reported '$r'"
                exit 1
                ;;
            esac
          done
          echo "All required jobs passed or were skipped as unaffected."
